<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#142439">
<title>스태프 — 과수원피스</title>
<style>
@font-face{font-family:"SCDream";font-weight:400;font-display:swap;src:url('fonts/SCDream4.woff') format('woff');}
@font-face{font-family:"SCDream";font-weight:700;font-display:swap;src:url('fonts/SCDream7.woff') format('woff');}
:root{--page:#F6F3EC;--surface:#FFFDFA;--surface-2:#F1ECE2;--navy:#142439;--ink:#17283A;--muted:#5C6670;--teal:#086F7D;--teal-soft:#E3F0F1;
  --gold:#B68B48;--gold-soft:#F4EAD7;--line:#DDD7CC;--danger:#B23A30;--danger-soft:#FBE9E7;--ok:#2F7A4F;--ok-soft:#E5F3EA;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"SCDream",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--page);color:var(--ink);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:19px}
header .t small{opacity:.75;font-size:13px}
header button{min-height:40px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.14);font-size:14px}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + var(--safe-b))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:14px;color:var(--muted);font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:0 14px;font-size:20px}
textarea{min-height:120px;padding:12px 14px;font-size:16px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.btn{min-height:56px;border-radius:14px;font-weight:700;font-size:18px;padding:0 18px;width:100%;background:var(--surface-2);color:var(--ink)}
.btn.p{background:var(--teal);color:#fff}
.btn.g{background:var(--gold);color:#fff}
.btn.d{background:var(--danger);color:#fff}
.btn.sm{min-height:44px;width:auto;font-size:15px;padding:0 14px}
.btn.scan{width:auto;flex:0 0 auto;background:var(--navy);color:#fff;font-size:15px}
.btn:disabled{opacity:.45}
.mt{margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-weight:700;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-top:12px}
.check input{width:26px;height:26px;min-height:0}
.who{border-radius:14px;background:var(--surface-2);padding:12px 14px;margin-top:12px}
.who b{font-size:20px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);margin:4px 4px 0 0}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.no{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.res{border-radius:16px;padding:18px;margin-top:14px;text-align:center;font-weight:700}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.no{background:var(--danger-soft);color:var(--danger)}
.res.info{background:var(--gold-soft);color:#7A5520}
.res .big{font-size:28px;line-height:1.3}
.res .sub{font-size:15px;font-weight:400;margin-top:6px;color:var(--ink)}
.list .row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .row div{flex:1;min-width:0}
.list small{color:var(--muted)}
.teams{display:grid;gap:10px;margin-top:12px}
.teams button{min-height:72px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;text-align:left;padding:0 18px}
.teams button.on{border-color:var(--teal);background:var(--teal-soft)}
.muted{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
#scanner{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#scanner video{width:100%;max-height:80vh;object-fit:cover}
#scanner .frame{position:absolute;width:min(70vw,300px);aspect-ratio:1;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scanner p{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);color:#fff;font-weight:700}
#scanner button{position:absolute;bottom:calc(var(--safe-b) + 28px);min-height:52px;padding:0 28px;border-radius:99px;background:#fff;font-weight:700}
#bandPrint{display:none}
.bandonly,.btn.scan{display:none!important}
.btn.scanon{width:auto;flex:0 0 auto;background:var(--navy);color:#fff;font-size:15px}
.vcand{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.menu a.btn,.menu button.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;min-height:64px;font-size:17px}
@media print{
  body{background:#fff}header,main,#scanner{display:none!important}
  #bandPrint{display:grid!important;grid-template-columns:repeat(4,1fr);gap:4mm;padding:4mm}
  .bp{border:1px dashed #999;border-radius:2mm;padding:2mm;text-align:center;break-inside:avoid}
  .bp img{width:30mm;height:30mm;image-rendering:pixelated}.bp b{display:block;font-size:16pt}
}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="t"><b id="hTask">담당</b><small id="hLabel"></small></div>
  <button id="btnOut" type="button">로그아웃</button>
</header>

<main>
  <!-- 로그인 -->
  <section id="scLogin">
    <h1 style="font-size:24px;margin:8px 0 4px">스태프 로그인</h1>
    <p class="muted">총괄에게 받은 6자리 담당 PIN을 넣으면 내 업무 화면만 열려요.</p>
    <div class="card">
      <label for="pin">담당 PIN</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
      <button class="btn p mt" id="btnLogin" type="button">로그인</button>
      <p class="muted" id="loginMsg" style="color:var(--danger);font-weight:700"></p>
    </div>
    <details class="card"><summary style="font-weight:700">총괄(관리자) 로그인</summary>
      <label for="apin">관리자 PIN</label><input id="apin" type="password" autocomplete="off">
      <button class="btn mt" id="btnAdmin" type="button">관리자로 로그인</button>
    </details>
  </section>

  <section id="scTask" hidden></section>
</main>

<div id="scanner" hidden>
  <video id="scVideo" playsinline muted></video>
  <div class="frame"></div>
  <p>QR을 네모 안에 맞춰 주세요</p>
  <button id="scClose" type="button">닫기</button>
</div>
<div id="bandPrint"></div>

<script src="qr.js"></script>
<script src="ev-client.js?v=8"></script>
<script>
(function(){
'use strict';
/* ?ev=test → 매장 테스트(gwtest). 코드는 같고 데이터만 따로 */
var TEST=/[?&]ev=test\b/.test(location.search), EID=TEST?'gwtest':'gwasu';
if(TEST){document.title='[테스트] '+document.title;document.addEventListener('DOMContentLoaded',function(){var t=document.getElementById('hTask');if(t)t.insertAdjacentHTML('beforebegin','<span style="background:#E8742A;color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;margin-right:6px">테스트</span>')})}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function h(html){var d=document.createElement('div');d.innerHTML=html;return d}
function rid(){return EV.newId()}
var TIER={TOP:'상위 상품',A:'A상',B:'B상',C:'C상',D:'D상',FREE:'무료 뽑기권',X:'꽝'};
/* 2026-10-21: 당일은 손목띠 찬 사람 = 패스 산 사람(눈으로 확인). 손목띠 QR·패스 등록·입장 기록은 안 씀 → 화면에서 숨김(.bandonly) */
var TASKS={vote:'무대 인기투표 진행',votehelp:'현장 투표 지원',hq:'본부 미션 보상',draw:'뽑기',pickup:'상품 수령',extra:'추가 도전 판매'};
function call(n,d){return EV.staff(n,Object.assign({eventId:EID},d||{}))}
function errMsg(e){return (e&&(e.message||e.reason))||'처리하지 못했어요'}

/* ---------- 결과 박스 ---------- */
function res(el,kind,big,sub){el.innerHTML='<div class="res '+kind+'"><div class="big">'+esc(big)+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'}
function whoHtml(w){
  return '<div class="who"><b>'+esc(w.nickname||'(이름 없음)')+'</b> '+(w.code?'<span class="chip">참가번호 '+esc(w.code)+'</span>':'')+
    (w.offline?'<span class="chip">폰 없음</span>':'')+'</div>';
}
/* 번호 입력 + QR 스캔 한 줄 */
function codeRow(id,ph){return '<div class="inrow"><input id="'+id+'" placeholder="'+(ph||'참가번호 6자리')+'" autocomplete="off" autocapitalize="characters"><button class="btn scan" data-scan="'+id+'" type="button">QR 스캔</button></div>'}
function busy(btn,p){btn.disabled=true;return p.then(function(r){btn.disabled=false;return r},function(e){btn.disabled=false;throw e})}

/* ---------- QR 스캐너 ---------- */
var stream=null, scanCb=null, raf=0;
function scan(cb){
  scanCb=cb; $('scanner').hidden=false;
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){
    stream=s; var v=$('scVideo'); v.srcObject=s; v.play(); tick();
  },function(){stopScan();alert('카메라를 쓸 수 없어요. 번호를 직접 입력해 주세요.')});
}
function tick(){
  var v=$('scVideo');
  if(v.readyState>=2&&window.jsQR){
    var c=tick.c||(tick.c=document.createElement('canvas')), w=v.videoWidth, hh=v.videoHeight, s=Math.min(1,640/w);
    c.width=w*s;c.height=hh*s; var x=c.getContext('2d'); x.drawImage(v,0,0,c.width,c.height);
    var img=x.getImageData(0,0,c.width,c.height), q=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
    if(q&&q.data){var cb=scanCb;stopScan();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){};cb(q.data);return}
  }
  raf=requestAnimationFrame(tick);
}
function stopScan(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;$('scanner').hidden=true}
$('scClose').onclick=stopScan;
var jsqrLoading=null;
function needJsqr(){if(window.jsQR)return Promise.resolve();return jsqrLoading||(jsqrLoading=new Promise(function(ok,no){var s=document.createElement('script');s.src='jsqr.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)}))}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-scan]'); if(!b) return;
  var inp=$(b.dataset.scan);
  needJsqr().then(function(){scan(function(t){
    t=String(t).trim(); var m=/PSB[WP]-([A-Z0-9]+)/i.exec(t)||/[?&](?:c|code)=([A-Z0-9]+)/i.exec(t);
    inp.value=(m?m[0].indexOf('PSB')===0?m[0]:m[1]:t).toUpperCase();
    inp.dispatchEvent(new Event('scanned'));
  })});
});

/* ---------- 로그인 ---------- */
/* 2026-10-24: 본 행사는 관리자 = 스태프. 관리자 PIN 하나로 모든 화면. (매장 테스트 ?ev=test 는 예전 로그인 그대로) */
if(!TEST){
  $('scLogin').innerHTML='<h1 style="font-size:24px;margin:8px 0 4px">관리자 로그인</h1><p class="muted">관리자 PIN 하나로 필요한 화면이 모두 열려요.</p>'+
    '<div class="card"><label for="apin">관리자 PIN</label><input id="apin" type="password" inputmode="numeric" autocomplete="off">'+
    '<button class="btn p mt" id="btnAdmin" type="button">로그인</button><p class="muted" id="loginMsg" style="color:var(--danger);font-weight:700"></p></div>';
  $('apin').addEventListener('keydown',function(e){if(e.key==='Enter')$('btnAdmin').click()});
}
if(TEST)$('btnLogin').onclick=function(){
  var b=this; $('loginMsg').textContent='';
  busy(b,EV.taskLogin($('pin').value.trim())).then(function(){$('pin').value='';start()},function(e){$('loginMsg').textContent=errMsg(e)});
};
if(TEST)$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')$('btnLogin').click()});
$('btnAdmin').onclick=function(){
  var b=this; busy(b,EV.pinLogin($('apin').value.trim(),'admin')).then(function(){$('apin').value='';start()},function(e){$('loginMsg').textContent=errMsg(e)});
};
$('btnOut').onclick=function(){EV.logout();start()};

var adminView=null;
function start(){
  var i=EV.sessionInfo();
  $('scLogin').hidden=!!i; $('hdr').hidden=!i; $('scTask').hidden=!i;
  if(!i) return;
  var task=i.role==='admin'?(adminView||'admin'):i.task;
  $('hTask').textContent=i.role==='admin'?(adminView?'총괄 · '+(TASKS[adminView]||(adminView==='entry'?'행사 입장':adminView==='voucher'?'사전 신청 교환':adminView==='rec'?'행사 기록':adminView)):'총괄'):(i.taskName||TASKS[i.task]||i.task);
  $('hLabel').textContent=(i.label?i.label+' · ':'')+new Date(i.exp).toTimeString().slice(0,5)+'까지 로그인';
  var box=$('scTask'); box.innerHTML='';
  if(i.role==='admin'&&adminView){var back=h('<button class="btn sm" type="button">← 총괄 화면</button>').firstChild;back.onclick=function(){adminView=null;start()};box.appendChild(back)}
  (SCREENS[task.indexOf('npc:')===0?'npc':task.indexOf('rec')===0?'rec':task]||SCREENS.none)(box,task);
}

/* ---------- 업무 화면 ---------- */
var SCREENS={};
SCREENS.none=function(box){box.innerHTML='<div class="card">이 담당 화면이 아직 없어요. 총괄에게 문의해 주세요.</div>'};

/* 공통: 번호 → 실행 버튼 하나 */
function simple(box,o){
  box.appendChild(h('<div class="card"><h2>'+esc(o.title)+'</h2><p class="muted">'+o.lead+'</p>'+codeRow('cIn')+(o.extra||'')+
    '<button class="btn p mt" id="cGo" type="button">'+esc(o.button)+'</button><div id="cRes"></div></div>'));
  var go=function(){
    var code=$('cIn').value.trim(); if(!code){res($('cRes'),'no','번호를 입력하세요');return}
    busy($('cGo'),o.run(code)).then(function(r){o.done(r,$('cRes'));$('cIn').value='';$('cIn').focus()},function(e){res($('cRes'),'no',errMsg(e))});
  };
  $('cGo').onclick=go; $('cIn').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  if(o.autoOnScan!==false) $('cIn').addEventListener('scanned',go);
}

SCREENS.entry=function(box){
  simple(box,{title:'입장 확인',lead:'손목띠 QR이나 참가번호를 확인하고 입장만 기록해요.',button:'입장 확인',
    run:function(c){return call('entryCheck',{code:c})},
    done:function(r,el){res(el,r.already?'info':'ok',r.already?'이미 입장했습니다':'입장 완료',whoHtml(r))}});
};

SCREENS.pass=function(box){
  box.appendChild(h('<div class="card"><h2>당일 패스 활성화</h2><p class="muted">결제 확인 → 새 손목띠 QR 스캔 → 활성화. 손님이 앱을 쓰면 앱에 보이는 참가번호도 같이 넣어요.</p>'+
    '<label class="check"><input type="checkbox" id="pPaid"> 결제 확인했어요</label>'+
    '<label>손목띠 QR</label>'+codeRow('pBand','손목띠 QR 스캔')+
    '<label>앱 참가번호 (폰 없으면 비워 두기)</label>'+codeRow('pApp','앱에 보이는 참가번호')+
    '<button class="btn p mt" id="pGo" type="button">패스 활성화</button><div id="pRes"></div></div>'+
    '<details class="card"><summary style="font-weight:700">이미 패스 있는 손목띠에 나중에 앱 연결</summary>'+
    '<label>손목띠 QR 또는 번호</label>'+codeRow('lBand','손목띠')+'<label>앱 참가번호</label>'+codeRow('lApp','앱 참가번호')+
    '<button class="btn mt" id="lGo" type="button">앱 연결</button><div id="lRes"></div></details>'));
  $('pGo').onclick=function(){
    if(!$('pPaid').checked){res($('pRes'),'no','결제 확인에 체크해 주세요');return}
    busy(this,call('passActivate',{band:$('pBand').value.trim(),appCode:$('pApp').value.trim(),paid:true})).then(function(r){
      res($('pRes'),r.already?'info':'ok',r.already?'이미 활성화된 손목띠입니다':'손목띠 '+r.no+' 활성화 완료',r.linkedApp?'앱과 연결됐어요':'폰 없는 손님 · 참가번호 '+esc(r.code||'')+' (손목띠 번호 '+r.no+'로도 조회돼요)');
      $('pPaid').checked=false;$('pBand').value='';$('pApp').value='';
    },function(e){res($('pRes'),'no',errMsg(e))});
  };
  $('lGo').onclick=function(){
    busy(this,call('passLink',{band:$('lBand').value.trim(),appCode:$('lApp').value.trim()})).then(function(r){res($('lRes'),r.already?'info':'ok',r.already?'이미 연결돼 있어요':'앱 연결 완료');$('lBand').value='';$('lApp').value=''},function(e){res($('lRes'),'no',errMsg(e))});
  };
};

SCREENS.npc=function(box){
  box.appendChild(h('<div class="card" id="npcHead"><p class="muted">미션 불러오는 중…</p></div>'));
  call('npcInfo').then(function(r){
    var n=r.npc||{};
    $('npcHead').innerHTML='<h2>'+esc(n.name||'NPC 미션')+'</h2>'+(n.place?'<p class="muted">장소: '+esc(n.place)+'</p>':'')+(n.line?'<div class="res info" style="text-align:left"><div class="sub" style="margin:0">'+esc(n.line)+'</div></div>':'')+
      (n.active===false?'<div class="res no"><div class="big">지금 자리 비움 상태</div><div class="sub">새 손님 배정이 멈춰 있어요</div></div>':'');
  },function(e){$('npcHead').innerHTML='<p class="muted">'+esc(errMsg(e))+'</p>'});
  simple(box,{title:'미션 완료 확인',lead:'손님이 미션을 마치면 손님 폰에 보이는 참가번호를 넣고 완료를 눌러요.',button:'미션 완료',
    run:function(c){return call('npcComplete',{code:c})},
    done:function(r,el){res(el,r.already?'info':'ok',r.already?'이미 완료했습니다':'완료! 손님 앱에서 상자를 열 수 있어요',esc(r.nickname||''))}});
};

SCREENS.hq=function(box){
  box.appendChild(h('<div class="card"><h2>미션지 완료 → 보상</h2><p class="muted">폰 없는 손님도 같은 보물 상품판에서 보상을 받아요.</p>'+
    '<label>참가번호</label>'+codeRow('hCode')+'<label>미션지 번호</label><input id="hSheet" placeholder="예) M012" autocomplete="off" style="text-transform:uppercase">'+

/* ---------- 별도 행사 기록 담당: 정해진 입력 1종 → 저장 ---------- */
var REC_KIND={score:'점수',join:'참여 확인',text:'번호·메모'};
SCREENS.rec=function(box,task){
  var admin=task==='rec'; /* 총괄이 열어 본 경우: 항목을 고르고, 정정도 할 수 있다 */
  box.appendChild(h('<div class="card" id="rHead"><p class="muted">기록 항목 불러오는 중…</p></div><div id="rBody"></div>'));
  var recId=null, item=null;
  function q(fn,d){return call(fn,Object.assign(admin?{recId:recId}:{},d||{}))}
  if(admin){
    call('recInfo',{}).then(function(r){
      var ids=Object.keys(r.items||{});
      if(!ids.length){$('rHead').innerHTML='<p class="muted">기록 항목이 없어요. 총괄 화면 「행사 기록 항목」에서 먼저 만들어 주세요.</p>';return}
      $('rHead').innerHTML='<h2>행사 기록 결과·정정</h2><label for="rPick">기록 항목</label><select id="rPick">'+ids.map(function(k){return '<option value="'+esc(k)+'">'+esc(r.items[k].name)+'</option>'}).join('')+'</select>';
      $('rPick').onchange=function(){recId=this.value;load()}; recId=ids[0]; load();
    },function(e){$('rHead').innerHTML='<p class="muted">'+esc(errMsg(e))+'</p>'});
  } else load();
  function load(){
    q('recInfo').then(function(r){
      var first=!item||item.id!==r.item.id; item=r.item;
      if(!admin){
        $('hTask').textContent=item.name;
        $('rHead').innerHTML='<h2>'+esc(item.name)+'</h2><p class="muted">'+esc(item.help||('참가번호를 확인하고 '+(item.kind==='join'?'참여를 저장해요.':REC_KIND[item.kind]+'를 넣어 저장해요.')))+'</p>'+
          (item.active===false?'<div class="res no"><div class="big">지금은 기록을 받지 않아요</div><div class="sub">총괄에게 문의해 주세요</div></div>':'');
      }
      if(first) form();
      list(r);
    },function(e){$('rHead').innerHTML='<p class="muted">'+esc(errMsg(e))+'</p>'});
  }
  function valInput(id){return item.kind==='join'?'':'<label for="'+id+'">'+esc(REC_KIND[item.kind])+(item.unit?' ('+esc(item.unit)+')':'')+'</label><input id="'+id+'" '+(item.kind==='score'?'inputmode="numeric"':'maxlength="30"')+' autocomplete="off">'}
  function form(){
    $('rBody').innerHTML='';
    if(!admin){
      $('rBody').appendChild(h('<div class="card"><label>참가번호</label>'+codeRow('rCode')+valInput('rVal')+'<button class="btn p mt" id="rGo" type="button">저장</button><div id="rRes"></div></div>'));
      var save=function(){
        var c=$('rCode').value.trim(); if(!c){res($('rRes'),'no','번호를 입력하세요');return}
        var v=$('rVal')?$('rVal').value.trim():true;
        if(item.kind!=='join'&&v===''){res($('rRes'),'no',REC_KIND[item.kind]+'를 넣어 주세요');$('rVal').focus();return}
        busy($('rGo'),call('recSave',{code:c,value:v})).then(function(r){
          res($('rRes'),r.already?'info':'ok',r.already?'이미 기록했습니다':'저장 완료',esc(r.nickname||'')+(item.kind==='join'?'':' · <b>'+esc(r.value)+esc(item.unit||'')+'</b>')+(r.already?'<br>바꿔야 하면 총괄에게 말해 주세요':''));
          $('rCode').value='';if($('rVal'))$('rVal').value='';$('rCode').focus();load();
        },function(e){res($('rRes'),'no',errMsg(e))});
      };
      $('rGo').onclick=save;
      $('rCode').addEventListener('keydown',function(e){if(e.key==='Enter'){if($('rVal'))$('rVal').focus();else save()}});
      $('rCode').addEventListener('scanned',function(){if($('rVal'))$('rVal').focus();else save()});
      if($('rVal'))$('rVal').addEventListener('keydown',function(e){if(e.key==='Enter')save()});
    } else {
      $('rBody').appendChild(h('<div class="card"><h2>기록 정정 (총괄만)</h2><label>참가번호</label>'+codeRow('fCode')+valInput('fVal')+'<input id="fWhy" class="mt" placeholder="사유 (꼭 적기)">'+
        '<div class="two mt">'+(item.kind==='join'?'<button class="btn p" id="fGo" type="button">참여로 기록</button>':'<button class="btn p" id="fGo" type="button">값 바꾸기</button>')+'<button class="btn d" id="fDel" type="button">기록 지우기</button></div><div id="fRes"></div></div>'));
      var fix=function(remove,btn){
        busy(btn,q('recFix',{code:$('fCode').value.trim(),value:$('fVal')?$('fVal').value.trim():true,remove:remove,reason:$('fWhy').value.trim()})).then(function(r){
          res($('fRes'),'ok',r.removed?'기록을 지웠어요':'정정 완료','사유가 기록에 남았어요');$('fCode').value='';if($('fVal'))$('fVal').value='';$('fWhy').value='';load();
        },function(e){res($('fRes'),'no',errMsg(e))});
      };
      $('fGo').onclick=function(){fix(false,this)};
      $('fDel').onclick=function(){if(confirm('이 참가자의 기록을 지울까요?'))fix(true,this)};
    }
    $('rBody').appendChild(h('<div class="card"><h2 id="rCnt">기록</h2><div class="list" id="rList"></div></div>'));
  }
  function list(r){
    $('rCnt').textContent='기록 '+r.count+'건'+(item.kind==='score'?' · 높은 순':' · 최근 순')+(r.count>r.rows.length?' (위 '+r.rows.length+'건)':'');

    '<div class="card"><h2>정정 (총괄만)</h2><div class="bandonly"><label>손목띠 재발급: 기존 → 새 손목띠</label>'+codeRow('rOld','기존 손목띠')+'<div class="mt"></div>'+codeRow('rNew','새 손목띠 QR')+'<input id="rWhy" class="mt" placeholder="사유 (예: 분실)"><button class="btn mt" id="rGo" type="button">재발급</button>'+
    '<label>패스 취소 (결제 취소·잘못된 활성화)</label>'+codeRow('xCode')+'<input id="xWhy" class="mt" placeholder="사유"><button class="btn d mt" id="xGo" type="button">패스 취소</button></div>'+
    '<button class="btn mt" id="vReset" type="button">투표 초기화(표 전부 삭제)</button><div id="rRes"></div></div>'+
    '<div class="card"><h2>추가 도전 판매 기록</h2><p class="muted">실수로 지급한 건은 사유를 남기고 취소해요(이미 쓴 횟수는 못 되돌려요).</p><button class="btn mt" id="xLoad" type="button">기록 보기</button><div class="list mt" id="xList"></div><div id="xRes"></div></div>'+
    '<div class="card"><h2>보물 장소·상품판·NPC</h2><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="bury.html'+(TEST?'?ev=test':'')+'">보물 관리 화면 열기</a></div>'));
  $('aViews').innerHTML=Object.keys(TASKS).concat('rec').map(function(k){return '<button class="btn sm" data-view="'+k+'" type="button" style="width:100%">'+(TASKS[k]||'행사 기록')+'</button>'}).join('');
  $('xLoad').onclick=function(){busy(this,call('extraList')).then(function(r){
    $('xList').innerHTML=r.items.length?r.items.map(function(x){return '<div class="row"><div><b>'+esc(x.nickname||'')+'</b> · '+(x.price||0).toLocaleString()+'원 · '+x.plays+'회'+(x.gyul?' · 감귤 '+x.gyul:'')+'<br><small>'+new Date(x.at).toTimeString().slice(0,5)+' · '+esc(x.by||'')+(x.status==='canceled'?' · 취소됨('+esc(x.cancelReason||'')+')':'')+'</small></div>'+(x.status==='ok'?'<button class="btn sm d" data-xc="'+esc(x.requestId)+'" type="button">취소</button>':'')+'</div>'}).join(''):'<p class="muted">판매 기록이 없어요.</p>';
  },function(e){res($('xRes'),'no',errMsg(e))})};
  $('xList').onclick=function(e){var b=e.target.closest('[data-xc]');if(!b)return;var why=prompt('취소 사유');if(!why)return;

  $('aViews').onclick=function(e){var b=e.target.closest('[data-view]');if(b){adminView=b.dataset.view;start()}};

  $('aTask').onchange=function(){$('aNpc').hidden=this.value!=='npc';$('aRec').hidden=this.value!=='rec'};

  function recDraw(){
    var ids=Object.keys(RECS);
    $('recItems').innerHTML=ids.length?ids.map(function(k){return recRow(k,RECS[k])}).join(''):'<p class="muted">아직 항목이 없어요.</p>';
    var saved=ids.filter(function(k){return RECS[k].name});
    $('aRec').innerHTML=saved.map(function(k){return '<option value="'+esc(k)+'">'+esc(RECS[k].name)+'</option>'}).join('')||'<option value="">(항목을 먼저 저장하세요)</option>';
  }
  function recRead(){var o={};$('recItems').querySelectorAll('.rrow').forEach(function(r){o[r.dataset.id]={name:r.querySelector('.rn').value.trim(),kind:r.querySelector('.rk').value,unit:r.querySelector('.ru').value.trim(),help:r.querySelector('.rh').value.trim(),active:r.querySelector('.ra').checked}});return o}
  call('ownerRecCfg',{}).then(function(r){RECS=r.items||{};recDraw();pins()},function(e){res($('recRes'),'no',errMsg(e))});

  $('recSaveCfg').onclick=function(){busy(this,call('ownerRecCfg',{items:recRead()})).then(function(r){RECS=r.items||{};recDraw();res($('recRes'),'ok','저장했어요','이름이 빈 항목은 빠져요')},function(e){res($('recRes'),'no',errMsg(e))})};
  function taskLabel(t){return TASKS[t]||(t.indexOf('rec:')===0?'행사 기록 · '+((RECS[t.slice(4)]||{}).name||t.slice(4)):t.indexOf('npc:')===0?'NPC 미션 · '+t.slice(4):t)}
  function pins(){EV.staff('ownerTaskPins',{}).then(function(r){
    $('aPins').innerHTML=r.items.filter(function(p){return p.active}).map(function(p){return '<div class="row"><div><b>'+esc(taskLabel(p.task))+'</b> '+esc(p.label||'')+'<br><small>PIN ··'+esc(p.last2)+'</small></div><button class="btn sm d" data-rv="'+esc(p.id)+'" type="button">회수</button></div>'}).join('')||'<p class="muted">발급한 PIN이 없어요.</p>';
  })}
  $('aMake').onclick=function(){
    var t=$('aTask').value; if(t==='npc') t='npc:'+$('aNpc').value.trim();
    if(t==='rec'){if(!$('aRec').value){res($('aPin'),'no','행사 기록 항목을 먼저 저장해 주세요');return}t='rec:'+$('aRec').value}
    busy(this,EV.staff('ownerTaskPins',{action:'create',task:t,label:$('aLabel').value.trim()})).then(function(r){
      res($('aPin'),'ok','PIN '+r.pin,esc(taskLabel(r.task))+' · '+esc(r.label||'')+'<br>지금 담당자에게 전달하세요. 다시 볼 수 없어요.');$('aLabel').value='';pins();
    },function(e){res($('aPin'),'no',errMsg(e))});
  };
  $('aPins').onclick=function(e){var b=e.target.closest('[data-rv]');if(!b||!confirm('이 PIN을 회수할까요? 로그인 중인 화면도 바로 끊겨요.'))return;busy(b,EV.staff('ownerTaskPins',{action:'revoke',id:b.dataset.rv})).then(pins)};
  pins();
  function printBands(items){
    $('bandPrint').innerHTML=items.map(function(b){var q=qrcode(0,'M');q.addData(b.qr);q.make();return '<div class="bp"><img src="'+q.createDataURL(4,1)+'"><b>'+String(b.no).padStart(4,'0')+'</b></div>'}).join('');
    setTimeout(function(){window.print()},300);
  }
  $('bMake').onclick=function(){busy(this,call('ownerMakeBands',{count:+$('bCount').value||0})).then(function(r){res($('bRes'),'ok',r.items.length+'개 만들었어요','손목띠 '+r.items[0].no+' ~ '+r.items[r.items.length-1].no);printBands(r.items)},function(e){res($('bRes'),'no',errMsg(e))})};

  $('rGo').onclick=function(){busy(this,call('bandReissue',{oldBand:$('rOld').value.trim(),newBand:$('rNew').value.trim(),reason:$('rWhy').value.trim()})).then(function(r){res($('rRes'),'ok','새 손목띠 '+r.no+' 연결 완료','기록은 그대로예요')},function(e){res($('rRes'),'no',errMsg(e))})};

  $('vReset').onclick=function(){if(!confirm('투표를 처음 상태로 돌리고 표를 전부 지울까요?'))return;busy(this,call('voteHost',{action:'ready'})).then(function(){res($('rRes'),'ok','투표 초기화 완료')},function(e){res($('rRes'),'no',errMsg(e))})};

/* 사전 신청 교환: 교환 QR → 손목띠 지급 처리 (패스 사전 신청, 2026-10-24) */
SCREENS.voucher=function(box){
  box.appendChild(h('<div class="card"><h2>사전 신청 교환</h2><p class="muted">손님 폰의 교환 QR을 찍으면 이름과 받을 개수가 떠요. 손목띠를 채워 준 뒤 「지급 완료」를 눌러요.</p>'+
    '<div class="inrow"><input id="vIn" placeholder="교환 QR" autocomplete="off" autocapitalize="characters"><button class="btn scanon" data-scan="vIn" type="button">QR 스캔</button></div>'+
    '<div id="vRes"></div>'+
    '<details style="margin-top:10px"><summary style="font-weight:700">QR이 없을 때 이름·전화 뒷자리로 찾기</summary><input id="vQ" class="mt" placeholder="이름 또는 전화번호 뒷 4자리" autocomplete="off"><button class="btn mt" id="vFind" type="button">찾기</button><div id="vList"></div></details></div>'));
  function vShow(r,code){
    $('vRes').innerHTML='<div class="res '+(r.left>0?'ok':'info')+'"><div class="big">'+esc(r.name)+' · 손목띠 '+r.left+'개</div><div class="sub">신청 '+r.qty+'개 중 '+r.used+'개 받아 감 · 전화 뒷자리 '+esc(r.phone4)+'</div></div>'+
      (r.left>0?'<label>지금 지급할 개수</label><input id="vCnt" type="number" min="1" max="'+r.left+'" value="'+r.left+'" inputmode="numeric"><button class="btn p mt" id="vGive" type="button">지급 완료</button>':'');
    if(r.left>0) $('vGive').onclick=function(){
      busy(this,call('voucherUse',{code:code,confirm:true,count:+$('vCnt').value})).then(function(g){res($('vRes'),'ok','손목띠 '+g.gave+'개 지급 완료',esc(g.name)+' · 남은 '+g.left+'개');$('vIn').value='';$('vList').innerHTML=''},function(e){res($('vRes'),'no',errMsg(e))});
    };
  }
  function vLook(){
    var c=$('vIn').value.trim(); if(!c){res($('vRes'),'no','교환 QR을 찍어 주세요');return}
    call('voucherUse',{code:c}).then(function(r){vShow(r,c)},function(e){res($('vRes'),'no',errMsg(e))});
  }
  $('vIn').addEventListener('scanned',vLook); $('vIn').addEventListener('keydown',function(e){if(e.key==='Enter')vLook()});
  $('vFind').onclick=function(){
    busy(this,call('voucherFind',{q:$('vQ').value.trim()})).then(function(r){
      $('vList').innerHTML=r.items.length?r.items.map(function(x){return '<div class="vcand"><span><b>'+esc(x.name)+'</b> · 뒷자리 '+esc(x.phone4)+' · '+x.left+'개</span><button class="btn sm" data-pick="'+esc(x.code)+'" type="button">선택</button></div>'}).join(''):'<p class="muted">승인되고 남은 신청이 없어요.</p>';
    },function(e){$('vList').innerHTML='<p class="muted">'+esc(errMsg(e))+'</p>'});
  };
  $('vList').addEventListener('click',function(e){var b=e.target.closest('[data-pick]');if(!b)return;$('vIn').value=b.dataset.pick;vLook()});
};

  },function(e){res($('xRes'),'no',errMsg(e))})};
  $('xList').onclick=function(e){var b=e.target.closest('[data-xc]');if(!b)return;var why=prompt('취소 사유');if(!why)return;
    busy(b,call('extraCancel',{requestId:b.dataset.xc,reason:why})).then(function(){$('xLoad').onclick.call($('xLoad'))},function(er){res($('xRes'),'no',errMsg(er))})};
  $('vReset').onclick=function(){if(!confirm('투표를 처음 상태로 돌리고 표를 전부 지울까요?'))return;busy(this,call('voteHost',{action:'ready'})).then(function(){res($('rRes'),'ok','투표 초기화 완료')},function(e){res($('rRes'),'no',errMsg(e))})};

SCREENS.admin=TEST?SCREENS.adminFull:SCREENS.adminLite;

start();
setInterval(function(){if(!$('hdr').hidden&&!EV.sessionInfo())start()},30000);
})();
