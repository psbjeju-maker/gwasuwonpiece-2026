<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#142439">
<title>보물 찾기 — 과수원피스</title>
<style>
@font-face{font-family:"SCDream";font-weight:400;font-display:swap;src:url('fonts/SCDream4.woff') format('woff');}
@font-face{font-family:"SCDream";font-weight:700;font-display:swap;src:url('fonts/SCDream7.woff') format('woff');}
:root{--navy:#142439;--navy-deep:#0E1929;--page:#F6F3EC;--surface:#FFFDFA;--ink:#17283A;--muted:#5C6670;--teal:#086F7D;
  --gold:#E2C489;--gold-deep:#B68B48;--orange:#E8742A;--danger:#B23A30;--ok:#2F7A4F;--line:#DDD7CC;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"SCDream",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--navy-deep);color:#F4EFE6;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.scr{min-height:100%;display:flex;flex-direction:column;padding:20px 18px calc(24px + var(--safe-b));max-width:520px;margin:0 auto}
h1{font-size:24px;margin:6px 0 4px;color:var(--gold)}
.lead{color:#C9D1DB;font-size:15px;margin:0 0 14px;line-height:1.55}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px;margin-top:14px}
.btn{min-height:56px;border-radius:16px;font-weight:700;font-size:17px;padding:0 20px;width:100%}
.btn-gold{background:linear-gradient(180deg,#F2D59B,#D9AE5F);color:#2A1A04;box-shadow:0 6px 0 #9A7232}
.btn-gold:active{transform:translateY(3px);box-shadow:0 3px 0 #9A7232}
.btn-ghost{background:rgba(255,255,255,.1)}
input{width:100%;min-height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);padding:0 14px;font-size:18px;margin-top:6px;-webkit-user-select:text;user-select:text}
label{display:block;font-size:13px;color:#AEB8C4;margin-top:12px;font-weight:700}
.err{color:#FF9C8F;font-weight:700;min-height:1.4em;margin-top:10px}

/* 레이더 */
.radar{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:18px auto 6px;border-radius:50%;
  background:radial-gradient(circle,rgba(226,196,137,.18) 0 22%,rgba(226,196,137,.08) 22% 48%,rgba(226,196,137,.04) 48% 72%,transparent 72%);
  border:2px solid rgba(226,196,137,.35)}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--heat,rgba(226,196,137,.5));animation:ping 2.4s ease-out infinite;opacity:0}
.radar::after{animation-delay:1.2s}
@keyframes ping{0%{transform:scale(.25);opacity:.9}100%{transform:scale(1.05);opacity:0}}
.radar .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.radar .dist{font-size:52px;font-weight:700;line-height:1;color:var(--heat,#F4EFE6)}
.radar .unit{font-size:15px;color:#C9D1DB;margin-top:6px}
.heat-word{text-align:center;font-size:20px;font-weight:700;margin:6px 0 0;min-height:1.5em;color:var(--heat,#F4EFE6)}
.gpsline{text-align:center;font-size:12.5px;color:#8C98A6;margin-top:4px}
.dug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dug span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08)}
.dug span.w{background:rgba(226,196,137,.25);color:var(--gold)}
.poolline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.poolline span{font-size:13px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08)}
.digbtn{margin-top:16px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}

/* 파기 무대 */
#stage{position:fixed;inset:0;z-index:20;background:linear-gradient(#1b2d44 0 38%,#5a3a1e 38%,#3e2712);overflow:hidden;touch-action:manipulation}
#stage .sky-t{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;right:0;text-align:center;font-size:22px;font-weight:700;color:var(--gold);padding:0 16px}
#stage .sky-s{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;text-align:center;font-size:15px;color:#D7DEE7;padding:0 16px}
.ground{position:absolute;left:0;right:0;top:38%;bottom:0}
.hole{position:absolute;left:50%;top:22%;width:var(--hw,40px);height:calc(var(--hw,40px) * .42);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse at 50% 35%,#120a03,#2a1808 70%);box-shadow:inset 0 6px 14px rgba(0,0,0,.7);transition:width .25s,height .25s}
.chest{position:absolute;left:50%;top:22%;width:150px;transform:translate(-50%,10%) scale(.3);opacity:0;transition:transform .7s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.chest.up{transform:translate(-50%,-78%) scale(1);opacity:1}
.chest.shake{animation:cshake .5s ease-in-out infinite}
@keyframes cshake{0%,100%{transform:translate(-50%,-78%) rotate(0)}25%{transform:translate(-50%,-78%) rotate(-5deg)}75%{transform:translate(-50%,-78%) rotate(5deg)}}
.shovel{position:absolute;left:58%;top:2%;width:120px;transform-origin:20% 90%;transform:rotate(18deg);transition:transform .12s}
.shovel.hit{transform:rotate(-22deg) translateY(30px)}
.taps{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 40px);text-align:center}
.taps .bar{width:min(70vw,280px);height:14px;border-radius:7px;background:rgba(0,0,0,.35);margin:10px auto 0;overflow:hidden}
.taps .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F2D59B,#E8742A);transition:width .15s}
.taps b{font-size:28px;color:#FFF;text-shadow:0 2px 0 rgba(0,0,0,.4);animation:pulse .8s infinite;display:inline-block}
.dirt{position:absolute;width:12px;height:12px;border-radius:40%;background:#7a5228;pointer-events:none}

/* 퀴즈 / 결과 시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + var(--safe-b));
  transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1);max-height:72%;overflow:auto}
.sheet.on{transform:none}
.sheet .tag{display:inline-block;background:#F4EAD7;color:#7A5520;font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px}
.sheet .q{font-size:20px;font-weight:700;line-height:1.45;margin:12px 0 14px}
.ch{display:block;width:100%;text-align:left;min-height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:12px 16px;font-size:17px;font-weight:700;margin-top:8px;color:var(--ink)}
.ch:active{background:#F4EAD7}
.ch.pick{border-color:var(--teal)}
.res{text-align:center}
.res .big{font-size:34px;font-weight:700;margin:6px 0}
.res .prize{font-size:22px;font-weight:700;color:var(--orange)}
.res .code{font-size:34px;letter-spacing:.2em;font-weight:700;background:#F4EAD7;border-radius:14px;padding:12px;margin:12px 0 6px;color:#2A1A04}
.res p{color:var(--muted);margin:6px 0}
.res img{width:120px;height:auto}
.res .btn{margin-top:14px}
.res .btn-ghost{background:#EEE8DC;color:var(--ink)}
.burst{position:absolute;left:50%;top:30%;width:10px;height:10px;pointer-events:none}
.burst i{position:absolute;width:10px;height:14px;border-radius:2px;animation:conf 1.4s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
</style>
</head>
<body>

<!-- 불러오는 중 -->
<section class="scr" id="scBoot"><h1>보물 찾기</h1><p class="lead" id="bootMsg">불러오는 중…</p>
  <button class="btn btn-ghost" id="btnRetry" hidden>다시 시도</button></section>

<!-- 등록 -->
<section class="scr" id="scReg" hidden>
  <h1>보물 찾기</h1>
  <p class="lead">처음이시네요. 닉네임과 휴대폰 번호로 시작해요. 당첨되면 이 정보로 상품을 받아요.</p>
  <div class="card">
    <label for="inNick">닉네임</label><input id="inNick" maxlength="12" autocomplete="nickname">
    <label for="inPhone">휴대폰 번호</label><input id="inPhone" inputmode="numeric" maxlength="13" placeholder="010-0000-0000">
    <div style="margin-top:16px"><button class="btn btn-gold" id="btnReg">시작하기</button></div>
    <p class="err" id="regErr"></p>
  </div>
</section>

<!-- 레이더 -->
<section class="scr" id="scRadar" hidden>
  <h1>보물 찾기</h1>
  <p class="lead">보물이 묻힌 자리에 가까이 가면 「보물 파기」 버튼이 나와요. 보물상자는 <b>오타쿠 퀴즈</b>를 맞혀야 열려요.</p>
  <div class="radar" id="radar"><div class="mid"><div class="dist" id="dist">…</div><div class="unit" id="unit">위치 확인 중</div></div></div>
  <p class="heat-word" id="heat"></p>
  <p class="gpsline" id="gpsline"></p>
  <button class="btn btn-gold digbtn" id="btnDig" hidden>보물 파기!</button>
  <p class="err" id="radarErr"></p>
  <div class="card">
    <div style="font-weight:700">남은 보물 상자</div>
    <div class="poolline" id="poolLine"></div>
    <div style="font-weight:700;margin-top:14px">내가 판 자리</div>
    <div class="dug" id="dugList"></div>
  </div>
</section>

<!-- 파기 무대 -->
<div id="stage" hidden>
  <div class="sky-t" id="stTitle">땅을 파세요!</div>
  <div class="sky-s" id="stSub">화면을 계속 두드리면 삽질해요</div>
  <div class="ground" id="ground">
    <div class="hole" id="hole"></div>
    <img class="chest" id="chest" src="assets/icons/treasure_chest.png" alt="보물상자">
    <svg class="shovel" id="shovel" viewBox="0 0 60 120" aria-hidden="true">
      <rect x="27" y="0" width="6" height="70" rx="3" fill="#9a6a3a"/><rect x="18" y="0" width="24" height="8" rx="4" fill="#6b4626"/>
      <path d="M14 70h32v22c0 14-8 24-16 28-8-4-16-14-16-28z" fill="#c9ced6" stroke="#8b929c" stroke-width="2"/>
    </svg>
  </div>
  <div class="taps" id="taps"><b>탭! 탭! 탭!</b><div class="bar"><i id="tapBar"></i></div></div>
  <div class="sheet" id="sheet"></div>
</div>

<script src="ev-client.js?v=5"></script>
<script>
(function(){
'use strict';
var EID='gwasu', TAPS=8;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function show(id){['scBoot','scReg','scRadar'].forEach(function(s){$(s).hidden=s!==id})}
var SFX={};function sfx(n){try{var a=SFX[n]||(SFX[n]=new Audio('sfx/'+n+'.mp3'));a.currentTime=0;a.play().catch(function(){})}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
var TIER_TXT={TOP:'상위 상품',A:'A상',B:'B상',C:'C상',D:'D상',X:'꽝'};

var data=null, pos=null, near=null, watchId=null;

function load(){
  show('scBoot'); $('bootMsg').textContent='불러오는 중…'; $('btnRetry').hidden=true;
  return EV.call('digSpots',{eventId:EID}).then(function(r){
    data=r;
    if(!r.registered){show('scReg');return}
    show('scRadar'); renderSide(); startGps(); update();
  },function(e){$('bootMsg').textContent=e.message||'불러오지 못했어요.';$('btnRetry').hidden=false});
}
$('btnRetry').onclick=load;

$('inPhone').addEventListener('input',function(e){var v=e.target.value.replace(/\D/g,'').slice(0,11);
  e.target.value=v.length>7?v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7):v.length>3?v.slice(0,3)+'-'+v.slice(3):v});
$('btnReg').onclick=function(){
  var b=this,n=$('inNick').value.trim(),p=$('inPhone').value.replace(/\D/g,'');
  if(!n){$('regErr').textContent='닉네임을 적어 주세요.';return}
  b.disabled=true;$('regErr').textContent='';
  EV.register(n,p).then(function(){b.disabled=false;load()},function(e){b.disabled=false;$('regErr').textContent=e.message||'등록하지 못했어요.'});
};

function renderSide(){
  var p=data.pool, s=p.slots, html='';
  ['TOP','A','B','C','D'].forEach(function(k){ if(s[k]&&s[k].count) html+='<span>'+esc(TIER_TXT[k])+' '+s[k].left+'/'+s[k].count+'</span>'; });
  html+='<span>전체 '+p.left+'/'+p.total+'</span>';
  $('poolLine').innerHTML=html;
  var dug=data.spots.filter(function(x){return x.dug});
  $('dugList').innerHTML=dug.length?dug.map(function(x){var w=x.dug!=='X'&&x.dug!=='wrong';
    return '<span class="'+(w?'w':'')+'">'+esc(x.name||('보물 '+x.id))+' · '+(x.dug==='wrong'?'퀴즈 실패':esc(TIER_TXT[x.dug]||x.dug))+'</span>'}).join(''):'<span>아직 없어요</span>';
}

function distM(a,b){var R=6371000,r=function(x){return x*Math.PI/180},dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);return 2*R*Math.asin(Math.sqrt(h))}

function startGps(){
  if(watchId!=null) return;
  if(!navigator.geolocation){$('radarErr').textContent='이 폰 브라우저는 위치 확인이 안 돼요.';return}
  watchId=navigator.geolocation.watchPosition(function(p){
    pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};$('radarErr').textContent='';update();
  },function(e){$('radarErr').textContent='위치를 못 받았어요. 브라우저 위치 권한을 허용해 주세요. ('+(e.message||e.code)+')'},
  {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}

function update(){
  var left=data.spots.filter(function(x){return !x.dug});
  var R=data.pool.radiusM||5;
  if(!data.spots.length){setRadar('-', '아직 묻힌 보물이 없어요', '', null);$('btnDig').hidden=true;return}
  if(!left.length){setRadar('끝', '모든 자리를 다 팠어요!', '', null);$('btnDig').hidden=true;return}
  if(!pos){setRadar('…','위치 확인 중','',null);return}
  near=null; var best=1e12;
  left.forEach(function(s){var d=distM(pos,s); if(d<best){best=d;near=s}});
  var allow=R+Math.min(pos.acc||0,10), d=Math.round(best);
  var heat, word, color;
  if(best<=allow){word='바로 여기! 땅을 파 보세요';color='#FF8A3D'}
  else if(best<40){word='아주 뜨거워요!';color='#FF8A3D'}
  else if(best<80){word='따뜻해요';color='#F2C14E'}
  else if(best<200){word='미지근해요';color='#E2C489'}
  else {word='차가워요… 다른 쪽으로';color='#7FB3D5'}
  setRadar(d>=1000?(best/1000).toFixed(1):String(d), d>=1000?'km · 가장 가까운 보물':'m · 가장 가까운 보물', word, color);
  $('gpsline').textContent='내 위치 오차 약 ±'+Math.round(pos.acc||0)+'m';
  $('btnDig').hidden=!(best<=allow);
}
function setRadar(n,u,w,c){$('dist').textContent=n;$('unit').textContent=u;$('heat').textContent=w;
  document.documentElement.style.setProperty('--heat',c||'rgba(226,196,137,.5)')}

/* ---------- 파기 ---------- */
var taps=0, digging=false, quiz=null, spot=null;
$('btnDig').onclick=function(){
  if(!near||!pos) return;
  spot=near; taps=0; quiz=null; digging=true;
  $('stage').hidden=false; $('sheet').className='sheet'; $('sheet').innerHTML='';
  $('chest').className='chest'; $('hole').style.setProperty('--hw','40px'); $('tapBar').style.width='0';
  $('taps').hidden=false; $('stTitle').textContent='땅을 파세요!'; $('stSub').textContent='화면을 계속 두드리면 삽질해요';
  /* 파는 동안 서버에서 자리 확인 + 문제 받기 */
  EV.call('digStart',{eventId:EID,spotId:spot.id,lat:pos.lat,lng:pos.lng,acc:pos.acc}).then(function(r){
    if(r.done){quiz={done:r.result}} else quiz=r.quiz;
    if(taps>=TAPS) afterDig();
  },function(e){digging=false;closeStage();$('radarErr').textContent=e.message||'파지 못했어요.';});
};
$('stage').addEventListener('pointerdown',function(e){
  if(!digging||taps>=TAPS) return;
  taps++; sfx('pop'); buzz(30);
  var sh=$('shovel'); sh.classList.add('hit'); setTimeout(function(){sh.classList.remove('hit')},120);
  $('hole').style.setProperty('--hw',(40+taps*22)+'px');
  $('tapBar').style.width=(taps/TAPS*100)+'%';
  dirt();
  if(taps>=TAPS){$('taps').hidden=true;$('stSub').textContent='뭔가 걸렸어요…';if(quiz) afterDig();}
});
function dirt(){
  var g=$('ground'), r=g.getBoundingClientRect();
  for(var i=0;i<9;i++){
    var d=document.createElement('i'); d.className='dirt';
    var x=r.width/2, y=r.height*.22;
    d.style.left=x+'px'; d.style.top=y+'px'; g.appendChild(d);
    var dx=(Math.random()-.5)*260, dy=-60-Math.random()*140;
    d.animate([{transform:'translate(0,0)'},{transform:'translate('+dx*.6+'px,'+dy+'px)',offset:.45},{transform:'translate('+dx+'px,'+(dy+220)+'px)',opacity:0}],{duration:700+Math.random()*300,easing:'ease-out'}).onfinish=(function(n){return function(){n.remove()}})(d);
  }
}
function afterDig(){
  digging=false;
  var c=$('chest'); c.classList.add('up'); sfx('boom'); buzz([40,60,40]);
  $('stTitle').textContent='보물상자 발견!';
  if(quiz.done){ setTimeout(function(){showResult(quiz.done)},900); return; }
  $('stSub').textContent='자물쇠를 열려면 오타쿠 퀴즈를 맞혀야 해요';
  setTimeout(function(){c.classList.add('shake');showQuiz()},900);
}
function showQuiz(){
  var s=$('sheet');
  s.innerHTML='<span class="tag">오타쿠 퀴즈 · 틀리면 꽝!</span><div class="q">'+esc(quiz.q)+'</div>'+
    quiz.choices.map(function(c,i){return '<button class="ch" data-i="'+i+'">'+(i+1)+'. '+esc(c)+'</button>'}).join('')+'<p class="err" id="qErr"></p>';
  s.className='sheet on';
  s.querySelectorAll('.ch').forEach(function(b){b.onclick=function(){answer(+b.dataset.i,b)}});
}
var answering=false;
function answer(i,b){
  if(answering) return; answering=true; b.classList.add('pick');
  EV.call('digAnswer',{eventId:EID,spotId:spot.id,choice:i}).then(function(r){answering=false;showResult(r.result)},
    function(e){answering=false;b.classList.remove('pick');$('qErr').textContent=e.message||'다시 눌러 주세요.'});
}
function showResult(r){
  var c=$('chest'); c.classList.remove('shake');
  var s=$('sheet'), html;
  var win=r.tier&&r.tier!=='X';
  if(win){
    sfx('fanfare'); buzz([80,60,80,60,200]); burst();
    $('stTitle').textContent='정답입니다! 보물 당첨!'; $('stSub').textContent='';
    html='<div class="res"><img src="assets/icons/golden_tangerine.png" alt=""><div class="big">'+esc(TIER_TXT[r.tier])+'</div><div class="prize">'+esc(r.prize)+'</div>'+
      '<div class="code">'+esc(r.pickupCode||'')+'</div><p>이 화면을 스태프에게 보여주고 상품을 받아 주세요.</p>'+(r.given?'<p><b>이미 받은 상품이에요.</b></p>':'');
  } else if(!r.correct){
    $('stTitle').textContent='자물쇠가 안 열려요…'; $('stSub').textContent='';
    html='<div class="res"><img src="assets/characters/disappointed.png" alt="" style="width:110px"><div class="big">꽝</div><p>퀴즈를 틀려서 상자가 잠겨 버렸어요.</p>'+(r.answer?'<p>정답은 <b>'+esc(r.answer)+'</b></p>':'')+'<p>다른 보물 자리를 찾아보세요!</p>';
  } else {
    $('stTitle').textContent='정답입니다!'; $('stSub').textContent='';
    html='<div class="res"><img src="assets/characters/surprised.png" alt="" style="width:110px"><div class="big">정답입니다!</div><p style="font-size:19px;color:var(--ink)"><b>하지만 보물은 꽝입니다.</b></p><p>다른 보물 자리에서 다시 도전해 보세요!</p>';
  }
  html+='<button class="btn btn-gold" id="btnBack">다른 보물 찾으러 가기</button></div>';
  s.innerHTML=html; s.className='sheet on';
  $('btnBack').onclick=function(){closeStage();load()};
}
function burst(){
  var b=document.createElement('div'); b.className='burst';
  var cols=['#F2D59B','#E8742A','#FFF','#7FD1B9','#FF6B6B'];
  for(var i=0;i<40;i++){var p=document.createElement('i');var a=Math.random()*Math.PI*2,d=120+Math.random()*180;
    p.style.background=cols[i%cols.length];p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');p.style.setProperty('--r',(Math.random()*720)+'deg');b.appendChild(p)}
  $('stage').appendChild(b); setTimeout(function(){b.remove()},1600);
}
function closeStage(){$('stage').hidden=true;$('sheet').className='sheet'}

load();
})();
</script>
</body>
</html>
