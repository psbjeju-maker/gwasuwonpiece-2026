<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0F1120">
<title>포토카드 공방 — 할로윈 과수원피스</title>
<link rel="stylesheet" href="app.css?v=1">
<style>
html,body{background:var(--color-bg,#0F1120)}
#app{padding-top:8px}
.screen{padding-bottom:calc(var(--space-8) + 90px)}
#btnClose{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:50;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--color-border-strong);background:rgba(15,17,32,.85);color:var(--color-text);font-weight:700;font-size:14px}
#stkWrap{position:relative;width:min(86vw,360px);margin:var(--space-4) auto 0}
#stkWrap .slot{position:relative;overflow:hidden}
.stkBox{position:absolute;display:none;border:2px solid #fff;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none;z-index:20}
.stkBox.on{display:block}
.stkBox .hd{position:absolute;width:20px;height:20px;background:#fff;border:3px solid #7B4DFF;border-radius:50%;pointer-events:auto;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.stkBox .hd::after,.stkBox .rot::after,.stkBox .xdel::after{content:'';position:absolute;inset:-12px}
.stkBox .tl{left:-12px;top:-12px}.stkBox .tr{right:-12px;top:-12px}.stkBox .bl{left:-12px;bottom:-12px}.stkBox .br{right:-12px;bottom:-12px}
.stkBox .rotStem{position:absolute;left:50%;top:-24px;width:2px;height:24px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.stkBox .rot{position:absolute;left:50%;top:-52px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#7B4DFF;color:#fff;font-style:normal;font-weight:900;font-size:18px;line-height:30px;text-align:center;pointer-events:auto;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.stkBox .xdel{position:absolute;left:50%;bottom:-48px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#E5484D;color:#fff;font-weight:900;font-size:15px;line-height:30px;text-align:center;pointer-events:auto;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.45)}
#stkWrap .slots{margin-top:0}
#stkWrap .slot{max-width:none}
.slot{aspect-ratio:750/705 !important}
#stkLayer{position:absolute;inset:0;overflow:hidden;border-radius:12px;pointer-events:none}
.stkItem{position:absolute;aspect-ratio:1;object-fit:contain;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.stkItem.sel{outline:2px dashed rgba(255,255,255,.9);outline-offset:-2px;border-radius:10px}
.stkBar{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;margin-top:6px;-webkit-overflow-scrolling:touch}
.stkThumb{flex:0 0 auto;width:68px;text-align:center;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;padding:6px 4px 4px;font-size:11px;font-weight:700}
.stkThumb img{display:block;width:52px;height:52px;object-fit:contain;margin:0 auto 2px}
.stkTools{display:none;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.stkTools.on{display:flex}
.stkTools button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font-weight:700;font-size:14px}
.stkTools .del{color:#ff8a8a}
.stkHint{text-align:center;font-size:13px;color:var(--color-text-secondary);margin-top:6px}
#doneBar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(15,17,32,.96) 35%);transform:translateY(120%);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
#doneBar.on{transform:none}
/* 새 디자인(할로윈 스페셜·레전드) — 완성 카드 위에서 계속 흐르는 광택(저장 PNG에는 안 들어감) */
.cardFx--holo{display:none;z-index:5;pointer-events:none;border-radius:var(--radius-lg);mix-blend-mode:screen;opacity:0;background-size:320% 100%}
.flipCard.rarity-halloween .cardFx--holo{display:block;background-image:linear-gradient(115deg,transparent 34%,rgba(255,170,60,.34) 44%,rgba(190,110,255,.30) 52%,rgba(255,226,140,.34) 60%,transparent 70%)}
.flipCard.rarity-legend .cardFx--holo{display:block;background-image:linear-gradient(115deg,transparent 26%,rgba(255,80,160,.30) 36%,rgba(255,230,80,.30) 44%,rgba(80,255,200,.30) 52%,rgba(90,150,255,.30) 60%,rgba(200,100,255,.28) 68%,transparent 76%)}
.cardWrap.settle .cardFx--holo{opacity:1;animation:holoSweep 3.4s linear infinite}
@keyframes holoSweep{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion: reduce){.cardWrap.settle .cardFx--holo{animation:none;opacity:.5}}
</style>
</head>
<body>
<div id="app">
  <button type="button" id="btnClose">닫기 ✕</button>
  <section class="screen on" id="s-photo">
    <div class="hero">
      <h1 class="hero__title">오늘의 나를 카드로!</h1>
      <p class="hero__sub">사진을 넣고 스티커로 꾸미면 나만의 랜덤 포토카드가 탄생해요. 카드가 완성되면 몬스터를 쓰러뜨릴 수 있어요!</p>
    </div>
    <div id="stkWrap"><div class="slots slots--one" id="slots"></div><div id="stkLayer"></div></div>
    <div class="stkBar" id="stkBar"></div>
    <div class="stkTools" id="stkTools"><button type="button" data-k="small">작게</button><button type="button" data-k="big">크게</button><button type="button" data-k="left">↺ 왼쪽</button><button type="button" data-k="right">↻ 오른쪽</button><button type="button" data-k="del" class="del">지우기</button></div>
    <div class="slotAdj" id="slotAdj"><button type="button" data-dz="0.85">－ 사진 축소</button><button type="button" data-dz="1.18">＋ 사진 확대</button><button type="button" data-dy="-0.15">▲ 사진 위로</button><button type="button" data-dy="0.15">▼ 사진 아래로</button></div>

      <label for="inCardNick">닉네임 (선택, 최대 8자)</label>
      <input id="inCardNick" placeholder="예) 감귤" maxlength="8">

        <img class="revealStage__layer revealStage__layer--impact" src="assets/photo-card/birth-fx/stage_04_impact_ring.png" alt="">
        <div class="flipCard" id="flipCard">

            <div class="flipCard__face flipCard__face--back">
              <img class="flipCard__sealed" src="assets/photo-card/birth-fx/card_00_sealed_back.png" alt="">
              <div class="flipCard__candidate" id="flipCandidate"></div>
              <div class="flipCard__label" id="flipLabel">당신의 카드가 만들어지고 있어요</div>
            </div>
            <div class="flipCard__face flipCard__face--front">
              <div class="cardWrap" id="cardWrap">
                <canvas id="cardCanvas" width="1500" height="2040"></canvas>
                <img class="cardFx cardFx--rarity" id="fxRarity" src="" alt="">
                <img class="cardFx cardFx--flare" src="assets/photo-card/birth-fx/card_04_corner_flare.png" alt="">
                <img class="cardFx cardFx--sweep" src="assets/photo-card/birth-fx/card_01_light_sweep.png" alt="">
                <img class="cardFx cardFx--prism" src="assets/photo-card/birth-fx/card_02_prism_edge.png" alt="">
                <img class="cardFx cardFx--flecks" src="assets/photo-card/birth-fx/card_03_crystal_flecks.png" alt="">
                <div class="cardFx cardFx--holo"></div>
                <img class="cardFx cardFx--diasheen" src="assets/photo-card/rarity-fx/diamond/diamond_07_sheen_sweep.png" alt="">
              </div>
            </div>
          </div>
        </div>
      </div>
      <button class="btn btn--tertiary revealStage__skip" id="btnRevealSkip" hidden>건너뛰기</button>
      <div class="cardRevealTag" id="cardRevealTag"></div>
      <div class="btnrow cardActions" id="cardActions1" style="margin-top:14px">
        <button class="btn btn--secondary" id="btnSave">이미지 저장</button>
        <button class="btn btn--secondary" id="btnShare">공유</button>
      </div>
      <div class="btnrow cardActions" id="cardActions2" style="margin-top:8px">
        <button class="btn btn--secondary" id="btnReplay">탄생 연출 다시 보기</button>
        <button class="btn btn--secondary" id="btnNewCard">새 카드 만들기</button>
      </div>
    </div>

    
  </section>
</div>
<div id="doneBar"><button class="btn btn--primary btn--block" id="btnDone">카드 완성! 몬스터에게 보여주기</button></div>
<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var S=(function(){try{var v=JSON.parse(localStorage.getItem('gw.photocard'));if(v)return v}catch(e){}return {cardCount:0}})();
function save(){try{localStorage.setItem('gw.photocard',JSON.stringify(S))}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2400)}
function sheet(h){$('#sheet').innerHTML=h;$('#modal').classList.add('on')}
var sfxPool={}, ambientEl=null, _actx=null;
function sfx(name,vol){
  try{
    var a=new Audio('sfx/'+name+'.mp3');
    a.volume=vol==null?0.75:vol;
    a.play()['catch'](function(){});
  }catch(e){}
}
function sfxAmbient(name,vol){
  try{
    sfxStopAmbient();
    ambientEl=new Audio('sfx/'+name+'.mp3');
    ambientEl.loop=true;ambientEl.volume=vol==null?0.35:vol;
    ambientEl.play()['catch'](function(){});
  }catch(e){}
}
function sfxStopAmbient(){ if(ambientEl){try{ambientEl.pause()}catch(e){} ambientEl=null} }
function beep(freq,dur,type,vol){
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    var t0=_actx.currentTime, osc=_actx.createOscillator(), g=_actx.createGain();
    osc.type=type||'square';
    osc.frequency.setValueAtTime(freq,t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(60,freq*0.35),t0+dur);
    g.gain.setValueAtTime(vol==null?0.16:vol,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    osc.connect(g);g.connect(_actx.destination);
    osc.start(t0);osc.stop(t0+dur);
  }catch(e){}
}


var slots=[null], slotPos=[{x:0.5,y:0.18}], currentCard=null;
function roundRectPath(ctx2,px,py,pw,ph,r){
  ctx2.beginPath();ctx2.moveTo(px+r,py);ctx2.arcTo(px+pw,py,px+pw,py+ph,r);
  ctx2.arcTo(px+pw,py+ph,px,py+ph,r);ctx2.arcTo(px,py+ph,px,py,r);ctx2.arcTo(px,py,px+pw,py,r);ctx2.closePath();
}
/* 사진을 넣은 뒤 칸 안에서 원하는 방향으로 드래그하면 크롭 위치(slotPos[0]={x,y}, 각 0=왼쪽/맨위 1=오른쪽/맨아래)가
   바뀐다. 미리보기 칸이 실제 카드 비율(750:1020)이라 여기서 맞춘 위치가 완성 카드에도 그대로 보인다. */
(function buildSlot(){
  var i=0, w=$('#slots');w.innerHTML='';
  var el=document.createElement('label');el.className='slot';
  el.innerHTML='<span>사진 선택<br>탭해서 선택</span>'+
    '<input type="file" accept="image/*" style="display:none">';
  var inp=el.querySelector('input');
  var view=null, drag=null, moved=false;
  function applyPos(){ if(!view||!slots[i])return; var r=el.getBoundingClientRect(),img=slots[i],z=slotPos[i].z||1,sc=Math.max(r.width/img.width,r.height/img.height)*z,dw=img.width*sc,dh=img.height*sc; view.style.cssText='position:absolute;max-width:none;object-fit:fill;width:'+dw+'px;height:'+dh+'px;left:'+(-(dw-r.width)*slotPos[i].x)+'px;top:'+(-(dh-r.height)*slotPos[i].y)+'px'; }
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){var img=new Image();img.onload=function(){slots[i]=img;slotPos[i]={x:0.5,y:0.18};
      el.innerHTML='';view=document.createElement('img');view.src=img.src;view.draggable=false;
      el.appendChild(view);el.appendChild(inp);applyPos();el.classList.add('slot--filled');$('#slotAdj').classList.add('on');};
      img.src=r.result;};
    r.readAsDataURL(f);
  };
  el.addEventListener('pointerdown',function(e){
    if(!slots[i])return;
    drag={x:e.clientX,y:e.clientY,pos:{x:slotPos[i].x,y:slotPos[i].y}};moved=false;el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',function(e){
    if(!drag||window._pinch)return;
    var img=slots[i], rect=el.getBoundingClientRect();
    var sc=Math.max(rect.width/img.width,rect.height/img.height)*(slotPos[i].z||1);
    var overflowX=img.width*sc-rect.width, overflowY=img.height*sc-rect.height;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    if(overflowX>0)slotPos[i].x=Math.max(0,Math.min(1,drag.pos.x-dx/overflowX));
    if(overflowY>0)slotPos[i].y=Math.max(0,Math.min(1,drag.pos.y-dy/overflowY));
    applyPos();
  });
  function endDrag(){drag=null}
  el.addEventListener('pointerup',endDrag);el.addEventListener('pointercancel',endDrag);
  el.addEventListener('click',function(e){ if(moved){e.preventDefault();moved=false} });
  /* 두 손가락으로 사진 확대·축소 / 마우스 휠 */
  var pp={}, pz=null;
  el.addEventListener('pointerdown',function(e){pp[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(pp);if(ids.length===2&&slots[i]){var a=pp[ids[0]],b=pp[ids[1]];pz={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:slotPos[i].z||1};window._pinch=true}});
  el.addEventListener('pointermove',function(e){
    if(!pp[e.pointerId])return;pp[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(pp);
    if(ids.length>=2&&pz&&slots[i]){var a=pp[ids[0]],b=pp[ids[1]];slotPos[i].z=Math.max(1,Math.min(4,pz.z*Math.hypot(a.x-b.x,a.y-b.y)/pz.d));applyPos()}
  });
  function pend(e){delete pp[e.pointerId];if(Object.keys(pp).length<2){pz=null;setTimeout(function(){window._pinch=false},80)}}
  el.addEventListener('pointerup',pend);el.addEventListener('pointercancel',pend);
  el.addEventListener('wheel',function(e){if(!slots[i])return;e.preventDefault();slotPos[i].z=Math.max(1,Math.min(4,(slotPos[i].z||1)*(e.deltaY<0?1.1:0.9)));applyPos()},{passive:false});
  window.addEventListener('resize',function(){applyPos()});
  w.appendChild(el);
  $('#slotAdj').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||!slots[i])return;
    if(b.dataset.dz){slotPos[i].z=Math.max(1,Math.min(4,(slotPos[i].z||1)*parseFloat(b.dataset.dz)))}else{slotPos[i].y=Math.max(0,Math.min(1,slotPos[i].y+parseFloat(b.dataset.dy)))}applyPos();
  });
})();

/* 레어도 · 속성 · 이름 · 효과 랜덤 테이블 (기획 문서 기준, 속성당 최소 2종으로 시작 —
   추후 항목을 더 추가하면 반복 없이 자동으로 더 다양해진다) */
var CARD_RARITY=[
  {id:'bronze',label:'브론즈',en:'BRONZE',weight:45,lv:[1,30],val:[5,15]},
  {id:'silver',label:'실버',en:'SILVER',weight:30,lv:[20,50],val:[10,25]},
  {id:'gold',label:'골드',en:'GOLD',weight:17,lv:[40,75],val:[20,40]},
  {id:'platinum',label:'플래티넘',en:'PLATINUM',weight:6,lv:[65,95],val:[35,60]},
  {id:'diamond',label:'다이아',en:'DIAMOND',weight:2,lv:[85,100],val:[50,99]}
];
var CARD_ATTR=[ /* 속성은 아이콘·라벨만 쓴다(이름·능력 문구는 아래 풀에서 따로 뽑음) */
  {id:'fire',label:'불'},{id:'water',label:'물'},{id:'wind',label:'바람'},
  {id:'earth',label:'땅'},{id:'light',label:'빛'},{id:'shadow',label:'어둠'}
];
/* 이름·기술·설명·대사 풀 — 사장님 기획(인기 애니 키워드 + 다른 캐릭터명 크로스오버).
   원작 고증보다 "웃긴 섞임"이 목표라 일부러 어긋난 조합도 그대로 둔다. 항목은 추가만 하면 된다. */
var CARD_ROLES=['여행자','수호자','모험가','탐험가','기록자','방랑자','길잡이','이야기꾼','술사','검사','해적','닌자','마법사',
  '초능력자','헌터','스트라이커','스파이커','영웅','병사','주인공','라이벌','천재','최애 수집가','포토존 사냥꾼','축제의 주인공',
  '귤빛 여행자','탐라의 모험가'];
var CARD_CHARS=['탄지로','네즈코','젠이츠','이노스케','렌고쿠','기유','고죠','유지','메구미','노바라','유타','스쿠나','루피','조로',
  '상디','나미','우솝','쵸파','나루토','사스케','사쿠라','카카시','가아라','히나타','프리렌','페른','슈타르크','아우라','아냐',
  '로이드','요르','덴지','파워','마키마','이사기','바치라','나기','린','히나타 쇼요','카게야마','켄마','보쿠토','미도리야',

  var ML=L.meta, aMeta=A(636,153);

    var msize=fitFont(ctx2,meta,ML.weight,FB,ML.size*k,ML.size*k*0.8,ML.maxW*k);
    ctx2.save();ctx2.globalAlpha=aMeta;ctx2.font=ML.weight+' '+Math.round(msize)+'px '+FB;ctx2.textBaseline='alphabetic';

  ctx2.font=DE.weight+' '+Math.round(DE.size*k)+'px '+FB;

    if(aQuote>0){
      ctx2.save();ctx2.globalAlpha=aQuote*0.88;ctx2.font=QT.weight+' '+Math.round(qsize)+'px '+FB;

  /* 등급 · 행사명 — 기본은 962 고정, 위 내용이 길어져 침범할 때만 그만큼 밀리되 카드 바닥 밖으로는 안 나간다 */

  clearTextShadow(ctx2);
  /* 8) 등급별 "완성 카드 상시 이펙트"(통합디자인팩) — 텍스트 위 최상단, 저장 PNG에도 그대로 굽는다.
     탄생 연출용 rarity_*_reveal/card_02·03(카드 앞 FX)과 달리 사라지지 않는다 */
  drawRarityFX(ctx2,W,H,data);
}
/* 다이아 shards·플래티넘 particles는 "측면과 하단에 고정"이라 설명 문구가 길면 끝 글자와 겹친다(실측 확인됨) —
   지시서대로 폰트는 그대로 두고 이 두 레이어만 투명도를 살짝 낮춰 글자를 가리지 않게 한다 */
var RARITY_FX_ALPHA={diamond_shards:0.72,platinum_particles:0.72};
function drawRarityFX(ctx2,W,H,data){
  var order=RARITY_FX_ORDER[data.rarity];if(!order)return;
  order.forEach(function(part){
    var img=cardAssets&&cardAssets['rfx_'+data.rarity+'_'+part];
    if(!img)return;
    var a=RARITY_FX_ALPHA[data.rarity+'_'+part];
    if(a!=null){ctx2.save();ctx2.globalAlpha=a;ctx2.drawImage(img,0,0,W,H);ctx2.restore();return}
    ctx2.drawImage(img,0,0,W,H);

/* 등장 연출: 사진/텍스트 순서로 그리는 drawCard(t) 자체는 "④ 카드 완성" 구간(약 1.4초) 안에서만 돈다.
   rAF가 멈추는 환경(백그라운드 탭 등)에서도 마지막엔 반드시 완성본을 그린다. */
var cardAnimToken=0, currentCardImgs=null;
function animateCard(canvas,data,imgs,pos){
  var token=++cardAnimToken, ctx2=canvas.getContext('2d'), t0=performance.now(), END=1400;
  function step(now){
    if(token!==cardAnimToken)return;
    var t=now-t0;
    if(t>=END){drawCard(ctx2,canvas.width,canvas.height,data,imgs,pos);return}
    drawCard(ctx2,canvas.width,canvas.height,data,imgs,pos,t);requestAnimationFrame(step);
  }
  drawCard(ctx2,canvas.width,canvas.height,data,imgs,pos,0);requestAnimationFrame(step);
  setTimeout(function(){if(token===cardAnimToken){cardAnimToken++;drawCard(ctx2,canvas.width,canvas.height,data,imgs,pos)}},END+300);

/* 배경음을 뚝 끊지 않고 짧게 페이드아웃 */
function fadeStopAmbient(ms){
  if(!ambientEl){return}
  var el=ambientEl, startVol=el.volume||0.35, steps=6, stepMs=Math.max(30,ms/steps), i=0;
  var iv=setInterval(function(){
    i++;
    if(!el){clearInterval(iv);return}
    el.volume=Math.max(0,startVol*(1-i/steps));
    if(i>=steps){clearInterval(iv);sfxStopAmbient()}
  },stepMs);
}
/* 볼륨을 순간적으로 뚝 바꾸지 않고 목표값까지 부드럽게 램프 — "정적" 구간에서 음악이 갑자기
   끊기는 느낌(특히 다이아 배경음처럼 곡 느낌이 강한 트랙)을 없애기 위해 사용 */
function fadeAmbientTo(targetVol,ms){
  if(!ambientEl){return}
  var el=ambientEl, startVol=el.volume, steps=6, stepMs=Math.max(20,ms/steps), i=0;
  var iv=setInterval(function(){
    i++;
    if(!el){clearInterval(iv);return}
    el.volume=Math.max(0,startVol+(targetVol-startVol)*(i/steps));
    if(i>=steps)clearInterval(iv);
  },stepMs);

/* 카드 탄생 연출 — idle→gathering→combining→suspense→reveal→settle→result 상태로 진행.

   audio.onended/animationend/setTimeout(음악 길이) 무엇도 결과를 닫거나 카드 DOM을 지우지 않는다 —
   여기서 만드는 타이머들은 오직 "다음 단계로 넘어가기"만 하고, 마지막 단계(result) 이후로는 아무 것도 스스로 실행되지 않는다.
   무대(stage_01~04)·카드 뒷면(card_00_sealed_back)·카드 앞면 FX(card_01~04, rarity_*_reveal)는
   탐라문화제_포토카드_탄생이펙트팩의 클로드_구현지시.md 시간표(0~4.35초 조합, 4.35초 공개, ~6.8초 정착)를 따른다. */
var revealToken=0, currentReveal=null;

function playCardReveal(data,photos,pos){

  var flip=$('#flipCard'), cand=$('#flipCandidate'), label=$('#flipLabel');
  var canvas=$('#cardCanvas'), ctx2=canvas.getContext('2d');
  var wrap=$('#cardWrap'), stage=$('#revealStage'), fxRarity=$('#fxRarity');
  var result=$('#result'), skipBtn=$('#btnRevealSkip'), tag=$('#cardRevealTag');
  var timers=[], settled=false;
  function live(){return token===revealToken}
  function at(ms,fn){timers.push(setTimeout(function(){if(live())fn()},reduced?Math.round(ms*0.45):ms))}
  function clearAll(){timers.forEach(clearTimeout);timers=[]}

  /* 초기화 — 무대·카드 FX 클래스를 전부 걷어내고 봉인된 뒷면부터 다시 시작 */
  flip.className='flipCard rarity-'+data.rarity;
  wrap.className='cardWrap';
  stage.className='revealStage';
  fxRarity.src='assets/photo-card/birth-fx/rarity_'+data.rarity+'_reveal.png';
  result.classList.remove('settled');
  tag.textContent='';
  cand.textContent='';label.textContent='';
  skipBtn.hidden=true;

     노래 4곡을 매번 겹쳐 틀면 시끄럽다는 피드백 반영 — 등급 하나당 곡 하나만 재생(레이어링 X):
     브론즈·실버=wind-whoosh(절제된 바람), 골드=magic-spell(기운이 모이는 신비감),
     플래티넘=dark-hit-logo(묵직한 드라마), 다이아=epic-cinematic-logo-reveal(가장 화려함,

  at(2400,function(){

  at(3180,function(){cand.textContent=data.displayName});
  at(3180,function(){beep(880,0.08,'sine',0.18)});
  at(3400,function(){label.textContent='Lv.'+data.level});
  at(3400,function(){beep(1046,0.09,'sine',0.2)});
  at(3600,function(){label.textContent=data.attributeLabel+' 속성'});

  /* 3.8~4.35초 — 정적. 화면을 살짝 눌러주고, 소리도 뚝 끊기지 않게 부드럽게 절반으로 낮춘다(레어도는 아직 숨김) */

     배경음은 이미 등급별로 다르게 깔려 있으니 여기선 등급별 짧은 클라이맥스 효과음 하나만 겹친다(믹싱 정리) */

    flip.classList.add('flipCard--flipped','flipCard--reveal');
    wrap.className='cardWrap reveal reveal--'+data.rarity+' fx-reveal';
    stage.classList.remove('stage--ambient','stage--orbit');
    stage.classList.add('stage--rays','stage--impact');
    sfx(data.rarity==='platinum'||data.rarity==='diamond'||data.rarity==='halloween'||data.rarity==='legend'?'fanfare':data.rarity==='gold'?'bonus':'pop',0.65);
  });

  /* 5.25~6.8초 — light_sweep 지나간 뒤 prism_edge·crystal_flecks만 은은히 남기고,
     제목→아이콘→기술명→설명·대사가 drawCard(t)의 자체 타임라인(약 1.4초)으로 등장 */

  /* 6.8초 이후 — 카드 고정, 음악 자연스럽게 잦아들고, 저장/다시뽑기 버튼 등장.
     페이드를 900ms→1800ms로 늘림 — 다이아 배경음(epic-cinematic-logo-reveal, 7.8초)이 900ms짜리
     빠른 페이드에 여운(꼬리음)까지 잘려서 "노래가 갑자기 끝나는 느낌"이 난다는 피드백 반영.

$('#btnRevealSkip').onclick=function(){if(currentReveal)currentReveal.finishNow()};
/* 카드가 쓰는 실제 웨이트만 미리 로드 — JejuGothic 400, SCDream 400/600/800.
   document.fonts.check()로 실제 로딩 여부까지 확인해서, 로딩 전에 캔버스를 그려 기본 폰트로
   저장되는 사고(미리보기와 저장 PNG의 폰트가 달라지는 문제)를 막는다. */
function ensureCardFonts(){
  var specs=['400 100px JejuGothic','400 100px SCDream','600 100px SCDream','800 100px SCDream'];
  if(!(document.fonts&&document.fonts.load))return Promise.resolve();
  return Promise.all(specs.map(function(s){return document.fonts.load(s).catch(function(){})}))
    .then(function(){return document.fonts.ready.catch(function(){})})
    .then(function(){
      var missing=specs.filter(function(s){try{return !document.fonts.check(s)}catch(e){return false}});
      if(missing.length)console.warn('[card] 폰트 로딩 확인 실패(기본 폰트로 대체될 수 있음):',missing);
    });
}
$('#btnMake').onclick=function(){
  var have=slots.filter(Boolean).length;
  if(have<1){toast('사진을 넣어 주세요');return}
  var btn=$('#btnMake');if(btn.disabled)return;
  btn.disabled=true;$('#result').classList.remove('on');
  S.cardCount=(S.cardCount||0)+1;save();
  var data=rollCard($('#inCardNick').value, S.cardCount%CARD_PITY===0?['diamond','halloween','legend'][Math.floor(Math.random()*3)]:null);
  data.stickers=getStickers();
  updateCardPity();
  loadCardAssets(function(assets){
    var need2=['frame_'+data.rarity,'foil_'+data.rarity,'attr_'+data.attribute,'title_scrim','meta_strip','caption_fade']
      .concat((RARITY_FX_ORDER[data.rarity]||[]).map(function(p){return 'rfx_'+data.rarity+'_'+p}));
    if(need2.some(function(k){return !assets[k]})){
      btn.disabled=false;toast('카드 에셋을 불러오지 못했어요. 다시 시도해 주세요.');return;
    }
    var photosSnapshot=slots.slice(), posSnapshot=slotPos.map(function(p){return p&&{x:p.x,y:p.y,z:p.z||1}});
    ensureCardFonts().then(function(){
      currentCard=data;
      $('#result').classList.add('on');
      $('#result').scrollIntoView({behavior:'smooth',block:'start'});
      onCardSettled=function(){showDone()};
      playCardReveal(data,photosSnapshot,posSnapshot);
    });
  });
};
updateCardPity();

$('#btnNewCard').onclick=function(){

function cardFileName(){
  var d8=new Date(), ymd=d8.getFullYear()+String(d8.getMonth()+1).padStart(2,'0')+String(d8.getDate()).padStart(2,'0');
  return '과수원피스_포토카드_'+currentCard.rarityLabel+'_'+ymd+'.png';
}
function cardBlob(cb){
  var canvas=$('#cardCanvas');
  try{
    canvas.toBlob(function(blob){
      if(blob)return cb(blob);
      try{var u=canvas.toDataURL('image/png'),p=u.split(','),bin=atob(p[1]),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);cb(new Blob([arr],{type:'image/png'}))}catch(e){cb(null)}
    },'image/png');
  }catch(e){cb(null)}
}
/* 길게 눌러 저장하는 이미지 화면: 인앱브라우저(카톡·인스타 등)·iOS처럼 다운로드/공유가 막힌 곳의 확실한 폴백 */
function showCardImage(blob){
  var url=$('#cardCanvas').toDataURL('image/png');
  sheet('<h3>사진을 길게 눌러 저장하세요</h3><p>아래 사진을 손가락으로 꾹 누르면 "이미지 저장" 메뉴가 나와요.</p>'+
    '<img src="'+url+'" alt="포토카드" style="width:100%;border-radius:12px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto">'+
    '<button class="btn btn--tertiary btn--block" onclick="document.getElementById(\'modal\').classList.remove(\'on\')">닫기</button>');
}
$('#btnSave').onclick=function(){
  if(!currentCard)return;
  var ua=navigator.userAgent||'', inApp=/KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER|DaumApps|; wv\)|Whale.*Mobile/i.test(ua);
  var ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  cardBlob(function(blob){
    if(!blob){toast('저장 이미지를 만들지 못했어요. 다시 시도해 주세요');return}
    if(inApp){showCardImage(blob);return}
    if(ios){
      var file=new File([blob],cardFileName(),{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).catch(function(e){if(e&&e.name!=='AbortError')showCardImage(blob)});
        return;
      }
      showCardImage(blob);return;
    }
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url;a.download=cardFileName();a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},3000);
  });
};
$('#btnShare').onclick=function(){
  if(!currentCard)return;
  cardBlob(function(blob){
    if(!blob)return;
    var file=new File([blob],'과수원피스_포토카드.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'할로윈 과수원피스 포토카드'}).catch(function(e){if(e&&e.name!=='AbortError')showCardImage(blob)});
    } else showCardImage(blob);
  });
};



/* ====== 과수원피스 추가분 ====== */
/* 새 디자인 2종(할로윈 스페셜·레전드) — 기존 5등급 확률은 줄지 않게 나머지에서 조금씩 덜어 왔다 */
CARD_RARITY.forEach(function(r){ if(r.id==='bronze')r.weight=40; if(r.id==='silver')r.weight=27; if(r.id==='gold')r.weight=15; if(r.id==='platinum')r.weight=7; if(r.id==='diamond')r.weight=4; });
CARD_RARITY.push({id:'halloween',label:'할로윈 스페셜',en:'HALLOWEEN',weight:5,lv:[88,100],val:[60,99]});
CARD_RARITY.push({id:'legend',label:'레전드',en:'LEGEND',weight:2,lv:[95,100],val:[80,99]});
CARD_ROLES.push('귤선장의 선원','한밤의 모험가','호박등 수호자','할로윈의 주인공');
CARD_KEYWORDS.push('할로윈','호박등','귤빛 해적','해적왕의','한밤의','도채비의','유령같은','마녀의','박쥐날개','사탕폭탄','으스스','달콤한','과수원의','귤선장의','트릭오어트릿');
CARD_SKILLS.push('트릭 오어 트릿','호박등 점등','사탕 폭격','유령 통과','박쥐 소환','마녀의 빗자루','귤 대포','해적왕의 포효','한밤의 귤 수확','도깨비 방망이');
CARD_CHARS.push('귤선장','도채비','리타');
CARD_LINES.push('트릭 오어 트릿!','사탕 안 주면 장난칠 거야!','오늘 밤은 내가 주인공!','귤 해적단 출항!','호박등이 길을 밝혀 줘.');
CARD_DESCS.push('사탕이 눈앞에 나타날 확률이 {v}% 오른다.','할로윈 텐션이 {v} 상승한다.','한밤의 으스스한 분위기에서 존재감이 {v} 오른다.');

/* ---- 스티커(우리 일러스트) — 사진 위에 올리고 한 손가락 이동 · 두 손가락 크기/회전 ---- */
var STK=[{"f": "o_rita_full.webp", "n": "리타 해적"}, {"f": "o_rita_pirate.webp", "n": "리타 활짝"}, {"f": "o_rita_hi.webp", "n": "리타 인사"}, {"f": "o_rita_basic.webp", "n": "리타 기본"}, {"f": "o_logo_char.webp", "n": "메이커앤하비"}, {"f": "o_logo_text.webp", "n": "로고 글자"}, {"f": "s_pumpkin.webp", "n": "잭오랜턴"}, {"f": "s_bat.webp", "n": "박쥐"}, {"f": "s_ghost.webp", "n": "유령"}, {"f": "s_candy.webp", "n": "사탕"}, {"f": "s_moon.webp", "n": "달"}, {"f": "s_sparkle.webp", "n": "별빛"}, {"f": "s_witchhat.webp", "n": "마녀 모자"}, {"f": "s_tangerine.webp", "n": "귤"}, {"f": "s_bubble.webp", "n": "말풍선"}, {"f": "s_web.webp", "n": "거미줄"}];
var stickerImgs={}, stickersReady=null, stk=[], stkSel=null;
function loadStickers(){
  if(stickersReady)return stickersReady;
  stickersReady=Promise.all(STK.map(function(s){return new Promise(function(ok){
    var im=new Image();im.onload=function(){stickerImgs[s.f]=im;ok()};im.onerror=function(){ok()};im.src='stickers/'+s.f})}));
  return stickersReady;
}
function drawStickers(ctx2,W,H,data){
  (data.stickers||[]).forEach(function(st){
    var im=stickerImgs[st.f];if(!im)return;
    var sz=st.s*W;ctx2.save();ctx2.translate(st.x*W,st.y*H);ctx2.rotate(st.r*Math.PI/180);
    ctx2.drawImage(im,-sz/2,-sz/2,sz,sz);ctx2.restore();
  });
}
function getStickers(){return stk.map(function(o){return {f:o.f,x:o.x,y:o.y,s:o.s,r:o.r}})}
(function buildStickerUI(){
  var layer=$('#stkLayer'), wrap=$('#stkWrap'), bar=$('#stkBar'), tools=$('#stkTools');
  bar.innerHTML=STK.map(function(s){return '<button type="button" class="stkThumb" data-f="'+s.f+'" aria-label="'+s.n+'"><img src="stickers/'+s.f+'" alt=""><span>'+s.n+'</span></button>'}).join('');
  /* 캔바처럼: 고른 스티커 둘레에 박스 — 모서리를 끌면 크기, 위 동그라미를 끌면 회전, ✕ 로 삭제 */
  var box=document.createElement('div');box.className='stkBox';
  box.innerHTML='<i class="hd tl" data-h="s"></i><i class="hd tr" data-h="s"></i><i class="hd bl" data-h="s"></i><i class="hd br" data-h="s"></i><i class="rotStem"></i><i class="rot" data-h="r">↻</i><b class="xdel" data-h="d">✕</b>';
  wrap.appendChild(box);
  function updateBox(){
    if(!stkSel){box.classList.remove('on');return}
    var w=layer.offsetWidth,o=stkSel,sz=Math.max(34,o.s*w);
    box.style.left=(o.x*100)+'%';box.style.top=(o.y*100)+'%';box.style.width=sz+'px';box.style.height=sz+'px';
    box.style.transform='translate(-50%,-50%) rotate('+o.r+'deg)';box.classList.add('on');
  }
  function place(o){
    o.el.style.left=(o.x*100)+'%';o.el.style.top=(o.y*100)+'%';o.el.style.width=(o.s*100)+'%';
    o.el.style.transform='translate(-50%,-50%) rotate('+o.r+'deg)';
    if(o===stkSel)updateBox();
  }
  function select(o){
    stkSel=o;stk.forEach(function(q){q.el.classList.toggle('sel',q===o)});
    if(o){stk.splice(stk.indexOf(o),1);stk.push(o);layer.appendChild(o.el)}
    tools.classList.toggle('on',!!o);updateBox();
  }
  function remove(o){o.el.remove();stk.splice(stk.indexOf(o),1);if(stkSel===o)select(null)}
  function add(f){
    if(stk.length>=12){toast('스티커는 12개까지 붙일 수 있어요');return}
    var el=document.createElement('img');el.className='stkItem';el.src='stickers/'+f;el.draggable=false;
    var o={f:f,x:0.5,y:0.45,s:0.36,r:0,el:el};stk.push(o);layer.appendChild(el);place(o);select(o);
    var ptrs={}, start=null;
    function snap(){var ids=Object.keys(ptrs);
      if(ids.length>=2){var a=ptrs[ids[0]],b=ptrs[ids[1]];start={n:2,d:Math.hypot(a.x-b.x,a.y-b.y)||1,ang:Math.atan2(b.y-a.y,b.x-a.x),s:o.s,r:o.r}}
      else if(ids.length===1){start={n:1,px:ptrs[ids[0]].x,py:ptrs[ids[0]].y,x:o.x,y:o.y}}else start=null}
    el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};if(stkSel!==o)select(o);snap()});
    el.addEventListener('pointermove',function(e){
      if(!ptrs[e.pointerId])return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
      var rect=layer.getBoundingClientRect(),ids=Object.keys(ptrs);if(!start)return;
      if(ids.length>=2&&start.n===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];
        o.s=Math.max(0.1,Math.min(1.3,start.s*Math.hypot(a.x-b.x,a.y-b.y)/start.d));
        o.r=start.r+(Math.atan2(b.y-a.y,b.x-a.x)-start.ang)*180/Math.PI}
      else if(ids.length===1&&start.n===1){
        o.x=Math.max(0,Math.min(1,start.x+(e.clientX-start.px)/rect.width));o.y=Math.max(0,Math.min(1,start.y+(e.clientY-start.py)/rect.height))}
      place(o);
    });
    function up(e){delete ptrs[e.pointerId];snap()}
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  }
  /* 박스 핸들 드래그 */
  var drag=null;
  box.addEventListener('pointerdown',function(e){
    var h=e.target.closest('[data-h]');if(!h||!stkSel)return;e.preventDefault();e.stopPropagation();
    var k=h.dataset.h;if(k==='d'){remove(stkSel);return}
    h.setPointerCapture(e.pointerId);
    var rect=layer.getBoundingClientRect(),cx=rect.left+stkSel.x*rect.width,cy=rect.top+stkSel.y*rect.height;
    drag={k:k,o:stkSel,cx:cx,cy:cy,d0:Math.hypot(e.clientX-cx,e.clientY-cy)||1,s0:stkSel.s,a0:Math.atan2(e.clientY-cy,e.clientX-cx),r0:stkSel.r};
  });
  box.addEventListener('pointermove',function(e){
    if(!drag)return;var o=drag.o;
    if(drag.k==='s')o.s=Math.max(0.1,Math.min(1.3,drag.s0*Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)/drag.d0));
    else o.r=drag.r0+(Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)-drag.a0)*180/Math.PI;
    place(o);
  });
  function endDrag(){drag=null}
  box.addEventListener('pointerup',endDrag);box.addEventListener('pointercancel',endDrag);
  bar.addEventListener('click',function(e){var b=e.target.closest('.stkThumb');if(b)add(b.dataset.f)});
  tools.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||!stkSel)return;var o=stkSel,k=b.dataset.k;
    if(k==='big')o.s=Math.min(1.3,o.s*1.12);if(k==='small')o.s=Math.max(0.1,o.s/1.12);
    if(k==='left')o.r-=12;if(k==='right')o.r+=12;
    if(k==='del'){remove(o);return}
    place(o);
  });
  /* 빈 곳(사진)을 누르면 선택 해제 */
  $('#slots').addEventListener('pointerdown',function(){if(stkSel)select(null)});
  window.addEventListener('resize',updateBox);
  loadStickers();
})();
