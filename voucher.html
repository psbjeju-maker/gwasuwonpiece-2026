<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>사전 신청 교환</title>
<style>
:root{--bg:#FBF7EE;--surface:#fff;--ink:#20281F;--ink-2:#4A5445;--muted:#6B6650;--line:#E4DCC4;--accent:#D9641E;--leaf:#2E6B4F;--leaf-soft:#DCEAE1;--danger:#B3432F;--danger-soft:#F6DFD8;--info-soft:#F7DFC4;--on:#FBF7EE;--navy:#14243A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#181B14;--surface:#20241B;--ink:#F3EFDF;--ink-2:#C7C4AE;--muted:#8E9280;--line:#33372A;--accent:#E9843C;--leaf:#7FBB98;--leaf-soft:#22301F;--danger:#E8836C;--danger-soft:#3A211B;--info-soft:#3A2A18;--on:#181B14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:0 16px 48px}
.wrap{max-width:520px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px;margin:4px 0 10px}
label{display:block;margin:10px 0 4px;font-weight:700;font-size:15px}
input{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:var(--bg);color:var(--ink)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.btn{min-height:54px;padding:0 18px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-weight:800}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on);width:100%;margin-top:12px}
.btn.scan{background:var(--navy);border-color:var(--navy);color:#fff;flex:0 0 auto}
.btn.sm{min-height:44px;font-size:15px}
.btn:disabled{opacity:.5}
.res{border-radius:14px;padding:16px;margin-top:12px;text-align:center}
.res.ok{background:var(--leaf-soft);color:var(--leaf)}.res.no{background:var(--danger-soft);color:var(--danger)}.res.info{background:var(--info-soft);color:var(--accent)}
.res .big{font-size:24px;font-weight:800}.res .sub{font-size:15px;margin-top:4px;color:var(--ink)}
.cand{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.err{color:var(--danger);font-weight:700;font-size:14px;min-height:1.2em}
#scanner{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center}
#scanner video{width:100%;max-height:80vh;object-fit:cover}
#scanner .frame{position:absolute;width:min(70vw,300px);aspect-ratio:1;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scanner p{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);color:#fff;font-weight:700}
#scanner button{position:absolute;bottom:28px;min-height:52px;padding:0 28px;border-radius:99px;border:0;background:#fff;font-weight:800;font-size:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>사전 신청 교환 <span id="envTag" hidden style="font-size:13px;background:var(--accent);color:var(--on);border-radius:99px;padding:1px 8px">테스트</span></h1><button class="btn sm" id="btnOut" type="button" hidden>로그아웃</button></header>

  <section id="loginView" class="card">
    <p class="muted">총괄에게 받은 6자리 패스 판매 담당 PIN을 넣어 주세요.</p>
    <label for="pin">담당 PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <button class="btn p" id="btnLogin" type="button">로그인</button>
    <p class="err" id="loginMsg"></p>
  </section>

  <section id="mainView" hidden>
    <div class="card">
      <p class="muted">손님 폰의 교환 QR을 찍으면 이름과 받을 개수가 떠요. 손목띠를 채워 준 뒤 「지급 완료」를 눌러요.</p>
      <div class="inrow"><input id="vIn" placeholder="교환 QR" autocomplete="off" autocapitalize="characters"><button class="btn scan" id="btnScan" type="button">QR 스캔</button></div>
      <div id="vRes"></div>
    </div>
    <details class="card"><summary style="font-weight:800">QR이 없을 때 이름·전화 뒷자리로 찾기</summary>
      <input id="vQ" style="margin-top:10px;text-transform:none" placeholder="이름 또는 전화번호 뒷 4자리" autocomplete="off">
      <button class="btn p" id="vFind" type="button" style="margin-top:8px">찾기</button><div id="vList"></div>
    </details>
  </section>
</div>

<div id="scanner" hidden><video id="scVideo" playsinline muted></video><div class="frame"></div><p>교환 QR을 사각형 안에 맞춰 주세요</p><button id="scClose" type="button">닫기</button></div>

<script src="gw-server.js"></script>
<script src="ev-client.js?v=7"></script>
<script>
(function(){
var TEST=/[?&]ev=test\b/.test(location.search), EID=TEST?'gwtest':'gwasu';
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function errMsg(e){return (e&&(e.hint||e.message||e.reason))||'처리하지 못했어요'}
function busy(btn,p){btn.disabled=true;return p.then(function(r){btn.disabled=false;return r},function(e){btn.disabled=false;throw e})}
function call(n,d){return EV.staff(n,Object.assign({eventId:EID},d||{}))}
function res(kind,big,sub){$('vRes').innerHTML='<div class="res '+kind+'"><div class="big">'+esc(big)+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'}
$('envTag').hidden=!TEST;

function start(){
  var i=EV.sessionInfo(), ok=!!i&&(i.role==='admin'||i.task==='pass');
  if(i&&!ok) EV.logout();
  $('loginView').hidden=ok; $('mainView').hidden=!ok; $('btnOut').hidden=!ok;
}
$('btnLogin').onclick=function(){
  $('loginMsg').textContent='';
  busy(this,EV.taskLogin($('pin').value.trim())).then(function(r){
    if(r.task!=='pass'){EV.logout();$('loginMsg').textContent='패스 판매 담당 PIN이 아니에요.';return}
    $('pin').value='';start();
  },function(e){$('loginMsg').textContent=errMsg(e)});
};
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')$('btnLogin').click()});
$('btnOut').onclick=function(){EV.logout();start()};

function show(r,code){
  $('vRes').innerHTML='<div class="res '+(r.left>0?'ok':'info')+'"><div class="big">'+esc(r.name)+' · 손목띠 '+r.left+'개</div><div class="sub">신청 '+r.qty+'개 중 '+r.used+'개 받아 감 · 전화 뒷자리 '+esc(r.phone4)+'</div></div>'+
    (r.left>0?'<label for="vCnt">지금 지급할 개수</label><input id="vCnt" type="number" min="1" max="'+r.left+'" value="'+r.left+'" inputmode="numeric"><button class="btn p" id="vGive" type="button">지급 완료</button>':'');
  if(r.left>0) $('vGive').onclick=function(){
    busy(this,call('voucherUse',{code:code,confirm:true,count:+$('vCnt').value})).then(function(g){
      res('ok','손목띠 '+g.gave+'개 지급 완료',esc(g.name)+' · 남은 '+g.left+'개'); $('vIn').value=''; $('vList').innerHTML='';
    },function(e){res('no',errMsg(e))});
  };
}
function look(){
  var c=$('vIn').value.trim(); if(!c){res('no','교환 QR을 찍어 주세요');return}
  call('voucherUse',{code:c}).then(function(r){show(r,c)},function(e){
    if(e.code==='permission-denied'&&/로그인/.test(e.reason||'')){start();return}
    res('no',errMsg(e));
  });
}
$('vIn').addEventListener('keydown',function(e){if(e.key==='Enter')look()});
$('vFind').onclick=function(){
  busy(this,call('voucherFind',{q:$('vQ').value.trim()})).then(function(r){
    $('vList').innerHTML=r.items.length?r.items.map(function(x){return '<div class="cand"><span><b>'+esc(x.name)+'</b> · 뒷자리 '+esc(x.phone4)+' · '+x.left+'개</span><button class="btn sm" data-pick="'+esc(x.code)+'" type="button">선택</button></div>'}).join(''):'<p class="muted">승인되고 남은 신청이 없어요.</p>';
  },function(e){$('vList').innerHTML='<p class="err">'+esc(errMsg(e))+'</p>'});
};
$('vList').addEventListener('click',function(e){var b=e.target.closest('[data-pick]');if(!b)return;$('vIn').value=b.dataset.pick;look()});

/* QR 스캔 */
var stream=null, raf=0;
function stopScan(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;$('scanner').hidden=true}
function tick(){
  var v=$('scVideo');
  if(v.readyState>=2&&window.jsQR){
    var c=tick.c||(tick.c=document.createElement('canvas')), w=v.videoWidth, hh=v.videoHeight, s=Math.min(1,640/w);
    c.width=w*s;c.height=hh*s; var x=c.getContext('2d'); x.drawImage(v,0,0,c.width,c.height);
    var img=x.getImageData(0,0,c.width,c.height), q=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
    if(q&&q.data){stopScan();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){};$('vIn').value=String(q.data).trim().toUpperCase();look();return}
  }
  raf=requestAnimationFrame(tick);
}
var jsqrLoading=null;
function needJsqr(){if(window.jsQR)return Promise.resolve();return jsqrLoading||(jsqrLoading=new Promise(function(ok,no){var s=document.createElement('script');s.src='jsqr.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)}))}
$('btnScan').onclick=function(){
  needJsqr().then(function(){
    $('scanner').hidden=false;
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){stream=s;var v=$('scVideo');v.srcObject=s;v.play();tick()},function(){stopScan();res('no','카메라를 쓸 수 없어요','번호를 직접 입력하거나 이름으로 찾아 주세요')});
  });
};
$('scClose').onclick=stopScan;
start();
})();
</script>
</body>
</html>
