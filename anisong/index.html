<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애니송 진행표</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--c:#1E5AA8;--dk:#0d2547;--bg:#f2f5fa;--ink:#14213d;--mut:#6b7a90;--line:#dfe5ee;--red:#e0453a;--gold:#f5b800}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:18px;padding-bottom:160px}
button,a.k{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:700;text-decoration:none}
header{background:var(--dk);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-family:'Black Han Sans';font-weight:400;font-size:26px;margin:0;margin-right:auto}
header button{background:#1b3a6b;color:#fff;font-size:15px;padding:9px 12px}
#count{color:#9fc0ef;font-size:15px}
ul{list-style:none;margin:0 auto;padding:12px;max-width:760px}
li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;border:2px solid transparent}
li.on{border-color:var(--gold);background:#fff8dc}
li.done{opacity:.45}
.no{font-family:'Black Han Sans';font-size:22px;color:var(--c);width:34px;text-align:center;flex:none}
.t{flex:1;min-width:0;font-weight:700;font-size:19px;cursor:pointer}
.chk{width:30px;height:30px;flex:none;accent-color:var(--c)}
.pl{background:var(--gold);color:var(--dk);font-size:18px;padding:12px 16px;flex:none;min-width:64px}
li.on .pl{background:var(--dk);color:#fff}
a.k{background:var(--red);color:#fff;font-size:16px;padding:12px 12px;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;transform:translateY(110%);transition:transform .25s;background:var(--dk);color:#fff;padding:10px 16px 14px;z-index:5}
.bar.show{transform:none}
.bar .r{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.bar .r+.r{margin-top:8px}
.bar .tm{font-size:15px;color:#9fc0ef;flex:none;width:44px;text-align:center;font-variant-numeric:tabular-nums}
#seek{flex:1;height:32px;accent-color:var(--gold)}
.bar .now{flex:1;min-width:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:var(--gold);color:var(--dk);font-size:20px;padding:12px 20px;flex:none;min-width:150px}
.vid{position:fixed;right:-9999px;bottom:0;width:320px;height:180px}
.vid.show{right:16px;bottom:130px;width:300px;height:169px;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:6}
.vid iframe{width:100%;height:100%}
</style>
</head>
<body>
<header>
  <h1>애니송 진행표</h1>
  <span id="count"></span>
  <button id="tVid">영상 보기</button>
  <button id="tReset">체크 초기화</button>
</header>
<ul id="list"></ul>
<div class="bar" id="bar">
  <div class="r"><span class="now" id="now">대기 중</span><button id="bPause">⏸ 일시정지</button></div>
  <div class="r"><span class="tm" id="tCur">0:00</span><input type="range" id="seek" min="0" max="100" step="1" value="0"><span class="tm" id="tDur">0:00</span></div>
</div>
<div class="vid" id="vid"><div id="player"></div></div>

<script>
// [작품, 노래 영상 ID, 노래방 영상 ID 또는 ?검색어]
const SONGS = [["포켓몬스터","dosnQVuYIi0","?포켓몬스터 1기 오프닝 노래방"],["디지몬 어드벤처","9S0RV3901CQ","53pAgurV5ys"],["디지몬 테이머즈","ZSaZk5xv6jU","LtDdbois7I4"],["카드캡터 체리","e6zp5Qob9ko","MSaDEgrl9V4"],["슬램덩크","C0EZ09az1k4","5FRiopHehWw"],["짱구는 못말려","rL42J_1SfgY","mCPiBXnqz8w"],["원피스","etAtxvSVT78","ANdlcNgiYbk"],["나루토","5dmlf2PYj7A","f0g3JRrLqe0"],["명탐정 코난","vihrlRWrYHA","?명탐정 코난 1기 오프닝 노래방"],["이누야샤","Yjpj_DnqkQo","g1EHe-srDkI"],["꼬마마법사 레미","OGxFS6bGOoM","?꼬마마법사 레미 1기 오프닝 노래방"],["웨딩피치","schOL4QfoRc","MYQl6c_AiZc"],["달빛천사","eMWCQp3Sues","Q6NRkovmvnI"],["세일러문","xG6NtaLP2vQ","pEUmsBL-HnE"],["개구리 중사 케로로","FM6dwiFP0Us","ICVOBWERdlI"],["보노보노","vaTZnfpBDEI","?보노보노 지름길로 가고파 노래방"],["꾸러기 수비대","9J_3R2Nphac","snjAeJCkKBw"],["천사소녀 네티","oE28qvW6kj4","NUZeErR7Yqw"],["탑블레이드","JQRYbUnLbm4","NVpKGMU1xAg"],["유희왕","GM3eisuIEEA","Yr4B86y4HEw"],["마동왕 그랑죠","grAeFpEdtG4","MGbKmjpzBE4"],["사이버 포뮬러","zl2FVjPoerw","?사이버 포뮬러 한국 오프닝 노래방"],["미래소년 코난","wWRwnEAEklI","BIBMD3jG2d8"],["달려라 하니","mvvydE1Q5JI","qmaNnzOPgK8"],["아기공룡 둘리","5ZXYeCqixxw","7Zi4FPHNLME"],["날아라 슈퍼보드","y_6I5nz6_eM","WZEjgWW7VyA"],["검정고무신","HIi8_yp9Kno","u24XpJp31js"],["도라에몽","QISHFAP3I5Y","jptskqeXU3k"],["아따맘마","mS9g-WyKC7U","EAStVzXTfxM"],["드래곤볼","vLanxuRgnoI","?드래곤볼Z 한국 오프닝 노래방"],["강철의 연금술사","ZcNAbONjXfA","?강철의 연금술사 멜리사 노래방"],["안녕 자두야","pmY4VaPur_8","NcpX6TnwLgE"],["신비아파트","dUwgMcFlGRE","UwlofcneOmk"],["괴짜가족","d1C5VI71qaU","FeT-Xt_pujU"],["꿈빛 파티시엘","G0Il1Qz7giw","4OzU7_tfP3c"],["쾌걸 근육맨","Iz_lJA2iH7s","qwNLBfgv_pQ"],["뽀롱뽀롱 뽀로로","E0W5sJZ2d64","J9vaJdGwoKA"],["캐치! 티니핑","0RVLt9QdQ74","bJ_ykc_UTFE"],["아이엠스타","cSA2FP2_l0o","?아이엠스타 1기 오프닝 노래방"],["에그엔젤 코코밍","4eiVl4OSE2M","HUB8YjLSKa4"]];
const KEY='anisong-staff-v1';
const $=id=>document.getElementById(id);
let done=[]; try{ done=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(done)); }catch(e){} };
const karaUrl=k=>k[0]==='?'?'https://www.youtube.com/results?search_query='+encodeURIComponent(k.slice(1)):'https://www.youtube.com/watch?v='+k;
let P=null, ytReady=false, cur=null, loaded=null, pending=false;

function render(){
  const ul=$('list'); ul.innerHTML='';
  SONGS.forEach(([t,v,k],i)=>{
    const li=document.createElement('li');
    li.className=(cur===i?'on ':'')+(done.includes(i)?'done':'');
    const playing=cur===i&&P&&P.getPlayerState&&P.getPlayerState()===1;
    li.innerHTML=`<span class="no">${i+1}</span><span class="t"></span><button class="pl">${playing?'⏸':'▶'}</button><a class="k" target="_blank" rel="noopener">노래방</a><input type="checkbox" class="chk" title="진행 완료">`;
    li.querySelector('.t').textContent=t;
    li.querySelector('.k').href=karaUrl(k);
    const c=li.querySelector('.chk'); c.checked=done.includes(i);
    c.onchange=()=>{ done=c.checked?[...done,i]:done.filter(x=>x!==i); save(); render(); };
    li.querySelector('.pl').onclick=()=>cur===i?toggle():play(i);
    li.querySelector('.t').onclick=()=>{ if(cur!==i) play(i); };
    ul.appendChild(li);
  });
  $('count').textContent=`${done.length} / ${SONGS.length} 완료`;
}
function play(i){
  cur=i; $('bar').classList.add('show'); $('now').textContent='♪ '+(i+1)+'. '+SONGS[i][0]; render();
  const v=SONGS[i][1];
  if(!ytReady) return;
  if(!P){ if(pending) return; pending=true; loaded=v;
    new YT.Player('player',{videoId:v,playerVars:{rel:0,playsinline:1,autoplay:1},events:{
      onReady:e=>{ P=e.target; const w=cur!=null&&SONGS[cur][1]; if(w&&w!==loaded){ loaded=w; P.loadVideoById(w); } else P.playVideo(); },
      onStateChange:()=>sync()
    }}); return; }
  if(loaded!==v){ P.loadVideoById(v); loaded=v; } else { P.seekTo(0,true); P.playVideo(); }
}
// 재생/일시정지 하나로 (끝난 곡은 처음부터 다시)
function toggle(){ if(!P||cur==null) return; const s=P.getPlayerState(); if(s===1) P.pauseVideo(); else if(s===0){ P.seekTo(0,true); P.playVideo(); } else P.playVideo(); }
let lastSt=null;
function sync(){ if(!P||!P.getPlayerState) return; const st=P.getPlayerState()===1; $('bPause').textContent=st?'⏸ 일시정지':'▶ 재생'; if(st!==lastSt){ lastSt=st; render(); } }
// 재생바: 원하는 부분으로 끌어서 이동
const mmss=t=>{ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
let dragging=false;
$('seek').addEventListener('input',()=>{ dragging=true; $('tCur').textContent=mmss(+$('seek').value); });
$('seek').addEventListener('change',()=>{ if(P&&P.seekTo&&cur!=null){ P.seekTo(+$('seek').value,true); P.playVideo(); } dragging=false; });
$('bPause').onclick=toggle;
setInterval(()=>{
  if(!P||!P.getCurrentTime) return;
  const d=P.getDuration()||0, t=P.getCurrentTime()||0;
  $('seek').max=Math.max(1,Math.floor(d)); $('tDur').textContent=mmss(d);
  if(!dragging){ $('seek').value=Math.floor(t); $('tCur').textContent=mmss(t); }
  sync();
},300);
$('tReset').onclick=()=>{ done=[]; save(); render(); };
let showVid=false;
$('tVid').onclick=()=>{ showVid=!showVid; $('vid').classList.toggle('show',showVid); $('tVid').textContent=showVid?'영상 숨기기':'영상 보기'; };
window.onYouTubeIframeAPIReady=()=>{ ytReady=true; };
render();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
