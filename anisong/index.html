<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애니송 맞추기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--c:#1E5AA8;--dk:#0d2547;--bg:#f2f5fa;--ink:#14213d;--mut:#6b7a90;--line:#d6deea;--red:#e0453a;--gold:#f5b800}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:18px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:700}
header{background:var(--dk);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 24px;flex-wrap:wrap}
header h1{font-family:'Black Han Sans';font-weight:400;font-size:32px;margin:0;margin-right:auto}
.tool{background:#1b3a6b;color:#fff;font-size:16px;padding:10px 14px}
main{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px;max-width:1500px;margin:0 auto;align-items:start}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.q{aspect-ratio:1;background:var(--c);color:#fff;font-family:'Black Han Sans';font-size:40px;font-weight:400}
.q.done{background:#c3ccd9}
.q.cur{outline:5px solid var(--gold);outline-offset:-5px}
.stage{background:var(--dk);color:#fff;border-radius:24px;padding:28px;text-align:center;position:sticky;top:24px}
.qno{font-family:'Black Han Sans';font-size:100px;line-height:1;color:var(--gold)}
.eq{display:flex;gap:8px;justify-content:center;align-items:flex-end;height:70px;margin:18px 0}
.eq i{width:14px;background:#4f8de0;border-radius:4px;height:10px}
.eq.on i{animation:eq .5s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.1s}.eq i:nth-child(3){animation-delay:.25s}.eq i:nth-child(4){animation-delay:.05s}.eq i:nth-child(5){animation-delay:.3s}.eq i:nth-child(6){animation-delay:.15s}.eq i:nth-child(7){animation-delay:.2s}
@keyframes eq{from{height:10px}to{height:66px}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns button,.btns a{font-family:'Black Han Sans';font-weight:400;font-size:30px;padding:24px 10px;border-radius:16px;text-decoration:none;display:block}
.play{background:var(--gold);color:var(--dk)}
.stop{background:#2d4f86;color:#fff}
.reveal{background:#fff;color:var(--dk)}
.kara{background:var(--red);color:#fff}
.ans{min-height:120px;margin-top:22px;display:flex;flex-direction:column;justify-content:center}
.ans .a1{font-family:'Black Han Sans';font-size:52px}
.ans .qm{font-family:'Black Han Sans';font-size:52px;color:#3d5f96}
.vid{position:absolute;left:-9999px;top:0;width:320px;height:180px}
.vid.show{position:relative;left:0;width:100%;height:auto;aspect-ratio:16/9;margin-top:16px;border-radius:12px;overflow:hidden}
.vid iframe{width:100%;height:100%}
.keys{color:#7f9cc9;font-size:14px;margin-top:16px}
.hint{color:#ffd76a;font-size:17px;margin-top:12px}
.hide{display:none!important}
@media (max-width:900px){main{grid-template-columns:1fr;padding:16px}.stage{position:static}.qno{font-size:72px}.btns button,.btns a{font-size:24px;padding:18px 8px}}
</style>
</head>
<body>
<header>
  <h1>애니송 맞추기</h1>
  <button class="tool" id="tShuffle">순서 섞기</button>
  <button class="tool" id="tOrder">원래 순서</button>
  <button class="tool" id="tReset">진행 초기화</button>
  <button class="tool" id="tVid">영상 보이기: 끔</button>
</header>
<main>
  <div id="grid"></div>
  <div class="stage">
    <div class="qno" id="qNo">Q</div>
    <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="btns">
      <button class="play" id="bPlay">▶ 재생</button>
      <button class="stop" id="bStop">■ 정지</button>
      <button class="reveal" id="bReveal">정답 공개</button>
      <a class="kara" id="bKara" target="_blank" rel="noopener">노래방 🎤</a>
    </div>
    <div class="ans" id="ans"><div class="qm">?</div></div>
    <div class="vid" id="vid"><div id="player"></div></div>
    <div class="hint hide" id="hint">소리가 안 나오면 위 '영상 보이기'를 켜고 영상을 한 번 눌러주세요</div>
    <div class="keys">스페이스 = 재생/정지 · Enter = 정답 · → = 다음 문제</div>
  </div>
</main>

<script>
// [작품, 노래 영상 ID, 노래방 영상 ID 또는 ?검색어]
const SONGS = [["포켓몬스터","dosnQVuYIi0","?포켓몬스터 1기 오프닝 노래방"],["디지몬 어드벤처","9S0RV3901CQ","53pAgurV5ys"],["디지몬 테이머즈","ZSaZk5xv6jU","LtDdbois7I4"],["카드캡터 체리","e6zp5Qob9ko","MSaDEgrl9V4"],["슬램덩크","C0EZ09az1k4","5FRiopHehWw"],["짱구는 못말려","rL42J_1SfgY","mCPiBXnqz8w"],["원피스","etAtxvSVT78","ANdlcNgiYbk"],["나루토","5dmlf2PYj7A","f0g3JRrLqe0"],["명탐정 코난","vihrlRWrYHA","?명탐정 코난 1기 오프닝 노래방"],["이누야샤","Yjpj_DnqkQo","g1EHe-srDkI"],["꼬마마법사 레미","OGxFS6bGOoM","?꼬마마법사 레미 1기 오프닝 노래방"],["웨딩피치","schOL4QfoRc","MYQl6c_AiZc"],["달빛천사","eMWCQp3Sues","Q6NRkovmvnI"],["세일러문","xG6NtaLP2vQ","pEUmsBL-HnE"],["개구리 중사 케로로","FM6dwiFP0Us","ICVOBWERdlI"],["보노보노","vaTZnfpBDEI","?보노보노 지름길로 가고파 노래방"],["꾸러기 수비대","9J_3R2Nphac","snjAeJCkKBw"],["천사소녀 네티","oE28qvW6kj4","NUZeErR7Yqw"],["탑블레이드","JQRYbUnLbm4","NVpKGMU1xAg"],["유희왕","GM3eisuIEEA","Yr4B86y4HEw"],["마동왕 그랑죠","grAeFpEdtG4","MGbKmjpzBE4"],["사이버 포뮬러","zl2FVjPoerw","?사이버 포뮬러 한국 오프닝 노래방"],["미래소년 코난","wWRwnEAEklI","BIBMD3jG2d8"],["달려라 하니","mvvydE1Q5JI","qmaNnzOPgK8"],["아기공룡 둘리","5ZXYeCqixxw","7Zi4FPHNLME"],["날아라 슈퍼보드","y_6I5nz6_eM","WZEjgWW7VyA"],["검정고무신","HIi8_yp9Kno","u24XpJp31js"],["도라에몽","QISHFAP3I5Y","jptskqeXU3k"],["아따맘마","mS9g-WyKC7U","EAStVzXTfxM"],["드래곤볼","vLanxuRgnoI","?드래곤볼Z 한국 오프닝 노래방"],["강철의 연금술사","ZcNAbONjXfA","?강철의 연금술사 멜리사 노래방"],["안녕 자두야","pmY4VaPur_8","NcpX6TnwLgE"],["신비아파트","dUwgMcFlGRE","UwlofcneOmk"],["괴짜가족","d1C5VI71qaU","FeT-Xt_pujU"],["꿈빛 파티시엘","G0Il1Qz7giw","4OzU7_tfP3c"],["쾌걸 근육맨","Iz_lJA2iH7s","qwNLBfgv_pQ"]];

const KEY='anisong-simple-v1';
const $=id=>document.getElementById(id);
let st={order:SONGS.map((_,i)=>i),done:[]};
try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&Array.isArray(d.order)&&d.order.length===SONGS.length) st=d; }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
let cur=null, P=null, pending=false, loaded=null, ytReady=false, playing=false;

const karaUrl=k=>k[0]==='?'?'https://www.youtube.com/results?search_query='+encodeURIComponent(k.slice(1)):'https://www.youtube.com/watch?v='+k;

function render(){
  const g=$('grid'); g.innerHTML='';
  st.order.forEach((si,n)=>{
    const b=document.createElement('button');
    b.className='q'+(st.done.includes(si)?' done':'')+(cur===si?' cur':'');
    b.textContent=n+1; b.onclick=()=>pick(si); g.appendChild(b);
  });
}
function pick(si){
  stop(); cur=si; const n=st.order.indexOf(si)+1;
  $('qNo').textContent='Q'+n; $('ans').innerHTML='<div class="qm">?</div>';
  $('bKara').href=karaUrl(SONGS[si][2]); $('hint').classList.add('hide');
  render(); cue();
}
// 플레이어는 첫 곡 영상으로 만든다 (빈 플레이어는 유튜브 오류 화면이 뜸)
function cue(){
  if(cur==null||!ytReady) return;
  const v=SONGS[cur][1];
  if(P){ if(loaded!==v){ P.cueVideoById(v); loaded=v; } return; }
  if(pending) return; pending=true; loaded=v;
  new YT.Player('player',{videoId:v,playerVars:{rel:0,playsinline:1,controls:1},events:{
    onReady:e=>{ P=e.target; const w=cur!=null&&SONGS[cur][1]; if(w&&w!==loaded){ loaded=w; P.cueVideoById(w); } },
    onStateChange:e=>{ playing=e.data===1; $('eq').classList.toggle('on',playing); if(playing) $('hint').classList.add('hide'); }
  }});
}
function play(){
  if(cur==null||!P) return;
  const v=SONGS[cur][1];
  if(loaded!==v){ P.loadVideoById(v); loaded=v; } else P.playVideo();
  P.unMute(); P.setVolume(100);
  setTimeout(()=>{ if(P&&[1,3].indexOf(P.getPlayerState())<0) $('hint').classList.remove('hide'); },2000);
}
function stop(){ if(P&&P.pauseVideo) P.pauseVideo(); $('eq').classList.remove('on'); }
function reveal(){
  if(cur==null) return;
  $('ans').innerHTML='<div class="a1"></div>'; $('ans').firstChild.textContent=SONGS[cur][0];
  if(!st.done.includes(cur)){ st.done.push(cur); save(); } render();
}
function next(){
  const i=st.order.indexOf(cur);
  const n=st.order.slice(i+1).find(s=>!st.done.includes(s)) ?? st.order.find(s=>!st.done.includes(s));
  if(n!=null) pick(n);
}
$('bPlay').onclick=play; $('bStop').onclick=stop; $('bReveal').onclick=reveal;
$('tShuffle').onclick=()=>{ const o=st.order; for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];} save(); if(cur!=null) pick(cur); else render(); };
$('tOrder').onclick=()=>{ st.order=SONGS.map((_,i)=>i); save(); if(cur!=null) pick(cur); else render(); };
$('tReset').onclick=()=>{ st.done=[]; save(); render(); };
let showVid=false;
$('tVid').onclick=()=>{ showVid=!showVid; $('vid').classList.toggle('show',showVid); $('tVid').textContent='영상 보이기: '+(showVid?'켬':'끔'); };
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '){ e.preventDefault(); playing?stop():play(); }
  else if(k==='Enter'){ e.preventDefault(); reveal(); }
  else if(k==='ArrowRight') next();
});
window.onYouTubeIframeAPIReady=()=>{ ytReady=true; cue(); };
render(); pick(st.order.find(s=>!st.done.includes(s)) ?? st.order[0]);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
