<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#04111c">
<title>신 위치 공유 — 스태프 전용</title>
<style>
@font-face{font-family:SCDream;src:url(../../fonts/SCDream4.woff)format('woff');font-weight:400;font-display:swap}
@font-face{font-family:SCDream;src:url(../../fonts/SCDream5.woff)format('woff');font-weight:600;font-display:swap}
@font-face{font-family:SCDream;src:url(../../fonts/SCDream7.woff)format('woff');font-weight:800;font-display:swap}
:root{
  --ink:#04111c; --gold:#FFC94A; --coral:#FF5A47; --teal:#2FD1C5;
  --txt:#e9f1f7; --dim:#8aa3b6; --line:rgba(255,201,74,.22);
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:SCDream,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%,#1b4463 0%,transparent 60%),
    linear-gradient(180deg,#04111c 0%,#071a29 45%,#04111c 100%);
  background-attachment:fixed;color:var(--txt);min-height:100dvh}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:460px;margin:0 auto;padding:20px 18px calc(30px + var(--safe))}
h1{font-size:19px;font-weight:800;margin:6px 0 4px}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--gold);font-weight:800}
.warn{border:1px solid rgba(255,201,74,.3);background:rgba(255,201,74,.08);border-radius:13px;
  padding:13px 15px;font-size:12.5px;line-height:1.7;color:#f0dfae;margin:14px 0}
.warn b{color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:16px;margin-bottom:14px}
.godgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.godbtn{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,255,255,.12);font-size:13px;font-weight:700;text-align:center}
.godbtn.on{background:rgba(255,201,74,.14);border-color:var(--gold);color:var(--gold)}
.toggle{display:block;width:100%;padding:20px;border-radius:16px;font-weight:800;font-size:17px;
  text-align:center;margin-top:16px;transition:.15s}
.toggle.off{background:linear-gradient(180deg,#5fe6da,#18a196);color:#032b28}
.toggle.on{background:linear-gradient(180deg,#ff8b7c,#d9432f);color:#3a0a04;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,71,.4)}50%{box-shadow:0 0 0 14px rgba(255,90,71,0)}}
.status{text-align:center;font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
.status b{color:var(--txt)}
.admin{margin-top:26px;border-top:1px dashed rgba(255,255,255,.12);padding-top:16px}
.admin summary{font-size:12px;color:var(--dim);cursor:pointer;font-weight:700}
.admin input{width:100%;padding:12px;border-radius:10px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);color:var(--txt);font-size:15px;margin:10px 0;text-align:center;
  letter-spacing:.3em}
.admin button{width:100%;padding:12px;border-radius:10px;background:rgba(255,90,71,.15);
  border:1px solid rgba(255,90,71,.35);color:#ff8b7c;font-weight:700;font-size:13px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:99;
  background:rgba(10,31,49,.97);border:1px solid var(--line);color:var(--txt);padding:12px 20px;border-radius:99px;
  font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;text-align:center;
  max-width:88vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">탐라문화제 · STAFF ONLY</div>
  <h1>신 위치 공유</h1>

  <div class="warn">
    <b>이 페이지는 손님용이 아닙니다.</b> "근무 시작"을 누른 동안만, 실제 위치를 약
    <b id="fuzzTxt">25m</b> 오차로 흐려서 참가자 앱에 "가까워요" 힌트로만 보여줍니다.
    정확한 위치·지도 핀은 어디에도 안 뜹니다. "근무 종료"를 누르면 즉시 사라지고,
    행사가 끝나면 전체 초기화합니다.
  </div>

  <div class="card">
    <div style="font-size:13px;font-weight:700;margin-bottom:8px">나는 어떤 신인가요?</div>
    <div class="godgrid" id="godGrid"></div>
  </div>

  <button class="toggle off" id="toggleBtn">근무 시작</button>
  <div class="status" id="statusTxt">꺼져 있음 · 참가자에게 위치가 안 보입니다</div>

  <details class="admin">
    <summary>관리자 — 전체 위치 초기화</summary>
    <input id="pinIn" type="password" inputmode="numeric" placeholder="PIN" maxlength="6">
    <button id="clearBtn">여섯 신 위치 전부 지우기</button>
  </details>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<script src="../live.js"></script>
<script>
(function(){
'use strict';
var C = window.TAMNA, L = window.TamnaLive;
var $ = function(s){return document.querySelector(s)};
var KEY = 'tamna_staff_god';

$('#fuzzTxt').textContent = (C.liveLocation.fuzzMeters||25)+'m';

/* ---- 신 선택 ---- */
var selected = localStorage.getItem(KEY) || (C.crew[0] && C.crew[0].id);
function paintGrid(){
  var g=$('#godGrid');g.innerHTML='';
  C.crew.forEach(function(c){
    var b=document.createElement('button');
    b.className='godbtn'+(c.id===selected?' on':'');
    b.textContent=c.name;
    b.onclick=function(){
      if(watching){toast('근무 중엔 못 바꿔요. 먼저 근무 종료하세요');return}
      selected=c.id;localStorage.setItem(KEY,selected);paintGrid();
    };
    g.appendChild(b);
  });
}
paintGrid();

function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2400)}

/* ---- 위치 전송 ---- */
var watchId=null, watching=false, lastSent=0;
var UPDATE_MS = C.liveLocation.updateMs||8000;

function godName(){var c=C.crew.filter(function(x){return x.id===selected})[0];return c?c.name:selected}

function onPos(pos){
  var now=Date.now();
  if(now-lastSent<UPDATE_MS)return;
  lastSent=now;
  var f=L.fuzz(pos.coords.latitude,pos.coords.longitude,C.liveLocation.fuzzMeters||25);
  L.setLive(selected,f.lat,f.lng,true,{name:godName()}).then(function(ok){
    $('#statusTxt').innerHTML=ok
      ? '🟢 공유 중 · <b>'+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+'</b> 마지막 전송'
      : '⚠️ 전송 실패 — 네트워크를 확인하세요';
  });
}
function onPosErr(err){
  toast('위치 권한이 필요합니다: '+(err&&err.message?err.message:'알 수 없는 오류'));
  stopSharing();
}
function startSharing(){
  if(!navigator.geolocation){toast('이 기기/브라우저는 위치 기능을 지원하지 않습니다');return}
  if(!L.hasDb()){toast('서버 연결 실패 — 오프라인이거나 설정 오류입니다');return}
  watching=true;
  $('#toggleBtn').textContent='근무 종료';
  $('#toggleBtn').className='toggle on';
  $('#statusTxt').textContent='위치 요청 중…';
  watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
function stopSharing(){
  watching=false;
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
  $('#toggleBtn').textContent='근무 시작';
  $('#toggleBtn').className='toggle off';
  $('#statusTxt').textContent='꺼져 있음 · 참가자에게 위치가 안 보입니다';
  L.setLive(selected,null,null,false,{name:godName()});
}
$('#toggleBtn').onclick=function(){ watching?stopSharing():startSharing(); };
window.addEventListener('pagehide',function(){ if(watching)L.setLive(selected,null,null,false); });

/* ---- 관리자: 전체 초기화 ---- */
$('#clearBtn').onclick=function(){
  var pin=$('#pinIn').value.trim();
  if(pin!==String(C.liveLocation.adminPin)){toast('PIN이 맞지 않습니다');return}
  if(watching)stopSharing();
  L.clearAll().then(function(ok){
    toast(ok?'여섯 신 위치를 전부 지웠습니다':'초기화 실패 — 네트워크를 확인하세요');
    $('#pinIn').value='';
  });
};
})();
</script>
</body>
</html>
