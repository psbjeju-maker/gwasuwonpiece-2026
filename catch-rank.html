<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>귤 자르기 랭킹전</title>
<style>
@font-face{font-family:"SCDream";font-weight:500;font-display:swap;src:url('fonts/SCDream5.woff') format('woff')}
@font-face{font-family:"SCDream";font-weight:800;font-display:swap;src:url('fonts/SCDream7.woff') format('woff')}
:root{--bg:#1C130B;--card:#2A1D10;--line:#4A3520;--ink:#FFF4E2;--sub:#C9AE8A;--accent:#FF9A2E;--gold:#FFD84A;--me:#4FC3A1;--bad:#F0605A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1C130B;--card:#2A1D10}}
:root[data-theme="dark"]{--bg:#1C130B;--card:#2A1D10}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"SCDream",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.hero{text-align:center;padding:18px 0 14px}
.hero .ev{font-size:13px;color:var(--sub);letter-spacing:.06em}
.hero h1{font-size:34px;font-weight:800;margin-top:4px;color:var(--accent);text-shadow:0 3px 0 #5a2c00}
.rules{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.rules span{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--sub)}
.rules b{color:var(--ink)}
.namebox{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.namebox label{font-size:13px;color:var(--sub)}
.namebox input{width:100%;margin-top:8px;font:inherit;font-size:20px;font-weight:800;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#140d06;color:var(--ink);outline:none}
.namebox input:focus{border-color:var(--accent)}
.go{width:100%;margin-top:12px;padding:16px;border-radius:14px;background:linear-gradient(180deg,#FFB24A,#F07A12);color:#2b1400;font-size:22px;font-weight:800;box-shadow:0 5px 0 #8a3f00}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3f00}
.mine{margin-top:14px;text-align:center;font-size:15px;color:var(--sub);min-height:22px}
.mine b{color:var(--gold);font-size:20px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}
.sec h2{font-size:18px;font-weight:800}
.live{font-size:12px;color:var(--me)}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--me);margin-right:5px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
ol.rank{list-style:none;display:flex;flex-direction:column;gap:6px}
ol.rank li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:background .4s}
ol.rank li .n{width:30px;text-align:center;font-weight:800;font-size:18px;color:var(--sub)}
ol.rank li:nth-child(1) .n{color:var(--gold)}ol.rank li:nth-child(2) .n{color:#E3E3E3}ol.rank li:nth-child(3) .n{color:#E0A070}
ol.rank li .nm{flex:1;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.rank li .sc{font-weight:800;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
ol.rank li.me{border-color:var(--me);background:#123227}
ol.rank li.me .nm::after{content:" (나)";color:var(--me);font-size:13px}
ol.rank li.flash{animation:flash 1.6s}
@keyframes flash{0%{background:#6b4a10}100%{}}
.empty{text-align:center;color:var(--sub);padding:22px;background:var(--card);border-radius:14px;font-size:14px}
.note{margin-top:14px;font-size:12px;color:var(--sub);text-align:center;line-height:1.6}
.tvbtn{display:block;margin:20px auto 0;background:none;color:var(--sub);font-size:13px;text-decoration:underline}

/* 게임 무대 */
#catchStage{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#catchStage[hidden]{display:none}
#catchBar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#1C130B;color:var(--ink);font-weight:800}
#catchClose{background:var(--card);color:var(--sub);border-radius:10px;padding:6px 12px;font-size:13px}
#catchWrap{flex:1;position:relative}
#catchCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.catch-on{overflow:hidden}

/* 결과 */
#result{position:fixed;inset:0;z-index:60;background:rgba(16,10,4,.94);display:flex;align-items:center;justify-content:center;padding:16px}
#result[hidden]{display:none}
.rcard{width:100%;max-width:420px;background:#FFF8EC;color:#3A2A18;border:5px solid #E5A11C;border-radius:24px;padding:24px 20px;text-align:center}
.rcard .who{font-size:16px;color:#8A6A4A}
.rcard .rk{font-size:64px;font-weight:800;color:#E5701C;line-height:1.1;margin-top:6px}
.rcard .rk small{font-size:24px}
.rcard .of{font-size:15px;color:#8A6A4A}
.rcard .pts{margin-top:14px;font-size:15px;color:#8A6A4A}
.rcard .pts b{display:block;font-size:40px;color:#3A2A18}
.rcard .best{font-size:13px;color:#8A6A4A;margin-top:4px}
.rcard .stat{display:flex;justify-content:center;gap:14px;margin-top:12px;font-size:13px;color:#8A6A4A}
.rcard .stat b{color:#3A2A18}
.rcard .live{display:block;margin-top:10px}
.rcard .btns{display:flex;gap:8px;margin-top:18px}
.rcard .btns button{flex:1;padding:14px;border-radius:12px;font-size:17px;font-weight:800}
.rcard .again{background:linear-gradient(180deg,#FFB24A,#F07A12);color:#2b1400}
.rcard .home{background:#EADBC3;color:#5a3d1e}
.rcard .err{color:var(--bad);font-size:13px;margin-top:8px}

/* TV 랭킹판 */
#board{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 0%,#4a2a0c,#1C130B 70%);display:flex;flex-direction:column;padding:3vh 4vw}
#board[hidden]{display:none}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:20px}
.bhead h1{font-size:clamp(28px,5vw,64px);font-weight:800;color:var(--accent);text-shadow:0 4px 0 #5a2c00}
.bhead .ev{font-size:clamp(13px,1.6vw,20px);color:var(--sub)}
.qrbox{background:#fff;border-radius:14px;padding:8px;text-align:center;color:#3A2A18;font-size:clamp(10px,1.1vw,15px);font-weight:800}
.qrbox img{display:block;width:clamp(90px,11vw,170px);height:auto}
#bList{list-style:none;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;grid-auto-flow:column;grid-template-rows:repeat(5,1fr);gap:1.4vh 2vw;margin-top:2.5vh}
#bList li{display:flex;align-items:center;gap:2vw;background:rgba(42,29,16,.85);border:2px solid var(--line);border-radius:18px;padding:0 2vw;font-size:clamp(18px,3vw,44px);font-weight:800;transition:transform .5s}
#bList li .n{width:2.2em;color:var(--sub)}
#bList li:nth-child(1){border-color:var(--gold);background:rgba(90,60,10,.85)}#bList li:nth-child(1) .n{color:var(--gold)}
#bList li:nth-child(2) .n{color:#E3E3E3}#bList li:nth-child(3) .n{color:#E0A070}
#bList li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bList li .sc{color:var(--accent);font-variant-numeric:tabular-nums}
#bList li.flash{animation:bflash 2.2s}
@keyframes bflash{0%{background:#a06a10;transform:scale(1.04)}100%{}}
#ticker{margin-top:2vh;min-height:1.6em;text-align:center;font-size:clamp(16px,2.4vw,34px);font-weight:800;color:var(--gold)}
#ticker.pop{animation:tpop .6s}
@keyframes tpop{0%{transform:scale(1.3)}100%{transform:scale(1)}}
#bClose{position:absolute;right:10px;bottom:8px;background:none;color:#6b5235;font-size:12px}
@media (max-width:700px){#bList{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}#bList li{min-height:52px;font-size:20px}.qrbox img{width:80px}}
</style>

<div class="wrap" id="home">
  <div class="hero">
    <div class="ev">2026 할로윈 과수원피스</div>
    <h1>귤 자르기 랭킹전</h1>
    <div class="rules">
      <span>30초 동안 <b>슥슥 베기</b></span>
      <span>8초부터 <b>썩은 귤 습격</b> −30점</span>
      <span>콤보 5마다 <b>+1초</b></span>
    </div>
  </div>
  <div class="namebox">
    <label for="nick">랭킹에 뜰 이름 (닉네임)</label>
    <input id="nick" maxlength="10" placeholder="예) 귤선장" autocomplete="off">
    <button class="go" id="startBtn">도전하기</button>
    <div class="mine" id="mine"></div>
  </div>
  <div class="sec"><h2>실시간 TOP 10</h2><span class="live" id="liveTag">실시간</span></div>
  <ol class="rank" id="rankList"><li class="empty">랭킹 불러오는 중…</li></ol>
  <p class="note" id="dbNote">같은 이름은 최고 점수 1개만 순위에 올라가요.</p>
  <button class="tvbtn" id="tvBtn">TV 랭킹판으로 보기</button>
</div>

<div id="catchStage" hidden>
  <div id="catchBar"><span id="catchTitle"></span><button id="catchClose">그만하기</button></div>
  <div id="catchWrap"><canvas id="catchCv"></canvas></div>
</div>

<div id="result" hidden>
  <div class="rcard">
    <div class="who" id="rWho"></div>
    <div class="rk" id="rRank">-</div>
    <div class="of" id="rOf"></div>
    <div class="pts">이번 점수<b id="rScore">0</b></div>
    <div class="best" id="rBest"></div>
    <div class="stat" id="rStat"></div>
    <span class="live">다른 사람이 도전하면 순위가 바로 바뀌어요</span>
    <div class="err" id="rErr"></div>
    <div class="btns"><button class="home" id="rHome">랭킹 보기</button><button class="again" id="rAgain">한 번 더</button></div>
  </div>
</div>

<div id="board" hidden>
  <div class="bhead">
    <div><div class="ev">2026 할로윈 과수원피스 · 실시간 랭킹</div><h1>귤 자르기 랭킹전</h1></div>
    <div class="qrbox"><img src="catch-rank-qr.png" alt="도전 QR" onerror="this.parentNode.style.display='none'">QR 찍고 도전!</div>
  </div>
  <ol id="bList"></ol>
  <div id="ticker"></div>
  <button id="bClose">닫기</button>
</div>

<script>
/* ============================================================
   황금귤 캐치 — 과수원피스 미션용 (2026-09-28 탐라문화제 앱에서 이식)
   ------------------------------------------------------------
   게임 본문은 탐라문화제_앱/황금귤_캐치_게임.js 와 같은 코드다(커밋 7f35dc9 기준).
   규칙·확률·점수는 그대로 두고, 칭호/결과 안내 문구 두 줄만 과수원피스용으로 바꿨다.
   원래 앱이 제공하던 cv/ctx/raf/openStage/stopGame/sfx/beep/S.best 를
   아래 얇은 받침으로 대신 채운다. 쓰는 쪽은 CatchGame.start(onDone) 하나만 부르면 된다.
   onDone(score) 는 30초를 끝까지 하고 결과 카드를 눌렀을 때만 불린다(중간에 닫으면 안 불림).
   ============================================================ */
window.CatchGame = (function () {
  var BEST_KEY = "ggg_catch_best";
  var S = { best: { "catch": 0 } };
  try { S.best["catch"] = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}

  var stage = document.getElementById("catchStage");
  var cv = document.getElementById("catchCv"), ctx = cv.getContext("2d"), raf = null;
  var onDone = null;

  function soundOn() { try { return localStorage.getItem("ggg_sound_on") !== "0"; } catch (e) { return true; } }
  function openStage(title) {
    stage.hidden = false;
    document.body.classList.add("catch-on");
    document.getElementById("catchTitle").textContent = title;
    var w = document.getElementById("catchWrap");
    cv.width = w.clientWidth * 2; cv.height = w.clientHeight * 2;
  }
  function stopGame() {
    if (raf) cancelAnimationFrame(raf); raf = null;
    cv.onpointerdown = null; cv.onpointermove = null; cv.onpointerup = null; cv.onpointercancel = null;
    stage.hidden = true;
    document.body.classList.remove("catch-on");
  }
  function sfx(name, vol) {
    if (!soundOn()) return;
    try { var a = new Audio("sfx/" + name + ".mp3"); a.volume = vol == null ? 0.75 : vol; a.play()["catch"](function () {}); } catch (e) {}
  }
  var _actx = null;
  function beep(freq, dur, type, vol) {
    if (!soundOn()) return;
    try {
      _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = _actx.currentTime, osc = _actx.createOscillator(), g = _actx.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.35), t0 + dur);
      g.gain.setValueAtTime(vol == null ? 0.16 : vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(_actx.destination);
      osc.start(t0); osc.stop(t0 + dur);
    } catch (e) {}
  }

/* --- ① 황금귤 캐치 --- */
/* 이미지 에셋 슬롯 — PNG만 교체하면 자동 적용. 로드 실패/미완료면 도형 폴백으로 그린다. */
var CATCH_DIR='assets/catch-game/';
var CATCH_IMG={};
['orange_small','orange_normal','orange_big','orange_king','orange_gold','orange_legend','orange_rotten',
 'cross_section','juice1','juice2','juice3','juice_rotten','spark_big','spark_small','ring','smoke',
 'deco_wall','deco_fence','deco_rockbush','deco_grass1','deco_grass2','deco_rocks','deco_sign','deco_blossom',
 'cloud1','cloud2','leaf1','leaf2','chest','glow'].forEach(function(n){
  var im=new Image(); im.src=CATCH_DIR+n+'.png'; CATCH_IMG[n]=im;
});
function cimg(n){var im=CATCH_IMG[n];return (im&&im.complete&&im.naturalWidth>0)?im:null}
/* 이미지를 (x,y) 중심에 반지름 r 기준 크기로 그린다 — 원본 비율 유지, 폭 기준 */
function drawImgC(im,x,y,w,rot,alpha){
  var h=w*im.naturalHeight/im.naturalWidth;
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(alpha!=null)ctx.globalAlpha=alpha;
  ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();
}

/* 귤 종류 — 반지름/필요 타격수/점수/낙하속도 배율.
   kind 는 이미지 슬롯 이름과 1:1. 색은 이미지가 없을 때의 폴백. */
var CATCH_KIND={
  small: {r:27, need:1, val:8,   vMul:1.25, img:'orange_small',  c1:'#FFB347',c2:'#E0741B'},
  normal:{r:40, need:1, val:12,  vMul:1,    img:'orange_normal', c1:'#FFA83A',c2:'#D96A14'},
  big:   {r:52, need:2, val:26,  vMul:0.8,  img:'orange_big',    c1:'#FFA83A',c2:'#D96A14'},
  king:  {r:66, need:3, val:46,  vMul:0.6,  img:'orange_king',   c1:'#FF9F2E',c2:'#CF5F10'},
  gold:  {r:44, need:1, val:80,  vMul:0.85, img:'orange_gold',   c1:'#FFE27A',c2:'#E5A11C', gold:true},
  legend:{r:80, need:3, val:100, vMul:0.42, img:'orange_legend', c1:'#FFF0A8',c2:'#E5A11C', gold:true, legend:true},
  rotten:{r:42, need:1, val:-30, vMul:0.95, img:'orange_rotten', c1:'#6B4A2B',c2:'#2E2418', rotten:true}
};
/* 구간(0~8초 / 8~20초 / 20~30초 피버)별 등장 확률표 — 합이 1이 아니어도 됨(가중치) */
var CATCH_TABLE=[
  {normal:0.62, small:0.30, big:0.06, rotten:0.02, gold:0.00, king:0.00},
  {normal:0.30, small:0.18, big:0.12, king:0.08, rotten:0.42, gold:0.05},
  {normal:0.24, small:0.16, big:0.12, king:0.08, rotten:0.40, gold:0.16}
];
function pickCatchKind(phase){
  var t=CATCH_TABLE[phase],sum=0,k;for(k in t)sum+=t[k];
  var r=Math.random()*sum;for(k in t){r-=t[k];if(r<=0)return k}
  return 'normal';
}
function segPointDist(p0,p1,cx,cy){
  var dx=p1.x-p0.x, dy=p1.y-p0.y, len2=dx*dx+dy*dy;
  if(len2===0)return Math.hypot(cx-p0.x,cy-p0.y);
  var t=Math.max(0,Math.min(1,((cx-p0.x)*dx+(cy-p0.y)*dy)/len2));
  return Math.hypot(cx-(p0.x+t*dx), cy-(p0.y+t*dy));
}
/* 점수별 한 줄 칭호 — 결과 카드 재미 요소 */
function catchRank(s){
  if(s>=1400)return '과수원의 황금손';
  if(s>=900)return '황금귤의 달인';
  if(s>=450)return '제주 귤 사냥꾼';
  return '귤밭 견습생';
}

function gCatch(){
  openStage('귤 자르기 랭킹전');
  var W=cv.width,H=cv.height,dur=30000;
  /* 화면 크기 보정 — 375css px 폰(W=750) 기준으로 오브젝트·글자 크기와 낙하 속도를 맞춘다 */
  var U=Math.max(0.8,Math.min(1.7,W/750)),V=Math.max(0.8,Math.min(1.7,H/1334));
  /* ---- 상태 ---- */
  var items=[],pieces=[],fx=[],sprites=[],flashes=[],popups=[],banners=[],trail=[];
  var score=0,combo=0,comboUntil=0,bestCombo=0,cnt={fruit:0,gold:0,rotten:0};
  var elapsed=0,last=null,spawnT=600,hitStop=0,shakeT=0,shakeMag=0,zoom=1;
  var lastPt=null,strokeKills=[],ildoAt=-9999,lastSliceSnd=0,guided=false;
  var rotWave=false,bonusSec=0,fever=false,legendSpawned=false,countdownShown=0,finished=false,endT=0,resultReady=false,resultT=0;
  var flashAlpha=0,flashColor='#FFF';
  var bg=makeBg();
  var clouds=[{x:W*0.2,y:H*0.16,w:W*0.34,s:0.012,im:'cloud1'},{x:W*0.75,y:H*0.09,w:W*0.28,s:0.008,im:'cloud2'}];

  function pt(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}}
  function phase(){return elapsed<8000?0:(fever?2:1)}

  /* ---- 배경: 해 질 무렵 제주 귤밭. 한 번만 오프스크린에 그려두고 매 프레임 복사만 한다 ---- */
  function makeBg(){
    var c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');
    var sky=g.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#F2B76B');sky.addColorStop(0.42,'#F6D7A1');sky.addColorStop(0.62,'#C9C39A');sky.addColorStop(1,'#5D7A4A');
    g.fillStyle=sky;g.fillRect(0,0,W,H);
    /* 해 */
    var sun=g.createRadialGradient(W*0.72,H*0.36,4,W*0.72,H*0.36,W*0.22);
    sun.addColorStop(0,'rgba(255,240,200,.85)');sun.addColorStop(0.25,'rgba(255,200,120,.35)');sun.addColorStop(1,'rgba(255,200,120,0)');
    g.fillStyle=sun;g.fillRect(0,0,W,H);
    /* 한라산 실루엣(멀리, 흐릿) */
    g.fillStyle='rgba(96,104,126,.55)';g.beginPath();g.moveTo(0,H*0.50);

  }

      b.t+=16;var life=b.type==='ildo'?700:(b.type==='rotten'?800:(b.type==='fever'?1400:(b.type==='legendhit'?1600:900)));
      var p=b.t/life,ain=Math.min(1,b.t/90),aout=Math.max(0,Math.min(1,(life-b.t)/220));
      var sc=(b.type==='ildo'?1.6:1.15)-ain*(b.type==='ildo'?0.5:0.15),x=b.x||W/2,y=b.y||((b.type==='gold'||b.type==='rotten'||b.type==='legend')?H*0.26:H*0.36);
      ctx.save();ctx.globalAlpha=Math.min(ain,aout);ctx.translate(x,y);ctx.scale(sc,sc);
      var c={bonus:'#7CFFB0',gold:'#FFD84A',legend:'#FFE9A8',legendhit:'#FFE9A8',rotten:'#D9B38C',fever:'#FFD84A',ildo:'#DFFFF4',timeup:'#FFFFFF',cd:'#FFFFFF'}[b.type]||'#FFF';
      var sz={ildo:64,fever:60,legendhit:52,timeup:70,cd:150}[b.type]||44;
      drawText(b.txt,0,0,sz,c,'rgba(60,20,0,.8)');
      ctx.restore();
      b.dead=b.t>life;
    });
    banners=banners.filter(function(b){return !b.dead});
  }
  function drawTrail(){
    trail=trail.filter(function(p){return elapsed-p.t<130});
    if(trail.length<2)return;
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    for(var pass=0;pass<2;pass++){
      for(var i=1;i<trail.length;i++){
        var a0=trail[i-1],a1=trail[i],age=(elapsed-a1.t)/130,al=Math.max(0,1-age);
        if(pass===0){ctx.strokeStyle='rgba(79,227,190,'+(al*0.38).toFixed(2)+')';ctx.lineWidth=Math.max(3,26*al*U)}
        else{ctx.strokeStyle='rgba(255,255,255,'+(al*0.95).toFixed(2)+')';ctx.lineWidth=Math.max(1.2,9*al*U)}
        ctx.beginPath();ctx.moveTo(a0.x,a0.y);ctx.lineTo(a1.x,a1.y);ctx.stroke();
      }
    }
    ctx.restore();
  }
  function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  /* ---- 결과 카드 ---- */
  function drawResult(){
    var p=Math.min(1,resultT/420),ease=1-Math.pow(1-p,3),isBest=score>(S.best.catch||0);
    ctx.save();ctx.fillStyle='rgba(20,14,8,'+(0.55*ease)+')';ctx.fillRect(0,0,W,H);
    var cw=Math.min(W-80*U,640*U),ch=Math.min(H-160*U,(isBest?846:796)*U),cx=W/2,cy=H/2+(1-ease)*60;
    ctx.globalAlpha=ease;ctx.translate(cx,cy);
    ctx.fillStyle='#FFF8EC';ctx.strokeStyle='#E5A11C';ctx.lineWidth=6*U;
    rrect(-cw/2,-ch/2,cw,ch,28*U);ctx.fill();ctx.stroke();
    var chest=cimg('chest');if(chest)drawImgC(chest,0,-ch/2+10,cw*0.42);
    var y=-ch/2+cw*0.2+40*U;
    drawText('귤 수확 완료!',0,y,38,'#8A4B12');y+=64*U;
    var rows=[['수확한 귤',cnt.fruit+'개'],['황금귤',cnt.gold+'개'],['최고 콤보',bestCombo+' COMBO'],['썩은 귤',cnt.rotten+'개'],['콤보 보너스','+'+bonusSec+'초']];
    ctx.textBaseline='middle';
    rows.forEach(function(r){
      ctx.textAlign='left';ctx.font='600 '+Math.round(24*U)+'px SCDream, sans-serif';ctx.fillStyle='#8A6A4A';ctx.fillText(r[0],-cw/2+44*U,y);
      ctx.textAlign='right';ctx.font='800 '+Math.round(28*U)+'px SCDream, sans-serif';ctx.fillStyle='#3A2A18';ctx.fillText(r[1],cw/2-44*U,y);
      ctx.fillStyle='rgba(138,106,74,.18)';ctx.fillRect(-cw/2+44*U,y+24*U,cw-88*U,2);y+=56*U;
    });
    y+=18*U;drawText('최종 점수',0,y,20,'#8A6A4A',null,600);y+=58*U;
    drawText(score.toLocaleString(),0,y,66,'#E5A11C','rgba(120,60,0,.35)');y+=56*U;
    drawText(catchRank(score),0,y,24,'#3A2A18',null,600);y+=48*U;
    if(isBest){ctx.save();ctx.translate(0,y);ctx.scale(1+Math.sin(resultT/120)*0.04,1+Math.sin(resultT/120)*0.04);drawText('NEW RECORD!',0,0,32,'#F0605A','rgba(255,255,255,.9)');ctx.restore();y+=44*U}
    if(resultReady){ctx.globalAlpha=ease*(0.6+Math.sin(resultT/200)*0.4);drawText('화면을 눌러 계속하기',0,ch/2-40*U,20,'#8A6A4A',null,600)}
    ctx.restore();
  }

  /* ---- 메인 루프 ---- */
  function loop(now){
    if(last==null)last=now;
    var dt=Math.min(50,now-last);last=now;
    var frozen=hitStop>0;if(frozen)hitStop-=dt;
    var step=frozen?0:dt,mul=step/16;
    if(!finished){
      elapsed+=step;
      var left=Math.max(0,dur-elapsed);
      if(left<=0){finished=true;endT=0;banner('TIME UP!','timeup');sfx('bonus',0.6);lastPt=null}
      /* 피버 진입 */
      if(!rotWave&&elapsed>=8000){rotWave=true;banner('썩은 귤 습격!','rotten');shake(8,16);sfx('boom',0.35)}
      if(!fever&&elapsed>=20000&&left<=10000){fever=true;banner('황금귤 피버!','fever');flash('#FFE9A8',0.5);
        beep(660,0.12,'triangle',0.1);setTimeout(function(){beep(880,0.12,'triangle',0.1)},120);setTimeout(function(){beep(1320,0.2,'triangle',0.12)},240)}
      /* 마지막 5초 카운트다운 */
      var secs=Math.ceil(left/1000);
      if(secs<=5&&secs>=1&&secs!==countdownShown&&left>0){countdownShown=secs;banners.push({txt:String(secs),type:'cd',t:0,y:H*0.46});if(secs<=3)beep(secs===1?1100:800,0.12,'square',0.12)}
      spawnT-=step;if(spawnT<=0)doSpawn();
    }else{
      endT+=dt;resultT=Math.max(0,endT-900);
      if(endT>1300)resultReady=true;
      items.forEach(function(it){it.fade=(it.fade==null?1:it.fade)-dt/600});
      items=items.filter(function(it){return it.fade>0});
    }
    /* 물리 */
    items.forEach(function(it){it.y+=it.v*2.4*mul;it.rot+=it.vr*mul;if(it.wob>0)it.wob=Math.max(0,it.wob-0.06*mul)});
    items=items.filter(function(it){return it.y<H+it.r+40});
    pieces.forEach(function(p){p.x+=p.vx*mul;p.y+=p.vy*mul;p.vy+=0.22*mul;p.rot+=p.vr*mul;p.life-=0.016*mul});
    pieces=pieces.filter(function(p){return p.life>0&&p.y<H+120});
    fx.forEach(function(p){p.x+=p.vx*2*mul;p.y+=p.vy*2*mul;p.vy+=0.17*mul;p.l-=p.dec*mul});
    fx=fx.filter(function(p){return p.l>0});
    sprites.forEach(function(s){if(s.vx)s.x+=s.vx*mul;if(s.vy)s.y+=s.vy*mul;if(s.grav)s.vy+=0.12*mul;s.life-=s.dec*mul});
    sprites=sprites.filter(function(s){return s.life>0});
    flashes.forEach(function(f){f.t+=mul});flashes=flashes.filter(function(f){return f.t<18});
    popups.forEach(function(p){p.y+=p.vy*mul;p.life-=0.02*mul});popups=popups.filter(function(p){return p.life>0});
    clouds.forEach(function(c){c.x+=c.s*mul;if(c.x-c.w/2>W)c.x=-c.w/2});
    if(shakeT>0){shakeT-=mul;if(shakeT<=0)shakeMag=0}
    flashAlpha=Math.max(0,flashAlpha-0.06*mul);

    /* ---- 렌더 ---- */
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bg,0,0);
    clouds.forEach(function(c){var im=cimg(c.im);if(im)drawImgC(im,c.x,c.y,c.w,0,0.28)});
    ctx.save();
    if(shakeT>0)ctx.translate((Math.random()-.5)*shakeMag*2,(Math.random()-.5)*shakeMag*2);
    /* 안내 문구 — 첫 슬라이스 전까지만 */
    if(!guided&&!finished&&elapsed>400){ctx.save();ctx.globalAlpha=0.6+Math.sin(elapsed/220)*0.3;drawText('슥— 베어보세요!',W/2,H*0.5,40,'#FFFFFF','rgba(60,20,0,.7)');ctx.restore()}
    pieces.forEach(drawPiece);
    items.forEach(function(it){if(it.fade!=null)ctx.globalAlpha=Math.max(0,it.fade);drawFruit(it);ctx.globalAlpha=1});
    /* 섬광 */
    flashes.forEach(function(f){var p=f.t/18,rad=f.r0+(f.r1-f.r0)*p;var fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,rad);
      fg.addColorStop(0,'rgba('+f.c+','+(0.9*(1-p))+')');fg.addColorStop(1,'rgba('+f.c+',0)');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(f.x,f.y,rad,0,7);ctx.fill()});
    /* 스프라이트 이펙트(과즙 스플래시·스파크·연기) */
    sprites.forEach(function(s){var im=cimg(s.im);if(!im)return;var w=s.w1?s.w+(s.w1-s.w)*(1-s.life):s.w;
      ctx.globalCompositeOperation=s.add?'lighter':'source-over';drawImgC(im,s.x,s.y,w,s.rot||0,Math.max(0,s.life)*(s.add?0.95:0.85))});
    ctx.globalCompositeOperation='source-over';
    fx.forEach(function(p){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,7);ctx.fill()});
    ctx.globalAlpha=1;
    drawTrail();
    popups.forEach(function(p){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));var sc=1+Math.max(0,p.life-0.85)*2.5;ctx.translate(p.x,p.y);ctx.scale(sc,sc);drawText(p.txt,0,0,p.size,p.c,'rgba(60,20,0,.6)');ctx.restore()});
    ctx.restore();
    if(flashAlpha>0){ctx.globalAlpha=flashAlpha;ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
    if(!finished||endT<900)drawHUD(Math.max(0,dur-elapsed));
    drawBanners();
    if(finished&&endT>900)drawResult();
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
}

  /* 원래 앱의 finishCatch 대신 — 최고 기록만 이 폰에 남기고 결과를 넘긴다 */
  function finishCatch(score, st) {
    stopGame();
    var isBest = score > (S.best["catch"] || 0);
    if (isBest) { S.best["catch"] = score; try { localStorage.setItem(BEST_KEY, String(score)); } catch (e) {} }
    sfx(isBest ? "fanfare" : "bonus", 0.7);
    if (onDone) onDone(score, isBest, st || {combo:0,rotten:0,bonus:0});
  }

  document.getElementById("catchClose").addEventListener("click", stopGame);

  return {
    start: function (cb) { onDone = cb || null; gCatch(); },
    close: stopGame
  };
})();

</script>
<script>
/* 랭킹 저장소 — psbjeju-kuji Firestore 의 catchRank 컬렉션. 로그인 없이 읽기·새 기록 추가만 된다(firestore.rules 참고) */
window.RankStore={_c:null,
  init:async function(){
    var SDK='https://www.gstatic.com/firebasejs/10.12.2/';
    function load(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
    if(!window.firebase){await load(SDK+'firebase-app-compat.js');await load(SDK+'firebase-firestore-compat.js')}
    if(!firebase.apps.length)firebase.initializeApp({apiKey:'AIzaSyBqmT2UBPpbSixiyju8CCpONoNnov959Ts',authDomain:'psbjeju-kuji.firebaseapp.com',projectId:'psbjeju-kuji',appId:'1:627012765686:web:41178983d00eb37fd029d7'});
    this._c=firebase.firestore().collection('catchRank');return true},
  listen:function(ok,err){this._c.orderBy('score','desc').limit(500).onSnapshot(ok,err)},
  add:function(d){d.at=firebase.firestore.FieldValue.serverTimestamp();return this._c.add(d)},
  row:function(v){v=v||{};return {name:String(v.name||'').slice(0,10),score:+v.score||0,at:v.at&&v.at.toMillis?v.at.toMillis():Date.now()}}};

</script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var NICK_KEY='ggg_rank_nick';
  var entries=[],db=null,col=null,first=true,lastMine=null,myName='';
  try{myName=localStorage.getItem(NICK_KEY)||''}catch(e){}
  $('nick').value=myName;

  function norm(s){return String(s||'').trim().toLowerCase()}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  /* 같은 이름은 최고 점수 1개만 — 동점이면 먼저 낸 사람이 위 */
  function board(){
    var m={};
    entries.forEach(function(e){var k=norm(e.name);if(!k)return;var b=m[k];
      if(!b||e.score>b.score||(e.score===b.score&&e.at<b.at))m[k]=e});
    return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.score-a.score||a.at-b.at});
  }
  function rankOf(name,list){var k=norm(name);for(var i=0;i<list.length;i++)if(norm(list[i].name)===k)return i+1;return 0}

  function renderHome(list){
    var ol=$('rankList');
    if(!db){ol.innerHTML='<li class="empty">랭킹 서버에 연결하지 못했어요. 게임은 할 수 있어요</li>';return}
    if(!list.length){ol.innerHTML='<li class="empty">아직 기록이 없어요. 첫 번째 도전자가 되어 보세요!</li>';}
    else ol.innerHTML=list.slice(0,10).map(function(e,i){
      return '<li data-k="'+esc(norm(e.name))+'" class="'+(norm(e.name)===norm(myName)?'me':'')+'"><span class="n">'+(i+1)+'</span><span class="nm">'+esc(e.name)+'</span><span class="sc">'+e.score.toLocaleString()+'</span></li>'}).join('');
    var r=myName?rankOf(myName,list):0;
    $('mine').innerHTML=r?esc(myName)+'님 현재 <b>'+r+'위</b> / '+list.length+'명 · 최고 '+list[r-1].score.toLocaleString()+'점':'';
  }
  function renderBoard(list,flashKey){
    var ol=$('bList');
    ol.innerHTML=list.slice(0,10).map(function(e,i){
      return '<li class="'+(norm(e.name)===flashKey?'flash':'')+'"><span class="n">'+(i+1)+'</span><span class="nm">'+esc(e.name)+'</span><span class="sc">'+e.score.toLocaleString()+'</span></li>'}).join('')
      ||'<li style="grid-column:1/-1;justify-content:center;color:var(--sub)">첫 번째 도전자를 기다리는 중…</li>';
  }
  function renderResult(list){
    if(!lastMine)return;
    var r=rankOf(lastMine.name,list),top=list[r-1];
    $('rRank').innerHTML=r?r+'<small>위</small>':'-';
    $('rOf').textContent=r?'전체 '+list.length+'명 중':'';
    $('rBest').textContent=top&&top.score>lastMine.score?'내 최고 기록 '+top.score.toLocaleString()+'점으로 순위 반영 중':(r?'이번 기록이 내 최고 기록!':'');
  }
  function renderAll(flashKey){var list=board();renderHome(list);renderBoard(list,flashKey);renderResult(list)}

  var ticketT=null;
  function ticker(e,list){
    var t=$('ticker');t.textContent='방금 '+e.name+'님 '+e.score.toLocaleString()+'점 → 현재 '+rankOf(e.name,list)+'위!';
    t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');
    clearTimeout(ticketT);ticketT=setTimeout(function(){t.textContent=''},9000);
  }

  (async function(){
    try{db=await RankStore.init()}catch(e){db=null}
    if(!db){$('liveTag').style.display='none';renderAll();return}
    col=RankStore;
    RankStore.listen(function(s){
      var added=[];
      if(!first)s.docChanges().forEach(function(c){if(c.type==='added')added.push(RankStore.row(c.doc.data()))});
      entries=s.docs.map(function(d){return RankStore.row(d.data())});
      first=false;
      var fk=added.length?norm(added[0].name):null;
      renderAll(fk);
      if(added.length){var list=board();ticker(added[0],list)}
    },function(err){$('rankList').innerHTML='<li class="empty">랭킹 연결 오류: '+esc(err&&err.message||'')+'</li>'});
  })();

  function start(){
    var n=$('nick').value.trim().slice(0,10);
    if(!n){$('nick').focus();$('nick').placeholder='이름을 먼저 적어 주세요!';return}
    myName=n;try{localStorage.setItem(NICK_KEY,n)}catch(e){}
    $('result').hidden=true;
    CatchGame.start(async function(score,isBest,st){
      lastMine={name:n,score:score};
      $('rWho').textContent=n+'님의 순위';
      $('rScore').textContent=score.toLocaleString();
      $('rStat').innerHTML='최고 콤보 <b>'+st.combo+'</b> · 썩은 귤 <b>'+st.rotten+'</b> · 보너스 <b>+'+st.bonus+'초</b>';
      $('rRank').innerHTML='…';$('rOf').textContent='';$('rBest').textContent='';$('rErr').textContent='';
      $('result').hidden=false;
      if(!db){$('rErr').textContent='랭킹 서버 연결이 안 돼서 저장하지 못했어요';$('rRank').textContent='-';return}
      try{await RankStore.add({name:n,score:score,combo:st.combo,rotten:st.rotten,bonus:st.bonus});renderResult(board())}
      catch(e){$('rErr').textContent='저장 실패: '+(e&&e.message||e&&e.code||'')}
    });
  }
  $('startBtn').onclick=start;
  $('nick').onkeydown=function(e){if(e.key==='Enter')start()};
  $('rAgain').onclick=start;
  $('rHome').onclick=function(){$('result').hidden=true;renderAll()};
  $('tvBtn').onclick=function(){$('board').hidden=false;try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}};
  $('bClose').onclick=function(){$('board').hidden=true;try{document.exitFullscreen&&document.exitFullscreen()}catch(e){}};
  if(location.hash==='#tv')$('board').hidden=false;
})();
</script>
