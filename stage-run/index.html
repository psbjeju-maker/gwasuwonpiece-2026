<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무대 진행표</title>
<style>
:root{--navy:#0d2547;--cob:#1E5AA8;--or:#F26A21;--cream:#FBF6EC;--ink:#1b2433}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',sans-serif;background:#eef2f8;color:var(--ink);padding-bottom:90px}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:17px}
header p{font-size:12px;opacity:.8;margin-top:3px}
.bar{display:flex;gap:8px;margin-top:8px}
.bar button{flex:1;padding:9px 0;border:0;border-radius:8px;font-size:14px;font-weight:700;background:var(--or);color:#fff}
.bar button.g{background:#2b4a7a}
.list{padding:10px}
.card{background:#fff;border-radius:12px;margin-bottom:10px;border:2px solid transparent;overflow:hidden}
.card.cur{border-color:var(--or);box-shadow:0 4px 14px rgba(242,106,33,.25)}
.card.done{opacity:.55}
.hd{display:flex;gap:10px;padding:12px;align-items:center;cursor:pointer}
.no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--cob);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.cur .no{background:var(--or)}
.tm{font-size:16px;font-weight:800;line-height:1.25}
.sg{font-size:13px;color:#556;margin-top:2px}
.pf{font-size:12px;color:#778;margin-top:1px}
.bd{display:none;padding:0 12px 12px;border-top:1px solid #e3e9f3}
.cur .bd,.open .bd{display:block}
.mc{background:var(--cream);border-radius:8px;padding:10px;font-size:14px;line-height:1.55;margin:10px 0}
.mc b{color:var(--or)}
.note{font-size:13px;line-height:1.5;margin:6px 0;padding:8px 10px;border-radius:8px;background:#fff4e8;border-left:4px solid var(--or)}
.st{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:12px;padding:3px 8px;border-radius:10px;background:#e8eef8;color:var(--cob);font-weight:700}
.tag.w{background:#fde4e4;color:#c22}
.tag.ok{background:#e1f5e6;color:#1d7a3a}
audio,video{width:100%;margin-top:6px;border-radius:8px}
.btn{display:inline-block;margin:6px 6px 0 0;padding:9px 14px;border-radius:8px;border:0;background:var(--cob);color:#fff;font-size:14px;font-weight:700;text-decoration:none}
.btn.o{background:var(--or)}
.ln{width:100%;margin-top:8px;padding:9px;border:1px solid #c9d4e6;border-radius:8px;font-size:13px}
.opening,.closing{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px;line-height:1.6;border-left:5px solid var(--cob)}
.opening h3,.closing h3{font-size:14px;margin-bottom:4px;color:var(--cob)}
.vote{border-left-color:var(--or)}
.vote h3{color:var(--or)}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ccd6e6;padding:8px 12px;font-size:12px;color:#556;display:flex;justify-content:space-between}
</style></head><body>
<header>
<h1>과수원피스 무대 진행표 · 10/31(토) 14:00</h1>
<p id="sub"></p>
<div class="bar"><button class="g" onclick="mv(-1)">◀ 이전 팀</button><button onclick="mv(1)">다음 팀 ▶</button></div>
</header>
<div class="list" id="L"></div>
<footer><span id="ft"></span><span>메모·링크는 이 폰에 자동 저장</span></footer>
<script>
// order: 신청 목록 순서(H 마지막). 순서 바꾸려면 이 배열의 위치만 바꾸면 됨.
var T=[
{n:"솔라미♡스마일",who:"양리엘",song:"HAPPY면 LUCKY",art:"프리파라 1기 한국판",src:"mp3",file:"audio/solami.mp3",url:"https://youtu.be/1XBIu2rDzd8",start:"처음부터 끝까지",notes:[]},
{n:"직접 농사지은 파맛주스",who:"이유리",song:"야채주스, 파돌리기",art:"미쿠 / 테토 (PPPP, Melt ice cream)",src:"mp3",file:"audio/yuri.mp3",url:"https://youtu.be/bC3n4F9sSQk",start:"처음부터 끝까지",notes:["파일 1개(4분45초)에 두 곡(PPPP · Melt ice cream)이 이어져 있음"]},
{n:"가나힛루",who:"조홍진",song:"로미오와 신데렐라",art:"프로세카 / 소녀레이",src:"mp3",file:"audio/hongjin.mp3",start:"처음부터",notes:["카톡 aac 파일을 mp3로 변환해 넣음(4분30초) — 곡이 맞는지는 리허설에서 확인"]},
{n:"저 하늘의 빛나는 별, 가장 빛나는 나!",who:"ㅅ (피치)",song:"Gee (신청서: GGG · 샤이닝스타)",art:"소녀시대",src:"mp3",file:"audio/peach.mp3",start:"처음부터",notes:["신청서 곡과 달라 보임 — 곡명 확인 필요"]},
{n:"미안",who:"최연우",song:"둔갑의 꽃",art:"프로세카 / 아키야마 미즈키 어나더 버전",src:"mp3",file:"audio/yeonwoo.mp3",url:"https://youtu.be/as96JY_guCs",start:"처음부터",video:"audio/yeonwoo_intro.mp4",notes:["노래 전에 18초 영상을 먼저 틀어달라는 요청 (가능 여부 미정)","마지막에 쓰러지는 안무가 있음"]},
{n:"프로젝트 39",who:"한예린",song:"야라라라",art:"ABM feat. 重音テト — 원본 버전(뭐든지모에화 님)",src:"mp3",file:"audio/yerin.mp3",url:"https://youtu.be/T24rF_x0TmQ",start:"처음부터 끝까지",notes:["받은 영상은 2분36초 — 본인은 3~4분이라고 했으니 같은 버전인지 확인 필요"]},
{n:"너 중독된거야",who:"Oh타쿠",song:"꽃이 되어줘 (Be a flower)",art:"녹황색사회 — Instrumental",src:"mp3",file:"audio/otaku.mp3",url:"https://youtu.be/Y_yetj9gB30",start:"풀버전 (처음부터 끝까지)",notes:[]},
{n:"레벨업",who:"김기훈",song:"신의 뜻대로 (神のまにまに)",art:"레루리리 (Rerulili)",src:"mp3",file:"audio/kihun.mp3",at:21,start:"0분 21초부터",notes:["혼자 부름 · 마이크 1개","복장: 일반 유카타로 변경 (원래 보컬로이드 카이토)"]},
{n:"설거지의악마",who:"소상필",song:"私は最強",art:"Ado / 원피스 필름 레드 (우타)",src:"mp3",file:"audio/sangpil.mp3",start:"처음부터",notes:["마이크 1개"]},
{n:"고길동의 하루",who:"최민우",song:"콧치노 켄토",art:"네 기꺼이 (본인 제작 음원)",src:"mp3",file:"audio/minwoo.mp3",start:"처음부터",notes:["곡 중간 연기·관객 소통 구간 있음 (신청서)","리허설·음원 체크 꼭 요청"]},
{n:"H",who:"소라",song:"메스머라이저 · Happy Halloween",art:"2곡 (Happy Halloween: Junky)",src:"mp3",file:"audio/sora.mp3",start:"미확인 (파일 1개, 4분9초)",notes:["받은 파일(IMG_2773.mp3) 1개 — 어느 곡인지, 2곡이 다 들어 있는지 확인 필요","마지막 순서"]}
];
var K="stage-run-v1", S={};
try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
S.cur=S.cur||0; S.ln=S.ln||{};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function mcText(t,i){
  var last=i===T.length-1;
  return (i===0?"첫 번째 무대는 ":last?"마지막 무대입니다! ":"다음 무대는 ")+"<b>"+t.n+"</b> 팀, <b>"+t.who+"</b>님의 "+(t.song.indexOf(" · ")>0?"<b>"+t.song.split(" · ").join("</b>, <b>")+"</b> 두 곡입니다.":"<b>"+t.song+"</b>입니다.")+" 큰 박수로 맞아주세요!";
}
function render(){
  var h='';
  h+='<div class="opening"><h3>오프닝 (14:00)</h3>지금부터 과수원피스 노래·댄스 무대를 시작합니다! 오늘 무대는 총 '+T.length+'팀이에요. 무대마다 휴대폰 투표 화면에서 마음에 드는 팀에 투표해 주세요. (1인 1팀, 투표 취소 후 재투표 가능)</div>';
  T.forEach(function(t,i){
    var cls='card'+(i===S.cur?' cur':'')+(i<S.cur?' done':'');
    var ln=S.ln[i]!==undefined?S.ln[i]:(t.url||'');
    h+='<div class="'+cls+'" id="c'+i+'"><div class="hd" onclick="tg('+i+')"><div class="no">'+(i+1)+'</div><div><div class="tm">'+t.n+'</div><div class="sg">'+t.song+'</div><div class="pf">'+t.who+' · '+t.art+'</div></div></div><div class="bd">';
    h+='<div class="st">'+(t.src==='mp3'?'<span class="tag ok">음원 파일 있음</span>':t.src==='yt'?'<span class="tag ok">유튜브</span>':'<span class="tag w">음원 대기</span>')+(t.start?'<span class="tag">시작: '+t.start+'</span>':'')+'</div>';
    h+='<div class="mc">🎤 '+mcText(t,i)+'</div>';
    t.notes.forEach(function(x){h+='<div class="note">'+x+'</div>'});
    if(t.video)h+='<div class="pf" style="margin-top:8px">① 먼저 틀 영상 (18초) — 끝나면 노래가 바로 이어서 나와요</div><video controls playsinline preload="auto" src="'+t.video+'" data-nx="'+i+'"></video>';
    if(t.src==='mp3'){
      h+=(t.video?'<div class="pf" style="margin-top:8px">② 노래</div>':'')+'<audio controls preload="metadata" id="a'+i+'" src="'+t.file+'"'+(t.at?' data-at="'+t.at+'"':'')+'></audio>';
      if(t.at)h+='<button class="btn o" onclick="goAt('+i+')">'+t.at+'초 위치로 이동 · 재생</button>';
      if(t.url)h+='<a class="btn" target="_blank" rel="noopener" href="'+t.url+'">유튜브 원본(예비)</a>';
    }
    if(t.src==='yt'||t.src==='none'){
      h+='<input class="ln" id="l'+i+'" placeholder="유튜브 링크 붙여넣기" value="'+ln.replace(/"/g,'&quot;')+'" oninput="sl('+i+',this.value)">';
      h+='<a class="btn o" id="y'+i+'" target="_blank" rel="noopener" href="'+(ln||'#')+'" onclick="if(!this.href||this.href.slice(-1)===\'#\'){return false}">유튜브에서 열기</a>';
    }
    h+='</div></div>';
  });
  h+='<div class="opening vote"><h3>투표 안내</h3>모든 무대가 끝났어요! 지금부터 투표 마감 전까지 마음에 드는 팀에 투표해 주세요. (진행자 화면에서 「투표 시작 선언 + 순위 공개」를 누르면 1~3위가 공개돼요.)</div>';
  h+='<div class="closing"><h3>마무리</h3>무대를 보여준 모든 팀에게 큰 박수 부탁드립니다! 이어서 15:00 랜덤 플레이 댄스가 시작돼요.</div>';
  document.getElementById('L').innerHTML=h;
  document.getElementById('sub').textContent='현재 '+(S.cur+1)+'/'+T.length+'번 · '+T[S.cur].n;
  document.getElementById('ft').textContent=T.filter(function(t){return t.src==='none'||(t.src==='yt'&&!t.url&&!S.ln[T.indexOf(t)])}).length+'팀 음원/링크 대기';
}
function stopAll(){document.querySelectorAll('audio,video').forEach(function(a){a.pause()})}
function mv(d){stopAll();S.cur=Math.max(0,Math.min(T.length-1,S.cur+d));save();render();var e=document.getElementById('c'+S.cur);if(e)window.scrollTo(0,e.offsetTop-135)}
function tg(i){var e=document.getElementById('c'+i);e.classList.toggle('open')}
function goAt(i){var a=document.getElementById('a'+i);a.currentTime=+a.dataset.at;a.play()}
function sl(i,v){S.ln[i]=v;save();var y=document.getElementById('y'+i);y.href=v||'#'}
document.addEventListener('play',function(e){document.querySelectorAll('audio,video').forEach(function(a){if(a!==e.target)a.pause()})},true);
document.addEventListener('loadedmetadata',function(e){var a=e.target;if(a.dataset&&a.dataset.at&&a.currentTime<1)a.currentTime=+a.dataset.at},true);
document.addEventListener('ended',function(e){var v=e.target;if(v.dataset&&v.dataset.nx!==undefined){var a=document.getElementById('a'+v.dataset.nx);if(a){a.currentTime=0;a.play()}}},true);
render();
</script></body></html>
