<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>플리 셀러 문자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 한 손으로 위에서 아래로 누르는 명단: 문구 3개 → 사람별 카드 → 보냄 체크 */
:root{--bg:#f6f4f0;--card:#fff;--fg:#1f2428;--mute:#667078;--line:#dedad2;--acc:#0f6b5c;--acc-fg:#fff;--ok:#1d7a46;--okbg:#e1f1e7;--no:#a8412e;--nobg:#f6e3de;--wait:#8a6a12;--waitbg:#f4ead0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191b;--card:#1e2427;--fg:#e9ecee;--mute:#98a3aa;--line:#2f383c;--acc:#3fb59f;--acc-fg:#0b1412;--ok:#6fcf93;--okbg:#1b3326;--no:#ee9a86;--nobg:#3a2420;--wait:#e0c067;--waitbg:#35300f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191b;--card:#1e2427;--fg:#e9ecee;--mute:#98a3aa;--line:#2f383c;--acc:#3fb59f;--acc-fg:#0b1412;--ok:#6fcf93;--okbg:#1b3326;--no:#ee9a86;--nobg:#3a2420;--wait:#e0c067;--waitbg:#35300f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding-block:14px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:21px}
.sub{margin:0;color:var(--mute);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .sp{flex:1}
button,.btn{font:inherit;font-weight:700;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.p,button.p{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
button:disabled{opacity:.5}
button:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1 1 90px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mute)}
details.msgs{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.msgs summary{font-weight:800;cursor:pointer;min-height:32px;display:flex;align-items:center}
label.t{display:block;margin:12px 0 4px;font-size:13px;font-weight:800;color:var(--mute)}
textarea{width:100%;min-height:150px;font:inherit;font-size:14px;line-height:1.5;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);box-sizing:border-box}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-width:0;padding:0 4px;border-radius:99px;font-size:14px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.sent{opacity:.7}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:800;font-size:17px;min-width:0;overflow-wrap:anywhere}
.code{font-size:12px;color:var(--mute);white-space:nowrap}
.meta{font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill.accepted{background:var(--okbg);color:var(--ok)}.pill.rejected{background:var(--nobg);color:var(--no)}.pill.pending{background:var(--waitbg);color:var(--wait)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .btn{flex:1 1 150px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:44px}
.chk input{width:22px;height:22px}
.note{font-size:13px;color:var(--mute);margin:0}
.msg{font-size:13px;color:var(--no);margin:0}
.msg:empty{display:none}
</style>
<body>
<div class="wrap">
  <div>
    <h1>플리마켓 셀러 문자</h1>
    <p class="sub">신청 확인 후 「문자 보내기」를 누르면 문구가 채워진 문자 앱이 열려요. 보내기는 직접 눌러 주세요.</p>
  </div>
  <div class="bar">
    <button id="reload" class="p" type="button">신청 새로고침</button>
    <span class="sp"></span>
    <span class="note" id="asof"></span>
  </div>
  <p class="msg" id="err"></p>
  <div class="stats" id="stats"></div>
  <details class="msgs">
    <summary>문자 문구 고치기</summary>
    <p class="note" style="margin-top:6px">{이름} {셀러명} {일정} 자리에 신청 내용이 들어가요. 고친 문구는 이 기기에 저장돼요.</p>
    <label class="t" for="m_accepted">선정</label><textarea id="m_accepted"></textarea>
    <label class="t" for="m_rejected">미선정</label><textarea id="m_rejected"></textarea>
    <label class="t" for="m_pending">접수 확인 (대기)</label><textarea id="m_pending"></textarea>
  </details>
  <div class="tabs" id="tabs">
    <button data-f="todo" class="on" type="button">보낼 차례</button>
    <button data-f="done" type="button">보냄</button>
    <button data-f="all" type="button">전체</button>
  </div>
  <div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
<script>
var API="https://firestore.googleapis.com/v1/projects/psbjeju-kuji/databases/(default)/documents/gwasuwonpiece_applications?pageSize=300&key=AIzaSyBqmT2UBPpbSixiyju8CCpONoNnov959Ts";
var DATA=[];
var ASOF="";
var DEF={
accepted:"[과수원피스 플리마켓] {이름}님, {셀러명} 셀러 신청이 선정되었어요!\n참여 일정: {일정}\n입점 시간·자리·준비물은 따로 안내드릴게요.\n문의는 이 번호로 답장 주세요.",
rejected:"[과수원피스 플리마켓] {이름}님, 신청해 주셔서 감사합니다.\n이번에는 자리 사정으로 함께하지 못하게 되었어요. 다음 기회에 꼭 모실게요.",
pending:"[과수원피스 플리마켓] {이름}님, {셀러명} 셀러 신청이 접수되었어요.\n확인 후 선정 여부를 문자로 안내드릴게요."};
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var SENT={};try{SENT=JSON.parse(ls('flea.sent')||'{}')||{}}catch(e){}
var filter='todo';
['accepted','rejected','pending'].forEach(function(s){var t=$('m_'+s);t.value=ls('flea.m.'+s)||DEF[s];t.addEventListener('input',function(){ls('flea.m.'+s,t.value);render()})});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function digits(p){return String(p||'').replace(/\D/g,'')}
function fmt(p){var d=digits(p);return d.length===11?d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7):p}
function st(r){return r.status||'pending'}
function key(r){return r.id+'|'+st(r)}
var LAB={accepted:'선정',rejected:'미선정',pending:'대기'};
function body(r){return $('m_'+st(r)).value.replace(/\{이름\}/g,r.name||'').replace(/\{셀러명\}/g,r.teamName||r.name||'').replace(/\{일정\}/g,r.zone||'')}
function render(){
  var n=function(s){return DATA.filter(function(r){return st(r)===s}).length};
  var todo=DATA.filter(function(r){return !SENT[key(r)]}).length;
  $('stats').innerHTML='<div class="stat"><b>'+DATA.length+'</b><span>전체 신청</span></div><div class="stat"><b>'+n('accepted')+'</b><span>선정</span></div><div class="stat"><b>'+n('pending')+'</b><span>대기</span></div><div class="stat"><b>'+n('rejected')+'</b><span>미선정</span></div><div class="stat"><b>'+todo+'</b><span>문자 보낼 차례</span></div>';
  $('asof').textContent=ASOF?ASOF+' 기준':'';
  var rows=DATA.filter(function(r){var s=!!SENT[key(r)];return filter==='all'||(filter==='done'?s:!s)});
  rows.sort(function(a,b){return String(a.createdAt).localeCompare(String(b.createdAt))});
  $('list').innerHTML=rows.length?rows.map(function(r){
    var s=!!SENT[key(r)],d=digits(r.phone);
    return '<div class="card'+(s?' sent':'')+'"><div class="top"><span class="nm">'+esc(r.teamName||r.name)+'</span><span class="code">'+esc(r.code)+'</span></div>'+
    '<div class="meta"><span class="pill '+st(r)+'">'+LAB[st(r)]+'</span> '+esc(r.name)+' · '+esc(fmt(r.phone))+'</div>'+
    '<div class="meta">'+esc(r.zone)+(r.experience?' · 경험 '+esc(r.experience):'')+'</div>'+
    '<details class="note"><summary style="min-height:36px;display:flex;align-items:center">번호·문구 보기 (길게 눌러 선택→복사)</summary><div style="user-select:text;-webkit-user-select:text;white-space:pre-wrap;margin-top:6px;font-size:14px;color:var(--fg)">'+esc(digits(r.phone))+'\n\n'+esc(body(r))+'</div></details>'+
    '<div class="row"><a class="btn p" target="_blank" rel="noopener" data-k="'+esc(key(r))+'" href="sms:'+d+'?&body='+encodeURIComponent(body(r))+'">'+(s?'문자 다시 보내기':'문자 보내기')+'</a>'+
    '<button type="button" data-copy="msg" data-ck="'+esc(key(r))+'">문구 복사</button><button type="button" data-copy="num" data-ck="'+esc(key(r))+'">번호 복사</button></div><div class="row">'+
    '<label class="chk"><input type="checkbox" data-c="'+esc(key(r))+'"'+(s?' checked':'')+'> 보냄</label></div></div>'}).join(''):'<p class="note" style="text-align:center;padding:18px 0">해당하는 신청이 없어요.</p>';
}
function mark(k,on){if(on)SENT[k]=Date.now();else delete SENT[k];ls('flea.sent',JSON.stringify(SENT))}
function copyText(t,btn){var o=btn.textContent;var ok=function(){btn.textContent='복사됨';setTimeout(function(){btn.textContent=o},1200)};var fb=function(){var x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');ok()}catch(e){btn.textContent='복사 실패'}x.remove()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
$('list').addEventListener('click',function(e){var c=e.target.closest('button[data-copy]');if(c){var r=DATA.filter(function(x){return key(x)===c.dataset.ck})[0];if(r){copyText(c.dataset.copy==='num'?digits(r.phone):body(r),c)}return}});
$('list').addEventListener('change',function(e){var c=e.target.dataset.c;if(c){mark(c,e.target.checked);render()}});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-f]');if(!b)return;filter=b.dataset.f;Array.prototype.forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});render()});
function sv(f,k){var o=f[k];return o&&(o.stringValue!==undefined?o.stringValue:o.integerValue)}
$('reload').addEventListener('click',function(){
  var b=this;b.disabled=true;$('err').textContent='';
  fetch(API).then(function(r){return r.json()}).then(function(j){
    if(j.error)throw new Error(j.error.message);
    DATA=(j.documents||[]).map(function(d){var f=d.fields||{};return{id:d.name.split('/').pop(),type:sv(f,'type'),status:sv(f,'status')||'pending',name:sv(f,'name'),phone:sv(f,'phone'),teamName:sv(f,'teamName'),zone:sv(f,'zone'),experience:sv(f,'experience'),code:sv(f,'code'),createdAt:sv(f,'createdAt')||''}}).filter(function(r){return r.type==='flea'});
    var t=new Date();ASOF=(t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
    b.disabled=false;render()
  }).catch(function(e){b.disabled=false;$('err').textContent='새로 불러오지 못했어요. 이 화면은 '+(ASOF||'저장 시점')+' 명단이에요. ('+(e&&e.message||'차단됨')+')'});
});
render();
$('reload').click();
</script>

</body></html>
