<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입금 계좌 · 과수원피스</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff8ea;font-family:Pretendard,system-ui,sans-serif;color:#0d2547}
.c{width:100%;max-width:440px;padding:28px 20px;text-align:center}
.card{background:#fff;border:3px solid #1E5AA8;border-radius:24px;padding:28px 18px}
.s{font-size:15px;color:#1E5AA8;font-weight:700}
.bank{font-size:30px;font-weight:900;margin:10px 0 4px}
.num{font-size:34px;font-weight:900;letter-spacing:.5px;word-break:keep-all}
.own{font-size:17px;color:#555;margin-top:8px}
button{margin-top:22px;width:100%;padding:18px;font-size:22px;font-weight:800;color:#fff;background:#1E5AA8;border:0;border-radius:16px}
.ok{background:#2a8a5c}
.n{margin-top:14px;font-size:14px;color:#666}
</style></head><body><div class="c"><div class="card">
<div class="s">입금 계좌</div><div class="bank">새마을금고</div>
<div class="num" id="n">9002-2064-7278-2</div><div class="own">예금주 메이커앤하비</div>
<button id="b">계좌번호 복사</button></div>
<div class="n">복사 후 은행 앱에 붙여넣기 하세요</div></div>
<script>
var n='9002206472782',b=document.getElementById('b');
b.onclick=function(){function done(){b.textContent='복사됐어요 ✓';b.className='ok'}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(n).then(done,fb)}else fb();
function fb(){var t=document.createElement('textarea');t.value=n;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){b.textContent='번호를 길게 눌러 복사하세요'}document.body.removeChild(t)}}
</script></body></html>
