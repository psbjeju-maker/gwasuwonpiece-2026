<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>랜플댄 신청곡 투표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{font-family:'Paperlogy';src:url(img/Paperlogy-8ExtraBold.ttf) format('truetype');font-weight:800 900;font-display:swap}
/* 디자인 시스템: 전술 UI풍(연회색 패널 + 차콜 바 + 파랑·노랑 포인트 + 각진 모서리). 장식 없이 색과 모양으로만 */
:root{--ch:#262A30;--ch2:#32373F;--bl:#17A0F6;--bl-d:#0C80CF;--yl:#F4C20D;--pn:#F4F5F7;--ink:#1B1F24;--dim:#7A828C;--ln:#D3D8DE;--ok:#18B26B;--red:#E5334A;
  --hh:calc(46px + env(safe-area-inset-top,0px));--tb:46px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:Pretendard,system-ui,sans-serif;background:#DADEE4 repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.35) 7px 8px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}

/* 상단 바 */
header{position:sticky;top:0;z-index:7;height:var(--hh);background:var(--ch);color:#fff;padding:env(safe-area-inset-top,0px) 14px 0;border-bottom:2px solid #11141A}
header .in{max-width:520px;height:46px;margin:0 auto;display:flex;align-items:center;gap:10px}
header img{height:22px}
header .t{font-weight:800;font-size:14px;flex:1;min-width:0;white-space:nowrap}
.res{display:flex;align-items:center;gap:6px;background:#15181D;padding:5px 10px 5px 8px;font-weight:800;font-size:13px;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
.res i{display:block;width:8px;height:8px;background:var(--bl)}
.res.v i{background:var(--yl)}
.res b{font-variant-numeric:tabular-nums}

/* 히어로(스크롤하면 올라가 사라진다) */
.hero{background:var(--ch2) repeating-linear-gradient(135deg,transparent 0 9px,rgba(255,255,255,.03) 9px 10px);color:#fff;padding:18px 16px 34px}
.hero .in{max-width:520px;margin:0 auto}
.eyebrow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:11px;letter-spacing:2px;color:#9FB0C2}
.eyebrow:before{content:'';width:10px;height:10px;background:var(--yl)}
.hero h1{margin:8px 0 0;font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:clamp(36px,11.5vw,54px);line-height:1;letter-spacing:-2.5px}
.hero h1 em{display:block;font-style:normal;color:var(--bl)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chip{background:#1B1F25;color:#DCE3EA;font-weight:700;font-size:12px;padding:6px 11px;border-left:3px solid var(--bl)}
.chip.y{border-left-color:var(--yl)}

/* 탭: 상단에 붙어 따라온다 — 순위/투표를 위아래로 오가지 않고 탭으로 바꾼다 */
.tabsbar{position:sticky;top:var(--hh);z-index:6;display:flex;gap:0;background:var(--ch);height:var(--tb);padding:6px 10px 0;border-bottom:3px solid var(--bl)}
.tabsbar .in{display:flex;gap:6px;width:100%;max-width:520px;margin:0 auto}
.tb{flex:1;font-weight:900;font-size:15px;color:#9FB0C2;background:#3A4049;display:flex;align-items:center;justify-content:center;gap:8px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.tb.on{background:var(--bl);color:#fff}
.tb em{font-style:normal;font-size:12px;font-weight:800;background:rgba(0,0,0,.28);padding:2px 7px;min-width:34px;text-align:center}
.tb.on em{background:rgba(255,255,255,.25)}
.tb .ld{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

.wrap{max-width:520px;margin:0 auto;padding:12px 12px calc(130px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--pn);padding:4px 14px 18px;box-shadow:0 8px 24px -12px rgba(0,0,0,.5);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
h2{display:flex;align-items:center;gap:9px;margin:18px 0 12px;font-weight:900;font-size:17px;letter-spacing:-.3px}
h2:before{content:'';width:10px;height:10px;background:var(--yl);flex:none}
h2 .live{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#fff;background:var(--ok);padding:3px 8px}

/* 순위 */
ol.rank{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
ol.rank li{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--ln);padding:11px 12px 15px;overflow:hidden}
ol.rank .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--bl);z-index:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
ol.rank li>*:not(.bar){position:relative;z-index:1}
ol.rank .n{flex:none;min-width:34px;height:26px;padding:0 6px;background:#4A5360;color:#fff;font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
ol.rank .nm{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.25}
ol.rank .nm small{display:block;font-size:11px;color:var(--dim);font-weight:700;margin-top:2px}
ol.rank .sc{font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
ol.rank .sc:after{content:'표';font-family:Pretendard,sans-serif;font-size:11px;font-weight:700;color:var(--dim);margin-left:2px}
ol.rank li.p1,ol.rank li.p2,ol.rank li.p3{padding:16px 12px 19px}
ol.rank li.p1 .n,ol.rank li.p2 .n,ol.rank li.p3 .n{min-width:44px;height:34px;font-size:20px}
ol.rank li.p1{background:#FFF8DC}
ol.rank li.p1 .n{background:var(--yl);color:#3C2C00}
ol.rank li.p2 .n{background:#8E99A8}
ol.rank li.p3 .n{background:#C98B57}
ol.rank li.p1 .nm{font-size:19px}ol.rank li.p1 .sc{font-size:28px}
ol.rank li.p2 .nm,ol.rank li.p3 .nm{font-size:17px}ol.rank li.p2 .sc,ol.rank li.p3 .sc{font-size:23px}
ol.rank li.top{box-shadow:inset 4px 0 0 var(--yl)}
ol.rank li.top:after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:28%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite;pointer-events:none;z-index:2}
ol.rank li.top:nth-child(3n):after{animation-delay:.9s}
ol.rank li.top:nth-child(3n+1):after{animation-delay:1.8s}
@keyframes sheen{0%{left:-40%}55%,100%{left:130%}}
ol.rank li.cutline{display:flex;align-items:center;gap:10px;background:var(--ch);color:#fff;padding:9px 12px;font-weight:800;font-size:12px;letter-spacing:.5px}
ol.rank li.cutline:before{content:'';width:8px;height:8px;background:var(--yl)}
ol.rank li.cutline:after{display:none}
ol.rank li.out{opacity:.7}
ol.rank li.mine .nm:after{content:'내 투표';font-size:10px;font-weight:800;color:#fff;background:var(--ok);padding:2px 6px;margin-left:6px;vertical-align:middle}
.empty{background:#fff;color:var(--dim);font-weight:700;padding:26px 16px;text-align:center}
@media (prefers-reduced-motion:reduce){ol.rank li.top:after{animation:none;display:none}}

.rv{display:flex;margin:0 0 12px;border:2px solid var(--ink)}
.rv button{flex:1;border:0;background:#fff;color:var(--ink);font:800 14px Pretendard,sans-serif;padding:11px 0;cursor:pointer}
.rv button.on{background:var(--ink);color:#fff}
.gh{display:flex;align-items:center;gap:8px;background:var(--ch);color:#fff;padding:10px 12px;font-weight:800;font-size:15px;margin-top:16px}
.gh:first-child{margin-top:0}
.gh em{font-style:normal;margin-left:auto;background:var(--yl);color:#3C2C00;font-weight:900;font-size:12px;padding:3px 8px}
.gv{list-style:none;margin:0;padding:0}
.gv li{position:relative;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--ln);padding:11px 12px}
.gv li.win{background:#FFF8DC;box-shadow:inset 5px 0 0 var(--yl)}
.gv li.win .nm{font-size:16px}
.gv li.lose{opacity:.6}
.gv .n{flex:none;min-width:28px;height:24px;background:#4A5360;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.gv li.win .n{background:var(--yl);color:#3C2C00}
.gv .nm{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.25}
.gv .tag{flex:none;background:var(--ok);color:#fff;font-weight:800;font-size:11px;padding:3px 7px}
.tn{margin:0 0 10px;font-weight:800;font-size:13px;color:#B85A0B}
.gv .tag.tie{background:#E8761A}
.gv .sc{flex:none;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.gv .sc:after{content:'표';font-size:11px;font-weight:700;color:var(--dim);margin-left:2px}
.gv li.cut{background:var(--ink);color:#fff;font-weight:800;font-size:11px;padding:6px 12px;opacity:1}
.gv li.mine .nm:after{content:'내 투표';font-size:10px;font-weight:800;color:#fff;background:var(--bl);padding:2px 6px;margin-left:6px;vertical-align:middle}
.quota{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.quota span{background:#1B1F25;color:#DCE3EA;font-weight:700;font-size:12px;padding:6px 10px;border-left:3px solid var(--yl)}
.quota b{color:var(--yl);margin-left:5px;font-weight:900}
/* 투표 탭: 5칸 슬롯이 위에 붙어 따라온다 */
.mini{position:sticky;top:calc(var(--hh) + var(--tb) + 3px);z-index:4;background:var(--pn);margin:0 -14px;padding:10px 14px 8px;border-bottom:1px solid var(--ln)}
.mini .tt{display:flex;justify-content:space-between;font-weight:800;font-size:12px;color:var(--dim);margin-bottom:6px}
.mini .tt b{color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.slot{position:relative;height:54px;padding:5px 5px 4px;background:var(--ch);color:#fff;font-weight:800;font-size:10.5px;line-height:1.2;display:flex;align-items:flex-end;word-break:keep-all;overflow:hidden;text-align:left;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.slot:before{content:attr(data-n);position:absolute;right:7px;top:3px;font-family:Paperlogy,Pretendard,sans-serif;font-size:13px;color:var(--yl)}
.slot span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.slot.empty{background:#C9CFD7}
.slot.empty:before{content:'+';right:auto;left:50%;top:50%;transform:translate(-50%,-52%);font-size:22px;color:#fff;font-weight:400}
.slot.rm:active{transform:scale(.95)}
.chips2{display:flex;gap:6px;overflow-x:auto;margin:0 -14px;padding:10px 14px 4px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.fc{flex:none;font-weight:800;font-size:13px;padding:8px 14px;background:#E3E7EC;color:var(--dim);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.fc.on{background:var(--ch);color:#fff}
.series{font-weight:900;font-size:13px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.series:before{content:'';width:6px;height:14px;background:var(--bl)}
.songs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.song{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:6px;width:100%;min-height:68px;text-align:left;padding:10px 36px 8px 12px;background:#fff;border:1px solid var(--ln);font-weight:700;font-size:14px;line-height:1.3;word-break:keep-all;transition:transform .08s}
.song:active{transform:scale(.97)}
.song .cv{font-size:11px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.song .cv:empty{display:none}
.song .box{position:absolute;right:10px;top:10px;width:20px;height:20px;background:#E3E7EC}
.song.on{background:#E7F5FE;border-color:var(--bl);box-shadow:inset 3px 0 0 var(--bl)}
.song.on .box{background:var(--bl)}
.song.on .box:after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.song.off{opacity:.4}
.login{display:block;width:100%;padding:16px;margin-top:14px;font-size:16px;font-weight:900;background:var(--ch);color:#fff;border-bottom:4px solid #0E1013;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.login:active{transform:translateY(2px)}
.note{margin:14px 0 0;padding:12px 14px;background:#FFF4CE;border-left:4px solid var(--yl);font-weight:700;font-size:13px;line-height:1.5}
.note button{display:inline-block;margin-top:8px;padding:8px 14px;background:var(--ch);color:#fff;font-weight:800;font-size:13px}
.done{font-weight:800;font-size:14px;color:var(--ok);margin:14px 0 10px}
.warn{margin:14px 0 0;padding:12px 14px;background:#FFF4CE;border-left:5px solid var(--yl);font-weight:800;font-size:14px;line-height:1.45}
.warn b{background:var(--ch);color:var(--yl);padding:1px 7px;margin:0 2px}
/* 확정 시트: 투표는 1번뿐이라 누르기 전에 한 번 더 묻는다 */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(15,18,22,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{width:100%;max-width:520px;background:var(--pn);padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.sheet h3{margin:0 0 4px;font-weight:900;font-size:21px;letter-spacing:-.5px}
.sheet .sub{margin:0 0 12px;font-weight:800;font-size:14px;color:var(--red)}
.sheet ol{list-style:none;margin:0 0 14px;padding:0;border-top:2px solid var(--ink)}
.sheet li{display:flex;gap:12px;align-items:center;background:#fff;padding:10px 12px;border-bottom:1px solid var(--ln);font-weight:800;font-size:15px}
.sheet li i{font-style:normal;font-family:Paperlogy,Pretendard,sans-serif;color:var(--bl);font-size:17px;width:20px}
.sheet .row{display:flex;gap:10px}
.sheet .row button{flex:1;padding:15px;font-weight:900;font-size:16px}
.sheet .no{background:#D5DAE1;color:var(--ink)}
.sheet .yes{background:var(--bl);color:#fff;border-bottom:4px solid var(--bl-d);flex:1.4!important}

/* 하단 바 */
.bar-fix{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ch);border-top:2px solid #11141A;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-fix .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-fix .cnt{flex:1;font-weight:800;font-size:13px;color:#9FB0C2}
.bar-fix .cnt b{font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:28px;color:var(--yl);margin-right:2px}
.bar-fix .go{background:var(--bl);color:#fff;font-weight:900;font-size:16px;padding:14px 28px;border-bottom:4px solid var(--bl-d);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:transform .08s}
.bar-fix .go:active{transform:translateY(2px)}
.bar-fix .go[disabled]{opacity:.35}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ch);color:#fff;font-weight:800;padding:11px 18px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;border-left:4px solid var(--yl);white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="in"><img src="img/mhlogo.png" alt=""><div class="t">산타왔수다</div><span class="res"><i></i><b id="stV">0</b>명</span><span class="res v"><i></i><b id="stP">0</b>표</span></div></header>
<section class="hero"><div class="in">
  <div class="eyebrow">RANDOM PLAY DANCE</div>
  <h1>랜플댄<em>신청곡 투표</em></h1>
  <div class="chips"><span class="chip y">5곡 · 단 1번</span><span class="chip">12/13(일)</span><span class="chip">장르별 30곡 선곡</span><span class="chip">11/23(월) 마감</span></div>
</div></section>
<nav class="tabsbar"><div class="in"><button class="tb on" data-t="rank" id="tbRank"><span class="ld"></span>순위</button><button class="tb" data-t="vote" id="tbVote">투표<em id="tbN">0/5</em></button></div></nav>
<div class="wrap"><div class="panel">
  <section id="secRank"><h2>실시간 순위<span class="live">LIVE</span></h2><div class="quota" id="quota"></div><div class="rv"><button class="on" data-v="g">장르별 선곡</button><button data-v="a">전체 순위</button></div><div id="gview"></div><ol class="rank" id="rank" style="display:none"><li class="empty">불러오는 중</li></ol></section>
  <section id="secVote" hidden><div id="ballot"></div></section>
</div></div>
<div class="bar-fix" id="bar" hidden><div class="in"><div class="cnt"><b id="cnt">0</b><span id="cntT">/ 5 선택</span></div><button class="go" id="go">투표하기</button></div></div>
<div class="sheet" id="sheet" hidden><div class="box"><h3>이 5곡으로 투표할까요?</h3><p class="sub" id="shSub">한 번 투표하면 수정할 수 없어요</p><ol id="shList"></ol><div class="row"><button class="no" id="shNo">다시 고르기</button><button class="yes" id="shYes">투표 확정</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* 곡 목록 — 신청곡 댓글 집계(2026-11-19). id 는 바꾸지 말 것(투표 기록이 id로 저장됨) */
var SONGS=[
 ['프리파라',[['p01','후와리'],['p02','Make it!'],['p03','프리티 프리즘 파라다이스'],['p04','해피면럭키'],['p05','NO D&D CODE'],['p06','리얼라이즈'],['p14','드림퍼레이드'],['p07','리버시블링'],['p08','프리파라폴리스'],['p09','레디스마일'],['p10','카리스마트걸'],['p11','트라이앵글스타'],['p12','어메이징캐슬'],['p13','슈거리스바이프랜드']]],
 ['아이엠스타',[['i01','오리지널스타'],['i02','아이엠스타'],['i03','패션체크'],['i04','다이아몬드해피'],['i05','해피크레센도'],['i06','렛츠아이엠스타'],['i07','무브온나우'],['i08','마이스타웨이'],['i09','미소짓는선캐쳐']]],
 ['샤이닝스타',[['s01','샤이닝스타'],['s02','섬데이'],['s03','드림드림드림']]],
 ['러브라이브',[['l01','스타트대쉬'],['l02','우리들은 지금 속에서'],['l03','솔져게임'],['l04','G선상의 신데렐라'],['l05','스노우하레이션']]],
 ['우마무스메',[['u01','우마뾰이 전설'],['u02','매니슈키라슈슈']]],
 ['보컬로이드·프로세카',[['v01','신의 뜻대로'],['v02','동화가 된다면 좋을텐데'],['v03','루카루카 나이트 피버'],['v04','테토의 브레인롯'],['v06','드리밍 츄츄'],['v07','히이라기 마그네이트'],['v08','비터 초코 데코레이션'],['v09','천년 살고있어'],['v10','오페라! 스페이스! 오페라!'],['v11','변덕쟁이 메르시'],['v12','세계를 비추는 테트라드'],['v13','데빌이 아닌걸'],['v14','FUN!'],['v15','헬로 세카이'],['v16','처단하겠다AAAAA!'],['v17','빙그레^^조사대의 테마'],['v18','톤데모 원더즈'],['v19','킬러 (More More Jump!)'],['x05','아이돌 신예대 (모어모어점프)'],['x06','뛰어나가! 원더뾰이 (원더랜즈×쇼타임)']]],
 ['J-POP',[['j01','아이돌 (요아소비)'],['j02','코이 (호시노 겐)'],['j03','사랑을 전하고 싶다던가 (아이묭)'],['v05','크림소다의 샹들리에'],['x01','CUTIE SPHERE (동글동글 동글이)'],['x07','나, 아이돌 선언 (허니웍스)'],['x08','B의 리벤지']]],
 ['기타',[['x02','죠죠 갱댄스'],['x03','포켓몬 포케댄스'],['x04','파자마 파티즈']]]
];
/* 마감 2026-11-23 23:59:59 KST. 규칙(firestore.rules)의 마감과 같이 고칠 것 */
var CLOSE_AT=new Date('2026-11-23T23:59:59+09:00');
function isClosed(){return Date.now()>=CLOSE_AT.getTime()}
var MAX=5,TOP=30,ALL={},LIST=[];
/* 장르별 선곡 수(합계 30). 장르 안에서 득표 상위 N곡이 선곡 */
var CAP={'프리파라':4,'아이엠스타':4,'샤이닝스타':2,'러브라이브':2,'우마무스메':1,'보컬로이드·프로세카':10,'J-POP':5,'기타':2};
var CAPN={'보컬로이드·프로세카':'보카로'};
SONGS.forEach(function(g){g[1].forEach(function(s){ALL[s[0]]={id:s[0],name:s[1],series:g[0]};LIST.push(ALL[s[0]])})});

var $=function(i){return document.getElementById(i)};
var db,auth,user=null,counts={},voters=0,myPicks=[],sel=[],saved=false,votes={},filt='전체',tab='rank';
var DEMO=/[?&]demo=/.test(location.search);
var INAPP=/KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER\(inapp|DaumApps|; wv\)/i.test(navigator.userAgent);

function toast(t){var e=$('toast');e.textContent=t;e.className='toast on';setTimeout(function(){e.className='toast'},2200)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* 내가 이미 투표했는지: 집계 스냅샷에서 내 uid 문서를 찾는다. 로그인·스냅샷 어느 쪽이 먼저 와도 맞게 */
function syncMine(){
  if(!user||saved)return;
  var m=votes[user.uid];
  if(m){saved=true;myPicks=m.filter(function(id){return ALL[id]});renderBallot()}
}

/* ── 순위 ── */
function renderRank(){
  var q=$('quota');if(q&&!q.innerHTML)q.innerHTML=Object.keys(CAP).map(function(g){return '<span>'+esc(CAPN[g]||g)+'<b>'+CAP[g]+'</b></span>'}).join('');
  var total=0;for(var k in counts)total+=counts[k];
  $('stV').textContent=voters;$('stP').textContent=total;
  updateCounts();
  var arr=LIST.map(function(s){return{s:s,c:counts[s.id]||0}});
  arr.sort(function(a,b){return b.c-a.c||(a.s.id<b.s.id?-1:1)});
  var max=arr[0]?arr[0].c:0;
  if(!voters){$('rank').innerHTML='<li class="empty">아직 투표가 없어요. 첫 투표를 해 주세요</li>';$('gview').innerHTML='<div class="empty">아직 투표가 없어요. 첫 투표를 해 주세요</div>';return}
  /* 장르별 선곡: 장르마다 상위 N곡에 '선곡' 표시와 컷라인 */
  var gh='',tieIn={},anyTie=false;
  Object.keys(CAP).forEach(function(g){
    var rows=arr.filter(function(r){return r.s.series===g});
    /* 동점 규칙: 컷라인(CAP번째) 득표와 같은 곡은 모두 선곡(그 장르 곡 수가 늘어남) */
    var cut=rows[CAP[g]-1]?rows[CAP[g]-1].c:0, extra=0, rk=0, prev=-1;
    rows.forEach(function(r,j){if(r.c!==prev){rk=j+1;prev=r.c}r.rk=rk;r.win=r.c>0&&r.c>=cut;if(r.win&&j>=CAP[g]){extra++;tieIn[r.s.id]=1}});
    var over=rows.filter(function(r){return r.win}).length>CAP[g];
    rows.forEach(function(r){r.tie=over&&r.win&&r.c===cut&&cut>0});
    anyTie=anyTie||rows.some(function(r){return r.tie});
    gh+='<div class="gh">'+esc(CAPN[g]||g)+'<em>상위 '+CAP[g]+'곡 선곡'+'</em></div><ul class="gv">';
    var cutDone=false;
    rows.forEach(function(r,j){
      var mine=myPicks.indexOf(r.s.id)>=0;
      if(!r.win&&!cutDone&&j>0){cutDone=true;gh+='<li class="cut">여기까지 선곡</li>'}
      gh+='<li class="'+(r.win?'win':'lose')+(mine?' mine':'')+'"><span class="n">'+r.rk+'</span><span class="nm">'+esc(r.s.name)+'</span>'+(r.win?'<span class="tag'+(r.tie?' tie':'')+'">'+(r.tie?'동점':'선곡')+'</span>':'')+'<span class="sc">'+r.c+'</span></li>';
    });
    gh+='</ul>';
  });
  $('gview').innerHTML=(anyTie?'<p class="tn">동점은 마감 때 랜덤으로 선곡해요</p>':'')+gh;
  var h='',gi={};
  arr.forEach(function(r,i){
    var g=r.s.series;gi[g]=(gi[g]||0)+1;
    var w=max?Math.round(r.c/max*100):0, mine=myPicks.indexOf(r.s.id)>=0, inTop=(gi[g]<=(CAP[g]||0)&&r.c>0)||!!tieIn[r.s.id];
    var cls=(i<3&&r.c>0?'p'+(i+1)+' ':'')+(mine?'mine ':'')+(inTop?'top':'out');
    h+='<li class="'+cls+'"><div class="bar" style="width:'+w+'%"></div><span class="n">'+(i+1)+'</span><span class="nm">'+esc(r.s.name)+'<small>'+esc(g)+(inTop?' · 선곡':'')+'</small></span><span class="sc">'+r.c+'</span></li>';
  });
  $('rank').innerHTML=h;
}
/* 투표 탭의 곡 카드에 현재 득표수를 보여준다(순위 탭에 갔다 올 필요 없게) */
function updateCounts(){
  [].forEach.call(document.querySelectorAll('.song'),function(b){
    var c=counts[b.dataset.id]||0,e=b.querySelector('.cv');if(e)e.textContent=voters?c+'표':'';
  });
}

/* ── 투표 탭 ── */
function miniHtml(ids,title,removable){
  var h='<div class="mini"><div class="tt"><span>'+title+'</span></div><div class="slots">';
  for(var i=0;i<MAX;i++){
    if(ids[i])h+='<button class="slot'+(removable?' rm':'')+'" data-n="'+(i+1)+'" data-id="'+ids[i]+'"><span>'+esc(ALL[ids[i]].name)+'</span></button>';
    else h+='<div class="slot empty"></div>';
  }
  return h+'</div></div>';
}
function renderBallot(){
  var el=$('ballot');
  if(isClosed()&&!saved){el.innerHTML='<p class="done">투표가 끝났어요</p>';updateBar();return}
  if(!user){
    var h='<button class="login" id="login">구글로 로그인하고 투표</button>';
    if(INAPP)h='<div class="note">앱 안에서 열면 구글 로그인이 막힐 수 있어요. 크롬이나 사파리로 열어 주세요.<br><button id="copy">링크 복사</button></div>'+h;
    el.innerHTML=h;
    $('login').onclick=login;var c=$('copy');if(c)c.onclick=copyLink;
    updateBar();return;
  }
  if(saved){ /* 한 번 투표하면 확정: 수정 불가, 고른 곡만 보여준다 */
    el.innerHTML='<p class="done">투표 완료 · 수정할 수 없어요</p>'+miniHtml(myPicks,'내가 고른 곡',false).replace('class="mini"','class="mini" style="position:static;border:0;padding-left:0;padding-right:0"');
    updateBar();return;
  }
  var h='<div class="warn">5곡을 골라 <b>단 1번</b>만 투표할 수 있어요. 투표하면 수정할 수 없어요.</div>';
  h+=miniHtml(sel,'내가 고른 곡 <b>'+sel.length+' / '+MAX+'</b>',true);
  h+='<div class="chips2">';
  ['전체'].concat(SONGS.map(function(g){return g[0]})).forEach(function(t){h+='<button class="fc'+(t===filt?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'});
  h+='</div>';
  SONGS.forEach(function(g){
    if(filt!=='전체'&&filt!==g[0])return;
    h+='<div class="series">'+esc(g[0])+'</div><div class="songs">';
    g[1].forEach(function(s){
      var on=sel.indexOf(s[0])>=0, off=!on&&sel.length>=MAX;
      h+='<button class="song'+(on?' on':'')+(off?' off':'')+'" data-id="'+s[0]+'"><span>'+esc(s[1])+'</span><span class="cv"></span><span class="box"></span></button>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
  bindBallot();updateCounts();updateBar();
}
function bindBallot(){
  var el=$('ballot');
  [].forEach.call(el.querySelectorAll('.song'),function(b){b.onclick=function(){pick(b.dataset.id)}});
  [].forEach.call(el.querySelectorAll('.slot.rm'),function(b){b.onclick=function(){pick(b.dataset.id)}});
  [].forEach.call(el.querySelectorAll('.fc'),function(b){b.onclick=function(){filt=b.dataset.t;renderBallot()}});
}
function pick(id){
  var i=sel.indexOf(id);
  if(i>=0)sel.splice(i,1);
  else{if(sel.length>=MAX){toast('5곡까지만 고를 수 있어요');return}sel.push(id)}
  /* 스크롤 위치 유지: 목록은 그대로 두고 상태만 갱신 */
  [].forEach.call(document.querySelectorAll('.song'),function(b){
    var on=sel.indexOf(b.dataset.id)>=0;
    b.className='song'+(on?' on':'')+(!on&&sel.length>=MAX?' off':'');
  });
  var m=document.querySelector('#ballot .mini');
  if(m){var d=document.createElement('div');d.innerHTML=miniHtml(sel,'내가 고른 곡 <b>'+sel.length+' / '+MAX+'</b>',true);m.parentNode.replaceChild(d.firstChild,m);
    [].forEach.call(document.querySelectorAll('.slot.rm'),function(b){b.onclick=function(){pick(b.dataset.id)}})}
  updateBar();
}

/* ── 탭·하단 바 ── */
function setTab(t){
  tab=t;
  $('secRank').hidden=t!=='rank';$('secVote').hidden=t!=='vote';
  $('tbRank').className='tb'+(t==='rank'?' on':'');$('tbVote').className='tb'+(t==='vote'?' on':'');
  if(t==='vote')renderBallot();
  updateBar();
  var top=document.querySelector('.tabsbar').offsetTop-parseFloat(getComputedStyle(document.body).getPropertyValue('--x')||0);
  var hh=document.querySelector('header').offsetHeight;
  if(window.scrollY>top-hh)window.scrollTo(0,Math.max(0,top-hh)); /* 탭 바로 아래로 맞춘다 */
}
function updateBar(){
  $('tbN').textContent=saved?'완료':sel.length+'/'+MAX;
  var bar=$('bar'),g=$('go');
  if(saved||(isClosed()&&!saved)){bar.hidden=true;return}
  if(tab==='vote'){
    if(!user){bar.hidden=true;return}
    bar.hidden=false;$('cnt').textContent=sel.length;$('cntT').textContent='/ 5 선택';
    g.textContent='투표하기';g.disabled=!sel.length;
  }else{
    bar.hidden=false;$('cnt').textContent=sel.length;$('cntT').textContent='/ 5 선택';
    g.textContent='투표하러 가기';g.disabled=false;
  }
}
function copyLink(){
  var u=location.href.split('#')[0];
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(function(){toast('링크를 복사했어요')},function(){toast(u)});
  else toast(u);
}

/* ── 로그인·저장 ── */
function login(){
  var p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(function(e){
    if(e&&e.code==='auth/popup-blocked')auth.signInWithRedirect(p);
    else if(!e||e.code!=='auth/popup-closed-by-user')toast('로그인에 실패했어요');
  });
}
function save(){
  if(!user||!sel.length)return;
  var b=$('go');b.disabled=true;
  var T=firebase.firestore.FieldValue.serverTimestamp();
  var batch=db.batch();
  batch.set(db.collection('santaVotes').doc(user.uid),{picks:sel.slice(),at:T});
  batch.set(db.collection('santaVoters').doc(user.uid),{email:user.email,name:user.displayName||'',at:T});
  batch.commit().then(function(){saved=true;myPicks=sel.slice();toast('투표 완료');renderBallot();renderRank();setTab('rank')})
   .catch(function(e){console.error(e);toast(e&&e.code==='permission-denied'?'이미 투표했거나 저장할 수 없어요':'저장에 실패했어요. 다시 눌러 주세요');b.disabled=false});
}
function openSheet(){
  if(!sel.length)return;
  $('shList').innerHTML=sel.map(function(id,i){return '<li><i>'+(i+1)+'</i>'+esc(ALL[id].name)+'</li>'}).join('');
  $('shSub').textContent=sel.length<MAX?(MAX-sel.length)+'곡 남았어요. 이대로 투표하면 수정할 수 없어요':'한 번 투표하면 수정할 수 없어요';
  $('sheet').hidden=false;
}
$('shNo').onclick=function(){$('sheet').hidden=true};
$('shYes').onclick=function(){$('sheet').hidden=true;save()};
$('sheet').onclick=function(e){if(e.target===this)this.hidden=true};
$('go').onclick=function(){if(tab==='rank'&&!saved){setTab('vote');return}openSheet()};
[].forEach.call(document.querySelectorAll('.tb'),function(b){b.onclick=function(){setTab(b.dataset.t)}});

function start(){
  var SDK='https://www.gstatic.com/firebasejs/10.12.2/';
  function load(u){return new Promise(function(r,j){var s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)})}
  load(SDK+'firebase-app-compat.js').then(function(){return Promise.all([load(SDK+'firebase-auth-compat.js'),load(SDK+'firebase-firestore-compat.js')])}).then(function(){
    firebase.initializeApp({apiKey:'AIzaSyBqmT2UBPpbSixiyju8CCpONoNnov959Ts',authDomain:'psbjeju-kuji.firebaseapp.com',projectId:'psbjeju-kuji',appId:'1:627012765686:web:41178983d00eb37fd029d7'});
    db=firebase.firestore();auth=firebase.auth();
    /* 실시간 집계: 투표 문서가 바뀔 때마다 다시 세서 순위를 위로 올린다 */
    db.collection('santaVotes').onSnapshot(function(snap){
      var c={},n=0;votes={};
      snap.forEach(function(d){
        n++;var p=d.data().picks||[];votes[d.id]=p;
        p.forEach(function(id){if(ALL[id])c[id]=(c[id]||0)+1});
      });
      counts=c;voters=n;
      syncMine();renderRank();
    },function(e){console.error(e);$('rank').innerHTML='<li class="empty">순위를 불러오지 못했어요</li>'});
    auth.onAuthStateChanged(function(u){
      /* 같은 사이트의 다른 페이지가 만든 익명 로그인은 투표 자격이 아니다 — 구글 로그인만 인정 */
      user=(u&&!u.isAnonymous)?u:null;saved=false;myPicks=[];sel=[];
      syncMine();renderBallot();renderRank();
    });
  }).catch(function(e){console.error(e);$('rank').innerHTML='<li class="empty">연결에 실패했어요. 새로고침해 주세요</li>'});
}
[].forEach.call(document.querySelectorAll('.rv button'),function(b){b.onclick=function(){
  [].forEach.call(document.querySelectorAll('.rv button'),function(x){x.classList.toggle('on',x===b)});
  var g=b.dataset.v==='g';$('gview').style.display=g?'':'none';$('rank').style.display=g?'none':'';
}});
if(DEMO){ /* ?demo=1 미리보기: 가짜 집계로 디자인만 확인 (?demo=out 로그아웃, ?demo=done 투표 완료, &tab=vote 투표 탭) */
  var seed=7,rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280};
  LIST.forEach(function(s,i){counts[s.id]=Math.max(0,Math.round(34*Math.exp(-i/14)*(0.55+rnd()*0.9))-(i>45?3:0))});
  voters=37;
  if(!/demo=out/.test(location.search)){user={uid:'demo',displayName:'미리보기',email:''};
    if(/demo=done/.test(location.search)){saved=true;myPicks=['p02','i02','l05','v01','j01']}else sel=['p02','l05']}
  renderBallot();renderRank();
  if(/tab=vote/.test(location.search))setTab('vote');else updateBar();
}else{renderBallot();updateBar();start()}
</script>
