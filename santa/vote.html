<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>랜플댄 신청곡 투표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0F4A2E;--red:#C8102E;--gold:#F2C14E;--dim:#6B7186;--line:#D9DCE6;--ok:#2E9E6A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#FBF6EC;color:var(--navy);font-family:Pretendard,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:0;background:none}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(9px + env(safe-area-inset-top,0px)) 18px 9px}
header .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
header img{height:24px}
header .t{font-weight:800;font-size:15px;flex:1}
header .who{font-size:12px;opacity:.85;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:520px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom,0px))}
.ptitle{font-weight:900;font-size:clamp(34px,11vw,48px);line-height:.95;letter-spacing:-2px;margin:20px 0 4px}
.ptitle em{font-style:normal;color:var(--red)}
.sub{font-weight:700;color:var(--dim);font-size:14px;margin:0 0 4px}
h2{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:900;margin:26px 0 6px}
h2:after{content:'';flex:1;height:2px;background:var(--navy)}
h2 .live{order:2;font-size:12px;color:var(--ok);font-weight:800}
h2 .live:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
ol.rank{list-style:none;margin:0;padding:0}
ol.rank li{position:relative;display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px;overflow:hidden}
ol.rank li .bar{position:absolute;left:0;top:0;bottom:0;background:#F6E7BC;opacity:.65;z-index:0;transition:width .5s}
ol.rank li>*:not(.bar){position:relative;z-index:1}
ol.rank .n{width:28px;font-size:19px;font-weight:900;color:var(--dim);letter-spacing:-1px}
ol.rank li:nth-child(-n+3) .n{color:var(--red)}
ol.rank .nm{flex:1;min-width:0}
ol.rank .nm small{display:block;font-size:12px;color:var(--dim);font-weight:700}
ol.rank .sc{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
/* 30위 안 = 반짝반짝: 금빛 테두리가 숨 쉬듯 빛나고 빛줄기가 지나간다 */
ol.rank li.top{background:#FFF8DD;box-shadow:inset 4px 0 0 var(--gold),0 0 0 0 rgba(242,193,78,.7);animation:glow 1.8s ease-in-out infinite}
ol.rank li.top:before{content:'';position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.95),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite;z-index:2;pointer-events:none}
ol.rank li.top .sc{color:var(--red);text-shadow:0 0 8px rgba(242,193,78,.9)}
@keyframes glow{50%{box-shadow:inset 4px 0 0 var(--gold),0 0 14px 2px rgba(242,193,78,.65)}}
@keyframes shine{0%{left:-80px}55%,100%{left:110%}}
ol.rank li.cut{border-top:2px dashed var(--red)}
@media (prefers-reduced-motion:reduce){ol.rank li.top,ol.rank li.top:before{animation:none}}
ol.rank li.mine .nm:after{content:' ✓';color:var(--ok)}
.more{display:block;width:100%;padding:12px;font-weight:800;color:var(--navy);border:2px solid var(--navy);background:#fff;margin-top:10px}
.empty{color:var(--dim);font-weight:700;padding:14px 2px}
.login{display:block;width:100%;padding:16px;font-size:17px;font-weight:900;background:#fff;color:var(--navy);border:2px solid var(--navy)}
.series{font-weight:900;font-size:14px;margin:20px 0 4px;color:var(--red)}
.song{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.song .box{width:24px;height:24px;flex:none;border:2px solid var(--navy);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:16px}
.song.on .box{background:var(--red);border-color:var(--red)}
.song.on .box:after{content:'✓'}
.song.off{opacity:.4}
.bar-fix{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.bar-fix .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-fix .cnt{font-weight:900;font-size:18px;flex:1}
.bar-fix .cnt b{color:var(--gold);font-size:24px}
.bar-fix .go{background:var(--red);color:#fff;font-weight:900;font-size:17px;padding:13px 22px}
.bar-fix .go[disabled]{opacity:.4}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;font-weight:800;padding:11px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="in"><img src="img/mhlogo.png" alt=""><div class="t">산타왔수다</div><div class="who" id="who"></div></div></header>
<div class="wrap">
  <div class="ptitle">랜플댄<br><em>신청곡 투표</em></div>
  <p class="sub">1인 5곡까지 · 상위 30곡이 랜플댄에 나와요 · 12/10(목)까지</p>

  <h2>실시간 순위<span class="live">LIVE</span></h2>
  <ol class="rank" id="rank"><li class="empty">불러오는 중</li></ol>

  <h2>내 투표</h2>
  <div id="ballot"></div>
</div>
<div class="bar-fix" id="bar" hidden><div class="in"><div class="cnt"><b id="cnt">0</b> / 5</div><button class="go" id="go">투표하기</button></div></div>
<div class="toast" id="toast"></div>

<script>
/* 곡 목록 — 신청곡 댓글 집계(2026-11-19). id 는 바꾸지 말 것(투표 기록이 id로 저장됨) */
var SONGS=[
 ['프리파라',[['p01','후와리'],['p02','Make it!'],['p03','프리티 프리즘 파라다이스'],['p04','해피면럭키'],['p05','NO D&D CODE'],['p06','리얼라이즈 드림퍼레이드'],['p07','리버시블링'],['p08','프리파라폴리스'],['p09','레디스마일'],['p10','카리스마트걸'],['p11','트라이앵글스타'],['p12','어메이징캐슬'],['p13','슈거리스바이프랜드']]],
 ['아이엠스타',[['i01','오리지널스타'],['i02','아이엠스타'],['i03','패션체크'],['i04','다이아몬드해피'],['i05','해피크레센도'],['i06','렛츠아이엠스타'],['i07','무브온나우'],['i08','마이스타웨이'],['i09','미소짓는선캐쳐']]],
 ['샤이닝스타',[['s01','샤이닝스타'],['s02','섬데이'],['s03','드림드림드림']]],
 ['러브라이브',[['l01','스타트대쉬'],['l02','우리들은 지금 속에서'],['l03','솔져게임'],['l04','G선상의 신데렐라'],['l05','스노우하레이션']]],
 ['우마무스메',[['u01','우마뾰이 전설'],['u02','매니슈키라슈슈']]],
 ['보컬로이드·프로세카',[['v01','신의 뜻대로'],['v02','동화가 된다면 좋을텐데'],['v03','루카루카 나이트 피버'],['v04','테토의 브레인롯'],['v05','크림소다의 샹들리에'],['v06','드리밍 츄츄'],['v07','히이라기 마그네이트'],['v08','비터 초코 데코레이션'],['v09','천년 살고있어'],['v10','오페라! 스페이스! 오페라!'],['v11','변덕쟁이 메르시'],['v12','세계를 비추는 테트라드'],['v13','데빌이 아닌걸'],['v14','FUN!'],['v15','헬로 세카이'],['v16','처단하겠다AAAAA!'],['v17','빙그레^^조사대의 테마'],['v18','톤데모 원더즈'],['v19','킬러 (More More Jump!)'],['x06','뛰어나가! 원더뾰이 (원더랜즈×쇼타임)']]],
 ['J-POP',[['j01','아이돌 (요아소비)'],['j02','코이 (호시노 겐)'],['j03','사랑을 전하고 싶다던가 (아이묭)'],['x07','나, 아이돌 선언 (허니웍스)'],['x08','B코마치 리벤지']]],
 ['기타',[['x01','큐티스트릿'],['x02','죠죠 갱댄스'],['x03','포켓몬 포케댄스'],['x04','파자마 파티즈'],['x05','아이돌 신예대 (모어모어점프)']]]
];
/* 마감 2026-12-10 23:59:59 KST. 규칙(firestore.rules)의 마감과 같이 고칠 것 */
var CLOSE_AT=new Date('2026-12-10T23:59:59+09:00');
function isClosed(){return Date.now()>=CLOSE_AT.getTime()}
var MAX=5,TOP=30,ALL={},LIST=[];
SONGS.forEach(function(g){g[1].forEach(function(s){ALL[s[0]]={id:s[0],name:s[1],series:g[0]};LIST.push(ALL[s[0]])})});

var $=function(i){return document.getElementById(i)};
var db,auth,user=null,counts={},voters=0,myPicks=[],sel=[],saved=false,votes={};
/* 내가 이미 투표했는지: 집계 스냅샷(votes)에서 내 uid 문서를 찾는다. 로그인·스냅샷 어느 쪽이 먼저 와도 맞게 */
function syncMine(){
  if(!user||saved)return;
  var m=votes[user.uid];
  if(m){saved=true;myPicks=m.filter(function(id){return ALL[id]});renderBallot()}
}

function toast(t){var e=$('toast');e.textContent=t;e.className='toast on';setTimeout(function(){e.className='toast'},2200)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function renderRank(){
  var arr=LIST.map(function(s){return{s:s,c:counts[s.id]||0}});
  arr.sort(function(a,b){return b.c-a.c||(a.s.id<b.s.id?-1:1)});
  var max=arr[0]?arr[0].c:0, show=arr;
  if(!voters){$('rank').innerHTML='<li class="empty">아직 투표가 없어요. 첫 투표를 해 주세요</li>';return}
  $('rank').innerHTML=show.map(function(r,i){
    var w=max?Math.round(r.c/max*100):0, mine=myPicks.indexOf(r.s.id)>=0;
    var inTop=i<TOP&&r.c>0;
    return '<li class="'+(mine?'mine ':'')+(inTop?'top':'')+(i===TOP?' cut':'')+'"><div class="bar" style="width:'+w+'%"></div><span class="n">'+(i+1)+'</span><span class="nm">'+esc(r.s.name)+'<small>'+esc(r.s.series)+'</small></span><span class="sc">'+r.c+'</span></li>';
  }).join('');
}

function renderBallot(){
  var el=$('ballot');
  if(!user&&isClosed()){$('bar').hidden=true;el.innerHTML='<div class="series">투표가 끝났어요</div>';return}
  if(!user){
    el.innerHTML='<button class="login" id="login">구글로 로그인하고 투표</button>';
    $('login').onclick=login;$('bar').hidden=true;return;
  }
  if(saved){ /* 한 번 투표하면 확정: 수정 불가, 고른 곡만 보여준다 */
    $('bar').hidden=true;
    el.innerHTML='<div class="series">투표 완료 · 수정할 수 없어요</div>'+myPicks.map(function(id){return '<div class="song on"><span class="box"></span><span>'+esc(ALL[id].name)+'</span></div>'}).join('');
    return;
  }
  if(isClosed()){$('bar').hidden=true;el.innerHTML='<div class="series">투표가 끝났어요</div>';return}
  var h='';
  SONGS.forEach(function(g){
    h+='<div class="series">'+esc(g[0])+'</div>';
    g[1].forEach(function(s){
      var on=sel.indexOf(s[0])>=0, off=!on&&sel.length>=MAX;
      h+='<button class="song'+(on?' on':'')+(off?' off':'')+'" data-id="'+s[0]+'"><span class="box"></span><span>'+esc(s[1])+'</span></button>';
    });
  });
  el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('.song'),function(b){b.onclick=function(){pick(b.dataset.id)}});
  $('bar').hidden=false;updateBar();
}
function updateBar(){
  $('cnt').textContent=sel.length;
  var g=$('go');g.disabled=!sel.length;g.textContent='투표하기';
}
function pick(id){
  var i=sel.indexOf(id);
  if(i>=0)sel.splice(i,1);
  else{if(sel.length>=MAX){toast('5곡까지만 고를 수 있어요');return}sel.push(id)}
  var el=document.querySelector('.song[data-id="'+id+'"]');
  renderBallotLight();
}
function renderBallotLight(){ /* 스크롤 위치 유지: 전체를 다시 그리지 않고 상태만 갱신 */
  [].forEach.call(document.querySelectorAll('.song'),function(b){
    var on=sel.indexOf(b.dataset.id)>=0;
    b.className='song'+(on?' on':'')+(!on&&sel.length>=MAX?' off':'');
  });
  updateBar();
}

function login(){
  var p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(function(e){
    if(e&&e.code==='auth/popup-blocked')auth.signInWithRedirect(p);
    else if(!e||e.code!=='auth/popup-closed-by-user')toast('로그인에 실패했어요');
  });
}

function save(){
  if(!user||!sel.length)return;
  var b=$('go');b.disabled=true;
  var T=firebase.firestore.FieldValue.serverTimestamp();
  var batch=db.batch();
  batch.set(db.collection('santaVotes').doc(user.uid),{picks:sel.slice(),at:T});
  batch.set(db.collection('santaVoters').doc(user.uid),{email:user.email,name:user.displayName||'',at:T});
  batch.commit().then(function(){saved=true;myPicks=sel.slice();toast('투표 완료');renderBallot();renderRank()})
   .catch(function(e){console.error(e);toast(e&&e.code==='permission-denied'?'이미 투표했거나 저장할 수 없어요':'저장에 실패했어요. 다시 눌러 주세요');b.disabled=false});
}

function start(){
  var SDK='https://www.gstatic.com/firebasejs/10.12.2/';
  function load(u){return new Promise(function(r,j){var s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)})}
  load(SDK+'firebase-app-compat.js').then(function(){return Promise.all([load(SDK+'firebase-auth-compat.js'),load(SDK+'firebase-firestore-compat.js')])}).then(function(){
    firebase.initializeApp({apiKey:'AIzaSyBqmT2UBPpbSixiyju8CCpONoNnov959Ts',authDomain:'psbjeju-kuji.firebaseapp.com',projectId:'psbjeju-kuji',appId:'1:627012765686:web:41178983d00eb37fd029d7'});
    db=firebase.firestore();auth=firebase.auth();
    /* 실시간 집계: 투표 문서가 바뀔 때마다 다시 세서 순위를 위로 올린다 */
    db.collection('santaVotes').onSnapshot(function(snap){
      var c={},n=0;votes={};
      snap.forEach(function(d){
        n++;var p=d.data().picks||[];votes[d.id]=p;
        p.forEach(function(id){if(ALL[id])c[id]=(c[id]||0)+1});
      });
      counts=c;voters=n;
      syncMine();renderRank();
    },function(e){console.error(e);$('rank').innerHTML='<li class="empty">순위를 불러오지 못했어요</li>'});
    auth.onAuthStateChanged(function(u){
      user=u;saved=false;myPicks=[];sel=[];
      $('who').textContent=u?(u.displayName||u.email):'';
      syncMine();renderBallot();renderRank();
    });
  }).catch(function(e){console.error(e);$('rank').innerHTML='<li class="empty">연결에 실패했어요. 새로고침해 주세요</li>'});
}
$('go').onclick=save;
renderBallot();start();
</script>
</body>
</html>
