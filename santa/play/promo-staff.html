<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>번호 뽑기 스태프</title>
<style>
:root{--g:#0F4A2E;--r:#C8102E;--cream:#FBF6EC}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--g);font-family:Pretendard,system-ui,sans-serif;padding:20px;max-width:480px;margin:0 auto}
h1{font-size:26px;margin:0 0 14px}
input{width:100%;height:56px;border-radius:14px;border:2px solid #cfc8b4;padding:0 14px;font-size:22px;margin:0 0 10px;background:#fff;text-transform:uppercase}
input#pin{text-transform:none}
button{width:100%;height:58px;border-radius:29px;border:0;font-size:22px;font-weight:800;color:#fff;background:var(--g);margin:0 0 10px}
button.r{background:var(--r)}
.box{background:#fff;border-radius:16px;padding:14px;font-size:20px;font-weight:700;margin:6px 0 14px;line-height:1.5;border:2px solid #e3dcc7}
.ok{color:#2E9E6A}.bad{color:var(--r)}
</style>
</head>
<body>
<h1>번호 뽑기 스태프</h1>
<input id="pin" type="password" inputmode="numeric" placeholder="스태프 PIN" autocomplete="off">
<input id="code" placeholder="당첨 코드 6자리" maxlength="6" autocomplete="off">
<button id="bCheck">코드 확인</button>
<button id="bGive" class="r">지급 완료</button>
<div class="box" id="out">코드를 확인해 주세요</div>
<button id="bStats">현황 보기</button>
<script>
var API='https://asia-northeast3-psbjeju-kuji.cloudfunctions.net/';
var $=function(i){return document.getElementById(i);};
try{ $('pin').value=sessionStorage.getItem('promo_pin')||''; }catch(e){}
function api(fn,data){
  return fetch(API+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:data})})
    .then(function(r){return r.json();}).then(function(j){ if(j.error) throw new Error(j.error.message||'오류'); return j.result; });
}
function body(){ try{ sessionStorage.setItem('promo_pin',$('pin').value); }catch(e){} return {pin:$('pin').value,code:$('code').value.trim().toUpperCase()}; }
function say(h){ $('out').innerHTML=h; }
$('bCheck').onclick=function(){ api('promoCheck',body()).then(function(r){ say(r.given?'<span class="bad">이미 받은 코드예요</span><br>'+r.n+'번 · '+r.name:'<span class="ok">처음 쓰는 코드예요</span><br>'+r.n+'번 · '+r.name); }).catch(function(e){ say('<span class="bad">'+e.message+'</span>'); }); };
$('bGive').onclick=function(){ api('promoGive',body()).then(function(r){ say('<span class="ok">지급 처리됐어요</span><br>'+r.n+'번 · '+r.name); }).catch(function(e){ say('<span class="bad">'+e.message+'</span>'); }); };
$('bStats').onclick=function(){ api('promoStats',{pin:$('pin').value}).then(function(r){ say('뽑힌 번호 '+r.picked+' / '+r.total+'<br>남은 번호 '+r.left+'<br>당첨 '+r.wins.filter(function(w){return w.picked;}).length+' / '+r.wins.length+'개 나감'); }).catch(function(e){ say('<span class="bad">'+e.message+'</span>'); }); };
</script>
</body>
</html>
