<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<script>
/* 카톡·인스타·네이버 등 앱 안 브라우저에서 열리면 바로 크롬(안드로이드)·사파리(아이폰)로 옮긴다.
   앱 안 브라우저는 카메라·사진 저장을 막는 경우가 많다. */
(function(){
  var ua=navigator.userAgent||'', u=location.href;
  if(/[?&]noredir=1/.test(u)) return;
  var inapp=/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua);
  if(!inapp) return;
  if(/Android/i.test(ua)){
    location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u+(u.indexOf('?')>-1?'&':'?')+'noredir=1')+';end';
  } else if(/KAKAOTALK/i.test(ua)){
    location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u);
  }
})();
</script>
<title>산타 번호 뽑기</title>
<style>
@font-face{font-family:Paperlogy;src:url(../img/Paperlogy-8ExtraBold.ttf);font-weight:800}
:root{--g:#0F4A2E;--r:#E8384F;--cream:#FFF8EA;--gold:#FFC62E;--navy:#2B2F6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--cream);font-family:Paperlogy,Pretendard,system-ui,sans-serif;font-weight:800;color:var(--navy);overflow:hidden;overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:0}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--cream);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 12% 18%,#FFE1EA 0 38px,transparent 39px),radial-gradient(circle at 90% 30%,#DDF3FF 0 52px,transparent 53px),radial-gradient(circle at 8% 66%,#E4F7DC 0 30px,transparent 31px),radial-gradient(circle at 92% 72%,#FFF0BD 0 26px,transparent 27px),var(--cream)}
.scr.on{display:flex}
.big{width:100%;max-width:360px;height:74px;border-radius:37px;background:var(--r);color:#fff;font-size:30px;font-weight:800;box-shadow:0 6px 0 #a51d33;transition:transform .08s;flex:none}
.big:active{transform:translateY(5px) scale(.98);box-shadow:0 1px 0 #a51d33}
.big.green{background:#22A77A;box-shadow:0 6px 0 #14714f}
.big.blue{background:#3E8BFF;box-shadow:0 6px 0 #2560bd;margin-top:14px;height:62px;font-size:25px}
.small{margin-top:12px;background:none;color:var(--navy);font-size:18px;font-weight:800;opacity:.7;padding:6px 14px;flex:none}
.title{font-size:48px;line-height:1.08;font-weight:800;letter-spacing:-2px;text-align:center;margin:0}
.title em{font-style:normal;color:var(--r)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:0}
.bounce{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-14px) scale(.98,1.02)}}
.bounce svg{width:min(70vw,290px,40vh);height:auto;display:block}
#snd{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:23px;background:#fff;box-shadow:0 3px 0 rgba(43,47,107,.18);z-index:8;display:flex;align-items:center;justify-content:center;padding:0}
#app.playing #snd,#app.nosnd #snd{display:none}
.best{font-size:21px;margin:0 0 14px;min-height:26px}
.best em{font-style:normal;color:var(--r)}
/* 게임 */
#sg{padding:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:0 14px;pointer-events:none}
.sec{width:52px;height:52px;border-radius:26px;background:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none}
.sec.hurry{background:var(--r);color:#fff;animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.bar{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.6);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:9px}
.score{background:#fff;border-radius:26px;height:52px;min-width:104px;padding:0 14px;font-size:30px;display:flex;align-items:center;justify-content:center;flex:none}
.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.22)}}
.hint{position:absolute;left:0;right:0;bottom:31%;text-align:center;color:#fff;font-size:30px;pointer-events:none;text-shadow:0 3px 0 rgba(43,47,107,.45);transition:opacity .3s}
.count{position:absolute;left:0;right:0;top:34%;text-align:center;color:#fff;font-size:120px;line-height:1;pointer-events:none;text-shadow:0 8px 0 rgba(43,47,107,.35)}
/* 점수 + 상자 */
.lbl{font-size:26px;margin:4px 0 0}
.pts{font-size:min(112px,15vh);line-height:1;color:var(--r);margin:0;letter-spacing:-3px}
.pts small{font-size:.34em;letter-spacing:0;color:var(--navy);margin-left:4px}
.stars{display:flex;gap:8px;align-items:flex-end;margin:6px 0 2px;height:70px;flex:none}
.stars i{width:58px;height:58px;display:block}
.stars i:nth-child(2){width:70px;height:70px}
.stars svg{width:100%;height:100%;display:block}
.stars i.on{animation:pop .5s cubic-bezier(.2,1.8,.4,1) both}
.rank{font-size:30px;margin:4px 0 0;min-height:36px}
.new{display:inline-block;background:var(--r);color:#fff;border-radius:18px;padding:4px 16px;font-size:20px;margin-top:4px;visibility:hidden}
.new.on{visibility:visible;animation:pop .5s cubic-bezier(.2,1.8,.4,1) both}
.box{width:min(46vw,200px,23vh);height:min(46vw,200px,23vh);position:relative;animation:shake .6s ease-in-out infinite;cursor:pointer;flex:none}
.box svg{width:100%;height:100%;overflow:visible}
.box.opening{animation:shake .12s linear infinite}
.box .lid{transition:transform .3s cubic-bezier(.2,1.5,.4,1),opacity .3s .15s}
.box.burst .lid{transform:translateY(-110px) rotate(-24deg);opacity:0}
@keyframes shake{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
/* 결과 */
.friend{position:relative;cursor:pointer}
.friend svg{width:min(60vw,250px,31vh);height:auto;display:block}
.friend.hop{animation:hop .5s ease-out}
@keyframes hop{30%{transform:translateY(-22px) scale(.96,1.05)}60%{transform:translateY(0) scale(1.06,.94)}}
.name{font-size:min(46px,6.4vh);letter-spacing:-2px;margin:4px 0 0;color:var(--r);text-align:center}
.meta{font-size:19px;margin:2px 0 0;opacity:.75}
.info{width:100%;max-width:360px;background:var(--g);color:#fff;border-radius:20px;padding:10px 14px;text-align:center;margin:8px 0 12px;flex:none}
.info b{display:block;font-size:25px;letter-spacing:-1px;color:var(--gold)}
.info span{display:block;font-size:17px;margin-top:2px}
.info p{margin:6px 0 0;font-size:17px;border-top:2px dashed rgba(255,255,255,.3);padding-top:6px}
.conf{position:fixed;top:-24px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(720deg)}}
.spark{position:fixed;z-index:10;pointer-events:none;animation:spark .8s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(200deg);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;z-index:11;pointer-events:none;animation:fl .35s ease-out forwards}
@keyframes fl{from{opacity:.85}to{opacity:0}}
/* 사진 */
.cam{position:relative;width:min(100%,420px,calc((100vh - 190px) * .857));aspect-ratio:6/7;border-radius:22px;overflow:hidden;background:#123;flex:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam svg.ov{position:absolute;inset:0;width:100%;height:100%}
.cam .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#DDF3FF}
.cam .ph svg{width:80%}
.shotbox{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.shotbox img{max-height:100%;max-width:100%;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.tip{font-size:22px;margin:10px 0}
/* 홍보용 */
.goal{position:absolute;left:0;right:0;top:calc(72px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;color:#fff;font-size:19px;text-shadow:0 2px 0 rgba(20,20,60,.5)}
.goal b{font-weight:800;opacity:.75}
.goal b.on{color:var(--gold);opacity:1}
.sub{font-size:23px;text-align:center;margin:6px 0 0;line-height:1.4}
.sub em,.msg em{font-style:normal;color:var(--r)}
.msg{font-size:38px;letter-spacing:-1px;text-align:center;margin:4px 0 0;line-height:1.2}
.big:disabled{opacity:.5}
#s2{padding:calc(12px + env(safe-area-inset-top,0px)) 0 0}
#s2 .top{width:100%;text-align:center;padding:0 60px 8px}
#s2 .top b{font-size:31px;letter-spacing:-1px}
#s2 .top b em{font-style:normal;color:var(--r)}
#s2 .top span{display:block;font-size:17px;opacity:.75;margin-top:2px}
.grid{flex:1;min-height:0;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:6px 14px 14px;align-content:start}
.t{height:50px;border-radius:14px;background:#fff;border:2px solid #E4DCC6;font-size:19px;font-weight:800;color:var(--navy);display:flex;align-items:center;justify-content:center;padding:0}
.t.x{background:#ECE6D6;border-color:#ECE6D6;color:#BBB29B;text-decoration:line-through}
.t.sel{background:var(--r);border-color:var(--r);color:#fff;transform:scale(1.1)}
.bot{width:100%;padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px));background:var(--cream);box-shadow:0 -6px 14px rgba(43,47,107,.12);display:flex;justify-content:center}
.waitbox{width:min(56vw,220px);height:min(56vw,220px)}
.code{font-size:50px;letter-spacing:6px;background:#fff;border:4px dashed var(--r);border-radius:18px;padding:6px 18px;margin:6px 0;color:var(--g);-webkit-user-select:auto;user-select:auto;text-align:center}
.slots{display:flex;gap:12px;margin:12px 0}
.slots i{width:60px;height:72px;border-radius:16px;background:#fff;border:3px solid #E4DCC6;font-style:normal;font-size:44px;display:flex;align-items:center;justify-content:center}
.slots i.f{border-color:var(--r);color:var(--r)}
.slots.no{animation:shake .12s linear 4}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:320px;margin-bottom:6px}
.keys button{height:min(62px,9vh);border-radius:18px;background:#fff;box-shadow:0 4px 0 #DDD3B8;font-size:30px;font-weight:800;color:var(--navy)}
.keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #DDD3B8}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:24px;font-size:20px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <button id="snd" aria-label="소리 켜고 끄기"></button>

  <!-- 0 시작 -->
  <section class="scr on" id="s0">
    <h1 class="title" style="margin-top:44px">산타 <em>번호</em><br>뽑기!</h1>
    <div class="mid"><div class="bounce" id="startArt"></div><p class="sub" id="s0sub"></p></div>
    <button class="big" id="bStart">미션 시작!</button>
    <button class="small" id="bMine" style="display:none">내 결과 보기</button>
  </section>

  <!-- 1 게임 -->
  <section class="scr" id="sg">
    <canvas id="cv"></canvas>
    <div class="hud"><div class="sec" id="sec">20</div><div class="bar"><i id="tbar"></i></div><div class="score" id="score">0점</div></div>
    <div class="goal" id="goal"></div>
    <div class="count" id="count"></div>
    <div class="hint" id="hint">선물을 모아요!<br>해골은 −4점!<br>시계는 +2초</div>
  </section>

  <!-- 2 점수 -->
  <section class="scr" id="s1">
    <p class="lbl" style="margin-top:44px">내 점수</p>
    <p class="pts"><span id="pts">0</span><small>점</small></p>
    <div class="mid"><div class="friend" id="mArt"></div><p class="msg" id="mTitle"></p><p class="sub" id="mSub"></p></div>
    <button class="big" id="bMNext"></button>
  </section>

  <!-- 3 번호판 -->
  <section class="scr" id="s2">
    <div class="top"><b>남은 번호 <em id="left">500</em></b><span id="leftSub">번호를 골라요</span></div>
    <div class="grid" id="grid"></div>
    <div class="bot"><button class="big" id="bPick">아무 번호나 뽑기!</button></div>
  </section>

  <!-- 4 두근두근 -->
  <section class="scr" id="s3">
    <div class="mid"><div class="box opening waitbox" id="wait"></div><p class="title" style="margin-top:20px">두근두근…</p></div>
  </section>

  <!-- 5 뽑기 결과 -->
  <section class="scr" id="s4">
    <div class="mid"><div class="friend" id="rArt"></div><p class="sub" id="rNo"></p><p class="msg" id="rTitle"></p><div id="rCode"></div></div>
    <div class="info">
      <b>12월 12일(토)~13일(일)</b>
      <span>중문 컨벤션 제2센터</span>
      <p id="rMsg"></p>
    </div>
    <button class="big" id="bMore">한 번 더 뽑기!</button>
    <button class="big green" id="bGame">게임 한 번 더!</button>
    <button class="big blue" id="bExtra">사진 찍고 한 번 더!</button>
  </section>

  <!-- 6 사진 찍기 -->
  <section class="scr" id="s5">
    <div class="cam" id="cam" style="margin-top:6px"></div>
    <p class="tip" id="camTip">얼굴을 가운데 맞춰요</p>
    <button class="big" id="bShot">찰칵!</button>
  </section>

  <!-- 7 사진 완성 -->
  <section class="scr" id="s6">
    <div class="shotbox"><img id="shotImg" alt=""></div>
    <p class="tip" style="margin:8px 0 10px">이 사진을 보여주고 번호를 받아요!</p>
    <button class="big" id="bToCode">번호 넣기</button>
    <button class="big blue" id="bSave">사진 저장</button>
    <button class="small" id="bRe">다시 찍기</button>
  </section>

  <!-- 8 번호 넣기 -->
  <section class="scr" id="s7">
    <p class="msg" style="margin-top:44px">받은 번호</p>
    <div class="slots" id="slots"><i></i><i></i><i></i><i></i></div>
    <div class="mid"><div class="keys" id="keys"></div></div>
    <button class="small" id="bBackShot">사진 다시 보기</button>
  </section>

</div>
<div class="toast" id="toast"></div>

<script src="chars.js?v=1128b"></script>
<script src="sound.js?v=1128b"></script>
<script src="promo-game.js?v=1128c"></script>
</body>
</html>
