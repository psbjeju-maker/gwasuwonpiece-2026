<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>랜플댄 신청곡 투표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{font-family:'Paperlogy';src:url(img/Paperlogy-8ExtraBold.ttf) format('truetype');font-weight:800 900;font-display:swap}
:root{--red:#C41E2A;--red-d:#8F1620;--cream:#FFF4DC;--paper:#FBF6EC;--gold:#E8B13E;--gold-l:#FFF0C2;--green:#0F4A2E;--ink:#1E2420;--dim:#7A7468;--line:#E6DDC8;--ok:#2E9E6A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:0;background:none;padding:0}
.pl{font-family:Paperlogy,Pretendard,sans-serif;font-weight:800}

/* 상단 바 */
header{position:sticky;top:0;z-index:5;background:var(--red);color:var(--cream);padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px}
header .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
header img{height:24px}
header .t{font-weight:800;font-size:15px;flex:1}
header .who{font-size:12px;opacity:.9;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 히어로 */
.hero{background:var(--red);color:var(--cream);padding:18px 18px 28px}
.hero .in{max-width:520px;margin:0 auto}
.hero h1{margin:0;font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:clamp(50px,17vw,84px);line-height:.98;letter-spacing:-3px}
.hero h1 em{display:block;font-style:normal;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.chip{background:var(--gold);color:var(--red-d);font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px}
.stats{display:flex;gap:0;margin-top:24px;border-top:2px solid rgba(255,244,220,.35)}
.stats div{flex:1;padding-top:14px}
.stats div+div{padding-left:18px;border-left:2px solid rgba(255,244,220,.35)}
.stats b{display:block;font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:42px;line-height:1;letter-spacing:-1px;color:var(--cream)}
.stats span{display:block;font-weight:700;font-size:13px;opacity:.85;margin-top:6px}

.wrap{max-width:520px;margin:0 auto;padding:0 18px calc(120px + env(safe-area-inset-bottom,0px))}
h2{display:flex;align-items:center;gap:10px;margin:34px 0 12px;font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:26px;letter-spacing:-1px}
h2 .live{margin-left:auto;font-family:Pretendard,sans-serif;font-size:12px;font-weight:800;color:var(--ok);letter-spacing:0}
h2 .live:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* 순위 */
ol.rank{list-style:none;margin:0;padding:0}
ol.rank li{position:relative;display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);overflow:hidden;padding:13px 14px}
ol.rank .bar{position:absolute;left:0;top:0;bottom:0;background:var(--gold-l);z-index:0;transition:width .5s}
ol.rank li>*:not(.bar){position:relative;z-index:1}
ol.rank .n{width:34px;font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:22px;color:var(--dim);letter-spacing:-1px;text-align:center}
ol.rank .nm{flex:1;min-width:0;font-weight:800;font-size:17px;line-height:1.25}
ol.rank .nm small{display:block;font-size:12px;color:var(--dim);font-weight:700;margin-top:2px}
ol.rank .sc{font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
/* 1~3위 */
ol.rank li.p1,ol.rank li.p2,ol.rank li.p3{padding:18px 14px;border-bottom:0;margin-bottom:8px}
ol.rank li.p1{background:var(--red);color:var(--cream)}
ol.rank li.p1 .bar{background:rgba(255,244,220,.14)}
ol.rank li.p1 .n,ol.rank li.p1 .nm small{color:var(--gold)}
ol.rank li.p1 .sc{color:var(--gold)}
ol.rank li.p1 .n{font-size:46px}
ol.rank li.p1 .nm{font-size:21px}
ol.rank li.p1 .sc{font-size:32px}
ol.rank li.p2 .n,ol.rank li.p3 .n{font-size:36px;color:var(--red)}
ol.rank li.p2 .nm,ol.rank li.p3 .nm{font-size:19px}
ol.rank li.p2 .sc,ol.rank li.p3 .sc{font-size:26px;color:var(--red)}
/* 4~30위: 선곡권 — 왼쪽 금색 띠가 천천히 숨 쉰다 */
ol.rank li.top{box-shadow:inset 5px 0 0 var(--gold)}
ol.rank li.top:not(.p1):not(.p2):not(.p3):after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#fff;opacity:0;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}
ol.rank li.cutline{display:block;background:none;border:0;padding:22px 0 12px;overflow:visible;font-weight:800;font-size:13px;color:var(--red);letter-spacing:.5px}
ol.rank li.cutline:before{content:'';display:block;height:3px;background:var(--red);margin-bottom:8px}
ol.rank li.out{opacity:.72}
ol.rank li.mine .nm:after{content:'  내 투표';font-size:11px;color:#fff;background:var(--ok);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.empty{background:#fff;color:var(--dim);font-weight:700;padding:22px 16px;text-align:center}
@media (prefers-reduced-motion:reduce){ol.rank li.top:after{animation:none}}

/* 투표 */
.tray{background:#fff;border:2px solid var(--ink);padding:14px;margin-bottom:14px}
.tray .tt{font-weight:800;font-size:13px;color:var(--dim);margin-bottom:10px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-width:0;font-weight:800;font-size:14px;padding:8px 12px;border-radius:999px;background:var(--red);color:var(--cream)}
.slot.empty{background:none;border:2px dashed var(--line);color:var(--line);padding:6px 20px;text-align:left}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 6px;padding:2px 18px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-weight:800;font-size:14px;padding:9px 15px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--dim)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.series{font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.5px;margin:22px 0 8px;color:var(--red)}
.song{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;font-size:17px;line-height:1.25}
.song .box{width:26px;height:26px;flex:none;border:2px solid var(--ink);border-radius:7px;background:#fff;position:relative}
.song.on{background:#FFEFEF}
.song.on .box{background:var(--red);border-color:var(--red)}
.song.on .box:after{content:'';position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(40deg)}
.song.off{opacity:.38}
.login{display:block;width:100%;padding:18px;font-size:18px;font-weight:900;background:var(--ink);color:#fff}
.done{font-weight:800;font-size:15px;color:var(--ok);margin:0 0 10px}
.bar-fix{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.bar-fix .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-fix .cnt{flex:1;font-weight:800;font-size:15px;opacity:.9}
.bar-fix .cnt b{font-family:Paperlogy,Pretendard,sans-serif;font-weight:800;font-size:30px;color:var(--gold);margin-right:2px}
.bar-fix .go{background:var(--red);color:#fff;font-weight:900;font-size:18px;padding:14px 26px;border-radius:999px}
.bar-fix .go[disabled]{opacity:.4}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;font-weight:800;padding:11px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="in"><img src="img/mhlogo.png" alt=""><div class="t">산타왔수다</div><div class="who" id="who"></div></div></header>
<section class="hero"><div class="in">
  <h1>랜플댄<em>신청곡 투표</em></h1>
  <div class="chips"><span class="chip">12/13(일)</span><span class="chip">1인 5곡</span><span class="chip">상위 30곡 선곡</span></div>
  <div class="stats"><div><b id="stV">0</b><span>참여</span></div><div><b id="stP">0</b><span>투표</span></div></div>
</div></section>
<div class="wrap">
  <h2>실시간 순위<span class="live">LIVE</span></h2>
  <ol class="rank" id="rank"><li class="empty">불러오는 중</li></ol>

  <h2>내 투표</h2>
  <div id="ballot"></div>
</div>
<div class="bar-fix" id="bar" hidden><div class="in"><div class="cnt"><b id="cnt">0</b>/ 5</div><button class="go" id="go">투표하기</button></div></div>
<div class="toast" id="toast"></div>

<script>
/* 곡 목록 — 신청곡 댓글 집계(2026-11-19). id 는 바꾸지 말 것(투표 기록이 id로 저장됨) */
var SONGS=[
 ['프리파라',[['p01','후와리'],['p02','Make it!'],['p03','프리티 프리즘 파라다이스'],['p04','해피면럭키'],['p05','NO D&D CODE'],['p06','리얼라이즈 드림퍼레이드'],['p07','리버시블링'],['p08','프리파라폴리스'],['p09','레디스마일'],['p10','카리스마트걸'],['p11','트라이앵글스타'],['p12','어메이징캐슬'],['p13','슈거리스바이프랜드']]],
 ['아이엠스타',[['i01','오리지널스타'],['i02','아이엠스타'],['i03','패션체크'],['i04','다이아몬드해피'],['i05','해피크레센도'],['i06','렛츠아이엠스타'],['i07','무브온나우'],['i08','마이스타웨이'],['i09','미소짓는선캐쳐']]],
 ['샤이닝스타',[['s01','샤이닝스타'],['s02','섬데이'],['s03','드림드림드림']]],
 ['러브라이브',[['l01','스타트대쉬'],['l02','우리들은 지금 속에서'],['l03','솔져게임'],['l04','G선상의 신데렐라'],['l05','스노우하레이션']]],
 ['우마무스메',[['u01','우마뾰이 전설'],['u02','매니슈키라슈슈']]],
 ['보컬로이드·프로세카',[['v01','신의 뜻대로'],['v02','동화가 된다면 좋을텐데'],['v03','루카루카 나이트 피버'],['v04','테토의 브레인롯'],['v05','크림소다의 샹들리에'],['v06','드리밍 츄츄'],['v07','히이라기 마그네이트'],['v08','비터 초코 데코레이션'],['v09','천년 살고있어'],['v10','오페라! 스페이스! 오페라!'],['v11','변덕쟁이 메르시'],['v12','세계를 비추는 테트라드'],['v13','데빌이 아닌걸'],['v14','FUN!'],['v15','헬로 세카이'],['v16','처단하겠다AAAAA!'],['v17','빙그레^^조사대의 테마'],['v18','톤데모 원더즈'],['v19','킬러 (More More Jump!)']]],
 ['J-POP',[['j01','아이돌 (요아소비)'],['j02','코이 (호시노 겐)'],['j03','사랑을 전하고 싶다던가 (아이묭)']]],
 ['기타',[['x01','큐티스트릿'],['x02','죠죠 갱댄스'],['x03','포켓몬 포케댄스'],['x04','파자마 파티즈'],['x05','아이돌 신예대 (모어모어점프)'],['x06','뛰어나가! 원더뾰이'],['x07','나, 아이돌 선언 (허니웍스)'],['x08','B코마치 리벤지']]]
];
var MAX=5,TOP=30,ALL={},LIST=[];
SONGS.forEach(function(g){g[1].forEach(function(s){ALL[s[0]]={id:s[0],name:s[1],series:g[0]};LIST.push(ALL[s[0]])})});

var $=function(i){return document.getElementById(i)};
var db,auth,user=null,counts={},voters=0,myPicks=[],sel=[],saved=false,votes={},tabSel='전체';
var DEMO=/[?&]demo=/.test(location.search);
/* 내가 이미 투표했는지: 집계 스냅샷(votes)에서 내 uid 문서를 찾는다. 로그인·스냅샷 어느 쪽이 먼저 와도 맞게 */
function syncMine(){
  if(!user||saved)return;
  var m=votes[user.uid];
  if(m){saved=true;myPicks=m.filter(function(id){return ALL[id]});renderBallot()}
}

function toast(t){var e=$('toast');e.textContent=t;e.className='toast on';setTimeout(function(){e.className='toast'},2200)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function renderRank(){
  var total=0;for(var k in counts)total+=counts[k];
  $('stV').textContent=voters;$('stP').textContent=total;
  var arr=LIST.map(function(s){return{s:s,c:counts[s.id]||0}});
  arr.sort(function(a,b){return b.c-a.c||(a.s.id<b.s.id?-1:1)});
  var max=arr[0]?arr[0].c:0;
  if(!voters){$('rank').innerHTML='<li class="empty">아직 투표가 없어요. 첫 투표를 해 주세요</li>';return}
  var h='';
  arr.forEach(function(r,i){
    if(i===TOP)h+='<li class="cutline">여기까지 30곡 선곡</li>';
    var w=max?Math.round(r.c/max*100):0, mine=myPicks.indexOf(r.s.id)>=0, inTop=i<TOP&&r.c>0;
    var cls=(i<3&&r.c>0?'p'+(i+1)+' ':'')+(mine?'mine ':'')+(inTop?'top':i>=TOP?'out':'');
    h+='<li class="'+cls+'"><div class="bar" style="width:'+w+'%"></div><span class="n">'+(i+1)+'</span><span class="nm">'+esc(r.s.name)+'<small>'+esc(r.s.series)+'</small></span><span class="sc">'+r.c+'</span></li>';
  });
  $('rank').innerHTML=h;
}

function trayHtml(ids,title){
  var h='<div class="tray"><div class="tt">'+title+'</div><div class="slots">';
  ids.forEach(function(id){h+='<span class="slot">'+esc(ALL[id].name)+'</span>'});
  for(var i=ids.length;i<MAX&&title.indexOf('완료')<0;i++)h+='<span class="slot empty">&nbsp;</span>';
  return h+'</div></div>';
}

function renderBallot(){
  var el=$('ballot');
  if(!user){
    el.innerHTML='<button class="login" id="login">구글로 로그인하고 투표</button>';
    $('login').onclick=login;$('bar').hidden=true;return;
  }
  if(saved){ /* 한 번 투표하면 확정: 수정 불가, 고른 곡만 보여준다 */
    $('bar').hidden=true;
    el.innerHTML='<p class="done">투표 완료 · 수정할 수 없어요</p>'+trayHtml(myPicks,'내가 고른 곡 (투표 완료)');
    return;
  }
  var h=trayHtml(sel,'내가 고른 곡 · '+sel.length+' / '+MAX);
  h+='<div class="tabs" id="tabs">';
  ['전체'].concat(SONGS.map(function(g){return g[0]})).forEach(function(t){h+='<button class="tab'+(t===tabSel?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'});
  h+='</div>';
  SONGS.forEach(function(g){
    if(tabSel!=='전체'&&tabSel!==g[0])return;
    h+='<div class="series">'+esc(g[0])+'</div>';
    g[1].forEach(function(s){
      var on=sel.indexOf(s[0])>=0, off=!on&&sel.length>=MAX;
      h+='<button class="song'+(on?' on':'')+(off?' off':'')+'" data-id="'+s[0]+'"><span class="box"></span><span>'+esc(s[1])+'</span></button>';
    });
  });
  el.innerHTML=h;
  [].forEach.call(el.querySelectorAll('.song'),function(b){b.onclick=function(){pick(b.dataset.id)}});
  [].forEach.call(el.querySelectorAll('.tab'),function(b){b.onclick=function(){tabSel=b.dataset.t;renderBallot()}});
  $('bar').hidden=false;updateBar();
}
function updateBar(){
  $('cnt').textContent=sel.length;
  var g=$('go');g.disabled=!sel.length;g.textContent='투표하기';
}
function pick(id){
  var i=sel.indexOf(id);
  if(i>=0)sel.splice(i,1);
  else{if(sel.length>=MAX){toast('5곡까지만 고를 수 있어요');return}sel.push(id)}
  renderBallotLight();
}
function renderBallotLight(){ /* 스크롤 위치 유지: 목록은 그대로 두고 상태만 갱신 */
  [].forEach.call(document.querySelectorAll('.song'),function(b){
    var on=sel.indexOf(b.dataset.id)>=0;
    b.className='song'+(on?' on':'')+(!on&&sel.length>=MAX?' off':'');
  });
  var t=document.querySelector('.tray');
  if(t){var d=document.createElement('div');d.innerHTML=trayHtml(sel,'내가 고른 곡 · '+sel.length+' / '+MAX);t.parentNode.replaceChild(d.firstChild,t)}
  updateBar();
}

function login(){
  var p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(function(e){
    if(e&&e.code==='auth/popup-blocked')auth.signInWithRedirect(p);
    else if(!e||e.code!=='auth/popup-closed-by-user')toast('로그인에 실패했어요');
  });
}

function save(){
  if(!user||!sel.length)return;
  var b=$('go');b.disabled=true;
  var T=firebase.firestore.FieldValue.serverTimestamp();
  var batch=db.batch();
  batch.set(db.collection('santaVotes').doc(user.uid),{picks:sel.slice(),at:T});
  batch.set(db.collection('santaVoters').doc(user.uid),{email:user.email,name:user.displayName||'',at:T});
  batch.commit().then(function(){saved=true;myPicks=sel.slice();toast('투표 완료');renderBallot();renderRank()})
   .catch(function(e){console.error(e);toast(e&&e.code==='permission-denied'?'이미 투표했거나 저장할 수 없어요':'저장에 실패했어요. 다시 눌러 주세요');b.disabled=false});
}

function start(){
  var SDK='https://www.gstatic.com/firebasejs/10.12.2/';
  function load(u){return new Promise(function(r,j){var s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)})}
  load(SDK+'firebase-app-compat.js').then(function(){return Promise.all([load(SDK+'firebase-auth-compat.js'),load(SDK+'firebase-firestore-compat.js')])}).then(function(){
    firebase.initializeApp({apiKey:'AIzaSyBqmT2UBPpbSixiyju8CCpONoNnov959Ts',authDomain:'psbjeju-kuji.firebaseapp.com',projectId:'psbjeju-kuji',appId:'1:627012765686:web:41178983d00eb37fd029d7'});
    db=firebase.firestore();auth=firebase.auth();
    /* 실시간 집계: 투표 문서가 바뀔 때마다 다시 세서 순위를 위로 올린다 */
    db.collection('santaVotes').onSnapshot(function(snap){
      var c={},n=0;votes={};
      snap.forEach(function(d){
        n++;var p=d.data().picks||[];votes[d.id]=p;
        p.forEach(function(id){if(ALL[id])c[id]=(c[id]||0)+1});
      });
      counts=c;voters=n;
      syncMine();renderRank();
    },function(e){console.error(e);$('rank').innerHTML='<li class="empty">순위를 불러오지 못했어요</li>'});
    auth.onAuthStateChanged(function(u){
      user=u;saved=false;myPicks=[];sel=[];
      $('who').textContent=u?(u.displayName||u.email):'';
      syncMine();renderBallot();renderRank();
    });
  }).catch(function(e){console.error(e);$('rank').innerHTML='<li class="empty">연결에 실패했어요. 새로고침해 주세요</li>'});
}
$('go').onclick=save;
if(DEMO){ /* ?demo=1 미리보기: 가짜 집계로 디자인만 확인 (?demo=out 은 로그아웃 상태, ?demo=done 은 투표 완료 상태) */
  var seed=7,rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280};
  LIST.forEach(function(s,i){counts[s.id]=Math.max(0,Math.round(34*Math.exp(-i/14)*(0.55+rnd()*0.9))-(i>45?3:0))});
  voters=37;
  if(!/demo=out/.test(location.search)){user={uid:'demo',displayName:'미리보기',email:''};$('who').textContent='미리보기';
    if(/demo=done/.test(location.search)){saved=true;myPicks=['p02','i02','l05','v01','j01']}else sel=['p02','l05']}
  renderBallot();renderRank();
}else{renderBallot();start()}
</script>
