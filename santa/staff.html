<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>보물찾기 스태프</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0F4A2E;--org:#C8102E;--dim:#6B7186;--line:#D9DCE6;--ok:#2E9E6A}
*{box-sizing:border-box}
html,body{margin:0;background:#FBF6EC;color:var(--navy);font-family:Pretendard,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-weight:900;font-size:18px}
main{max-width:520px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:0;margin-bottom:14px}
.tabs button{flex:1;border:2px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-weight:900;font-size:17px;padding:13px}
.tabs button.on{background:var(--navy);color:#fff}
input{width:100%;font:inherit;font-size:22px;font-weight:800;letter-spacing:3px;padding:14px;border:2px solid var(--navy);border-radius:0;background:#fff;color:var(--navy);text-transform:uppercase}
input:focus{outline:none;border-color:var(--org)}
.btn{display:block;width:100%;border:0;padding:16px;margin-top:10px;font:inherit;font-size:19px;font-weight:900;background:var(--org);color:#fff}
.panel{background:#fff;border:2px solid var(--navy);padding:16px;margin-top:14px}
.big{font-size:26px;font-weight:900;margin:4px 0 8px}
.tag{display:inline-block;padding:3px 10px;font-weight:900;color:#fff;background:var(--ok)}
.tag.no{background:var(--org)}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:700}
.row:last-child{border-bottom:0}
.row b{font-weight:900}
.dim{color:var(--dim);font-size:14px;font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<header>보물찾기 스태프</header>
<main>
  <section id="login">
    <input id="pin" type="password" inputmode="numeric" placeholder="스태프 PIN" autocomplete="off">
    <button class="btn" id="go">들어가기</button>
  </section>
  <section id="app" class="hide">
    <div class="tabs"><button data-t="chk" class="on">상품 주기</button><button data-t="st">오늘</button></div>
    <div id="chk">
      <input id="code" maxlength="6" placeholder="상품 코드 6자리" autocomplete="off">
      <button class="btn" id="look">찾기</button>
      <div id="res"></div>
    </div>
    <div id="st" class="hide"><div id="stats"></div><p class="dim" id="upd"></p></div>
  </section>
</main>
<script>
var API='https://asia-northeast3-psbjeju-kuji.cloudfunctions.net/';
var PIN='', $=function(i){ return document.getElementById(i); }, timer=null;
var KIND={pass:'체험',click:'딸깍',adv:'모험'};
function api(fn,data){
  return fetch(API+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:data})})
    .then(function(r){ return r.json(); }, function(){ throw new Error('인터넷 연결을 확인해 주세요'); })
    .then(function(j){ if (j.error) throw new Error(j.error.message||'다시 해 주세요'); return j.result; });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function won(n){ return (n||0).toLocaleString('ko-KR')+'원'; }
function stats(){
  return api('santaStats',{pin:PIN}).then(function(v){
    var h='<div class="panel"><div class="dim">'+esc(v.day)+' 매출</div><div class="big">'+won(v.won)+'</div>';
    ['pass','click','adv'].forEach(function(k){ h+='<div class="row"><span>'+KIND[k]+'</span><b>'+(v.sales[k]||0)+'건</b></div>'; });
    h+='</div><div class="panel"><div class="dim">상위 상품 (나온 수 / 하루 한도)</div>';
    Object.keys(v.limits).forEach(function(k){ h+='<div class="row"><span>'+esc((v.names||{})[k]||k)+'</span><b>'+(v.stock[k]||0)+' / '+v.limits[k]+'</b></div>'; });
    $('stats').innerHTML=h+'</div>';
    $('upd').textContent=new Date().toLocaleTimeString('ko-KR')+'';
  });
}
$('go').onclick=function(){
  PIN=$('pin').value.trim(); if (!PIN) return;
  $('go').textContent='확인 중…';
  stats().then(function(){ $('login').classList.add('hide'); $('app').classList.remove('hide'); $('code').focus(); },
    function(e){ $('go').textContent='들어가기'; alertBox(e.message); });
};
function alertBox(m){ var p=document.createElement('p'); p.className='dim'; p.style.color='#C8102E'; p.textContent=m; var l=$('login'); if (l.lastChild.tagName==='P') l.removeChild(l.lastChild); l.appendChild(p); }
$('look').onclick=function(){
  var c=$('code').value.trim().toUpperCase(); if (c.length<6) return;
  $('res').innerHTML='<div class="panel dim">확인 중…</div>';
  api('santaCheck',{code:c, pin:PIN}).then(show, fail);
};
function show(v){
  $('res').innerHTML='<div class="panel"><div class="dim">'+esc(v.nick)+' · '+esc(v.day)+'</div><div class="big">'+esc(v.name)+'</div>'+
    (v.given?'<span class="tag">받음</span>':'<button class="btn" id="give">지급</button>')+'</div>';
  if (!v.given) $('give').onclick=function(){ this.textContent='…'; api('santaGive',{code:v.code, pin:PIN}).then(function(r){ show(r); $('code').value=''; $('code').focus(); }, fail); };
}
function fail(e){ $('res').innerHTML='<div class="panel"><div class="big" style="color:#C8102E">'+esc(e.message)+'</div></div>'; }
$('code').onkeydown=function(e){ if (e.key==='Enter') $('look').onclick(); };
$('pin').onkeydown=function(e){ if (e.key==='Enter') $('go').onclick(); };
document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.toggle('on', x===b); });
    $('chk').classList.toggle('hide', b.dataset.t!=='chk'); $('st').classList.toggle('hide', b.dataset.t!=='st');
    clearInterval(timer); if (b.dataset.t==='st'){ stats().catch(function(){}); timer=setInterval(function(){ stats().catch(function(){}); },30000); }
  };
});
</script>
</body>
</html>
