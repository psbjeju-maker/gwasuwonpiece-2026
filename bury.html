<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2a1606">
<title>보물 묻기 — 과수원피스</title>
<style>
:root{--bg:#1b0f05;--sf:#2a1a0c;--sf2:#3a2614;--line:rgba(255,255,255,.12);--tx:#F6EFE4;--dim:#C9B9A4;--mut:#8f7d68;
  --acc:#FFB43A;--ink:#2b1702;--ok:#5FD18A;--bad:#F0605A;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + var(--safe))}
h1{font-size:21px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--dim);font-size:13px;margin:0}
.card{background:var(--sf);border-radius:16px;padding:16px;margin-top:14px}
.btn{min-height:52px;padding:0 18px;border-radius:14px;background:var(--sf2);font-weight:800;font-size:16px}
.btn--p{background:var(--acc);color:var(--ink)}
.btn--b{width:100%}
.btn--sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1}
input,select,textarea{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px}
textarea{min-height:72px;padding:10px 14px;resize:vertical}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px;font-weight:800}
.msg{margin-top:10px;font-weight:800;min-height:1.4em}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.gps{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:15px;color:var(--dim);text-align:center}
.gps b{color:var(--tx);font-size:18px}
.gps.ok{border-style:solid;border-color:rgba(95,209,138,.6)}
.gps.warn{border-style:solid;border-color:rgba(255,180,58,.6)}
.envtag{font-size:14px;padding:3px 10px;border-radius:99px;vertical-align:middle;background:#1E5AA8;color:#fff}
.envtag.test{background:#E8742A}
.envbar{font-size:14px;margin:6px 0 0;color:var(--dim)}
.envbar a{font-weight:800}
.grid4{display:grid;grid-template-columns:52px 1fr 70px;gap:6px;align-items:center}
.grid4 .img{grid-column:2/4;min-height:40px;font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--sf2);font-size:12px;font-weight:800;white-space:nowrap}
.chip.active{background:rgba(95,209,138,.18);color:var(--ok)}
.chip.off{background:rgba(240,96,90,.18);color:var(--bad)}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.item .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .top b{flex:1;min-width:120px}
.item .note{color:var(--dim);font-size:13px;margin-top:4px;word-break:break-all}
.item a{color:var(--acc)}
.grid{display:grid;grid-template-columns:70px 1fr 74px;gap:6px 8px;align-items:center}
.grid span{font-weight:800;font-size:14px;color:var(--dim)}
.grid input{min-height:44px;font-size:15px}
.who{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--dim)}
.who span{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>보물 관리 <span class="envtag">본 행사</span></h1>
  <p class="sub">과수원피스 · 보물 위치를 옮기거나 새로 묻을 때만 써요.</p>

  <div class="card" id="loginBox">
    <h2>관리자 로그인</h2>
    <label for="pin">관리자 PIN</label>
    <input id="pin" type="password" autocomplete="off">
    <div class="row"><button class="btn btn--p" id="btnLogin">로그인</button></div>
    <p class="msg" id="loginMsg"></p>
  </div>

  <div id="main" hidden>
    <div class="who"><span id="who"></span><button class="btn btn--sm" id="btnLogout">로그아웃</button></div>

    <div class="card" id="rehCard">
      <h2>리허설 · 정식 시작</h2>
      <p class="sub" id="rehState">불러오는 중…</p>
      <div class="row"><button class="btn btn--b" id="btnPractice" disabled>-</button></div>
      <div class="row"><button class="btn btn--b" id="btnReset" style="background:var(--bad);color:#fff">전부 초기화 (보물 기록 · 이름 등록한 사람)</button></div>
      <p class="msg" id="rehMsg"></p>
    </div>

    <div class="card">
      <h2>내 위치</h2>
      <div class="gps" id="gpsBox">위치 확인 중…</div>
      <p class="sub" style="margin-top:8px">보물 위치를 옮기려면 그 자리에 서서 오차가 ±15m 이하로 뜰 때까지 기다린 뒤, 아래 목록에서 「여기로 위치 옮기기」를 누르세요.</p>
    </div>

    <div class="card">
      <div class="row" style="margin-top:0;align-items:center"><h2 style="margin:0">보물 목록</h2><button class="btn btn--sm" id="btnReload" style="flex:0 0 auto">새로고침</button></div>
      <div id="spots"><p class="sub">불러오는 중…</p></div>
    </div>

    <div class="card">
      <h2>보물 추가</h2>
      <p class="sub">서 있는 자리에 새 보물을 하나 더 묻어요. 이름을 비우면 번호가 자동으로 붙어요.</p>
      <label for="name">이름 (비워도 됨)</label>
      <input id="name" maxlength="30">
      <label for="task">상자 과제</label>
      <select id="task"><option value="quiz">오타쿠 퀴즈</option><option value="monster">몬스터 전투</option></select>
      <select id="monster" style="margin-top:8px" hidden></select>
      <div class="row"><button class="btn btn--p btn--b" id="btnBury" disabled>여기에 묻기</button></div>
      <p class="msg" id="buryMsg"></p>
    </div>

    <div class="card">
      <h2>당첨자</h2>
      <div id="winners"><p class="sub">-</p></div>
      <p class="sub" style="margin-top:8px">상품 지급은 스태프 콘솔 「수령 처리」에서 당첨 코드로 해요.</p>
    </div>
  </div>
</div>

<script src="ev-client.js?v=9"></script>
<script>
(function(){
'use strict';
var EID='gwasu', TIER_TXT={TOP:'특상',A:'A',B:'B',C:'C',D:'D',E:'E',FREE:'무료권',X:'꽝'};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function msg(el,t,cls){el.textContent=t||'';el.className='msg'+(cls?' '+cls:'')}
function dt(ms){return ms?new Date(ms+9*3600e3).toISOString().slice(5,16).replace('T',' '):'-'}
function distM(a,b){var R=6371000,r=function(x){return x*Math.PI/180},dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);return 2*R*Math.asin(Math.sqrt(h))}
/* 몬스터 10종(서버 handlers.js MONSTERS 와 같아야 함) */
var MONS={slime:['슬라임','가위바위보'],frog:['개구리','가위바위보'],bat:['박쥐','사투리 퀴즈'],snake:['뱀','사투리 퀴즈'],goblin:['고블린','포토카드 만들기'],orc:['오크','포토카드 만들기'],skeleton:['스켈레톤','SNS 올리기'],troll:['트롤','SNS 올리기'],vampire:['뱀파이어','사탕 받아오기'],knight:['돌하르방 기사','사탕 받아오기']};
$('#monster').innerHTML=Object.keys(MONS).map(function(k){return '<option value="'+k+'">'+MONS[k][0]+' · '+MONS[k][1]+'</option>'}).join('');
$('#task').onchange=function(){$('#monster').hidden=this.value!=='monster'};
var pos=null, watchId=null, SPOTS=[];

function showMain(){
  var i=EV.sessionInfo(), ok=!!i&&i.role==='admin';
  if(i&&!ok) EV.logout();
  $('#loginBox').hidden=ok; $('#main').hidden=!ok;
  if(!ok) return;
  $('#who').textContent='관리자로 로그인됨 · '+dt(i.exp)+'까지';
  startGps(); load();
}
$('#btnLogin').onclick=function(){
  var b=this;b.disabled=true;msg($('#loginMsg'),'확인 중…');
  EV.pinLogin($('#pin').value.trim(),'admin').then(function(){b.disabled=false;$('#pin').value='';msg($('#loginMsg'),'');showMain()},
    function(e){b.disabled=false;msg($('#loginMsg'),e.message||'로그인하지 못했어요','bad')});
};
$('#pin').addEventListener('keydown',function(e){if(e.key==='Enter')$('#btnLogin').click()});
$('#btnLogout').onclick=function(){EV.logout();showMain()};

function startGps(){
  if(watchId!=null) return;
  var box=$('#gpsBox');
  if(!navigator.geolocation){box.textContent='이 브라우저는 위치 확인이 안 돼요.';return}
  watchId=navigator.geolocation.watchPosition(function(p){
    pos={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};
    box.className='gps '+(pos.acc<=15?'ok':'warn');
    box.innerHTML='<b>'+pos.lat+', '+pos.lng+'</b><br>오차 약 ±'+pos.acc+'m'+(pos.acc>15?' — 잠깐 기다리면 더 정확해져요':' — 좋아요');
    $('#btnBury').disabled=false;
  },function(e){box.className='gps';box.textContent='위치를 못 받았어요: '+(e.message||e.code)+' — 브라우저 위치 권한을 허용해 주세요.'},
  {enableHighAccuracy:true,maximumAge:0,timeout:20000});
}

function autoName(){var n=0;SPOTS.forEach(function(x){var m=/^보물 (\d+)$/.exec(x.name||'');if(m)n=Math.max(n,+m[1])});return '보물 '+('0'+(n+1)).slice(-2)}
$('#btnBury').onclick=function(){
  if(!pos) return;
  var b=this; b.disabled=true; msg($('#buryMsg'),'묻는 중…');
  EV.staff('ownerDigBury',{eventId:EID,lat:pos.lat,lng:pos.lng,acc:pos.acc,name:$('#name').value.trim()||autoName(),task:$('#task').value,monster:$('#monster').value}).then(function(r){
    b.disabled=false; msg($('#buryMsg'),'묻었어요! ('+(r.name||r.id)+' · 오차 ±'+r.acc+'m)','ok'); $('#name').value=''; load();
  },function(e){b.disabled=false;msg($('#buryMsg'),e.message||'묻지 못했어요','bad')});
};

var PRACTICE=null;
function rehShow(c){
  PRACTICE=!!c.practice;
  $('#rehState').innerHTML=PRACTICE?'지금 <b style="color:var(--acc)">무한 체험 중</b> — 횟수 제한 없음, 상품 재고도 안 줄어요.':'지금 <b style="color:var(--ok)">정식 운영 중</b> — 1인 '+(c.basePlays||10)+'회, 상품 재고가 줄어요.';
  var b=$('#btnPractice'); b.disabled=false; b.textContent=PRACTICE?'정식 시작 (1인 10회로 바꾸기)':'무한 체험으로 되돌리기';
  b.className='btn btn--b'+(PRACTICE?' btn--p':'');
}
$('#btnPractice').onclick=function(){
  var b=this, to=!PRACTICE;
  if(!to&&!confirm('정식 시작할까요? 지금부터 1인 10회로 제한되고 상품 재고가 줄어요. (시작 전에 아래 「전부 초기화」를 먼저 눌렀는지 확인!)')) return;
  b.disabled=true; msg($('#rehMsg'),'바꾸는 중…');
  EV.staff('ownerDigPractice',{eventId:EID,on:to,basePlays:10}).then(function(c){rehShow(c);msg($('#rehMsg'),to?'무한 체험으로 바꿨어요.':'정식 시작! 이제 1인 10회예요.','ok')},function(e){b.disabled=false;msg($('#rehMsg'),e.message||'바꾸지 못했어요','bad')});
};
$('#btnReset').onclick=function(){
  var w=prompt('보물찾기 기록, 이름 등록한 사람, 상품 재고를 전부 지워요. 되돌릴 수 없어요.
계속하려면 「초기화」라고 입력하세요.');
  if(w===null) return;
  if(w.trim()!=='초기화'){msg($('#rehMsg'),'확인 문구가 맞지 않아요.','bad');return}
  var b=this; b.disabled=true; msg($('#rehMsg'),'지우는 중… (잠시 걸려요)');
  EV.staff('ownerDigRehearsalReset',{eventId:EID,confirm:'초기화'}).then(function(r){b.disabled=false;msg($('#rehMsg'),'초기화 완료 — 참가자 '+r.accounts+'명 삭제'+(r.kept?' ('+r.kept+'명은 탐라문화제 기록이 있어 계정 유지)':''),'ok');load()},function(e){b.disabled=false;msg($('#rehMsg'),e.message||'초기화하지 못했어요','bad')});
};
function load(){EV.staff('staffDigStatus',{eventId:EID}).then(render,function(e){$('#spots').innerHTML='<p class="msg bad">'+esc(e.message||'못 불러왔어요')+'</p>'})}
$('#btnReload').onclick=load;
function render(r){
  if(r.cfg) rehShow(r.cfg);
  SPOTS=r.spots.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});
  $('#spots').innerHTML=SPOTS.length?SPOTS.map(function(x){
    var d=pos?Math.round(distM(pos,x)):null;
    return '<div class="item"><div class="top"><b>'+esc(x.name||('자리 '+x.id))+'</b><span class="chip '+x.status+'">'+(x.status==='active'?'켜짐':'꺼짐')+'</span><span class="chip">'+(x.task==='monster'?'몬스터':'퀴즈')+'</span></div>'+
      '<div class="row">'+
      '<button class="btn btn--sm" data-mv="'+esc(x.id)+'">여기로 위치 옮기기</button>'+
      '<button class="btn btn--sm" data-st="'+(x.status==='active'?'off':'active')+'" data-id="'+esc(x.id)+'">'+(x.status==='active'?'끄기':'켜기')+'</button>'+
      '<button class="btn btn--sm" data-st="delete" data-id="'+esc(x.id)+'">삭제</button></div>'+
      '<div class="note">판 사람 '+(x.digs||0)+' · 당첨 '+(x.wins||0)+(d!=null?' · 지금 여기서 '+d+'m':'')+' · <a target="_blank" rel="noopener" href="https://maps.google.com/?q='+x.lat+','+x.lng+'">지도</a></div></div>';
  }).join(''):'<p class="sub">아직 묻은 보물이 없어요.</p>';
  $('#winners').innerHTML=r.winners.length?'<table><tr><th>시각</th><th>닉네임</th><th>상품</th><th>코드</th><th></th></tr>'+
    r.winners.sort(function(a,b){return (b.at||0)-(a.at||0)}).map(function(w){return '<tr><td>'+dt(w.at).slice(6)+'</td><td>'+esc(w.nickname)+'</td><td>'+esc(TIER_TXT[w.tier])+' '+esc(w.prize)+'</td><td>'+esc(w.pickupCode)+'</td><td>'+(w.given?'지급':'')+'</td></tr>'}).join('')+'</table>':'<p class="sub">아직 없어요.</p>';
}
$('#spots').addEventListener('click',function(e){
  var m=e.target.closest('[data-mv]');
  if(m){
    if(!pos){alert('아직 내 위치를 못 받았어요. 잠깐 기다렸다가 다시 눌러 주세요.');return}
    if(!confirm(pos.acc>15?'위치 오차가 ±'+pos.acc+'m예요. 그래도 여기로 옮길까요?':'이 보물을 지금 서 있는 자리로 옮길까요?')) return;
    m.disabled=true;
    EV.staff('ownerDigSpotStatus',{eventId:EID,id:m.dataset.mv,lat:pos.lat,lng:pos.lng,acc:pos.acc}).then(load,function(er){m.disabled=false;alert(er.message||'옮기지 못했어요')});
    return;
  }
  var b=e.target.closest('[data-st]'); if(!b) return;
  if(b.dataset.st==='delete'&&!confirm('이 보물을 삭제할까요?')) return;
  b.disabled=true;
  EV.staff('ownerDigSpotStatus',{eventId:EID,id:b.dataset.id,status:b.dataset.st}).then(load,function(er){b.disabled=false;alert(er.message||'바꾸지 못했어요')});
});

showMain();
setInterval(function(){if(!$('#main').hidden&&!EV.sessionInfo())showMain()},30000);
})();
</script>
</body>
</html>
