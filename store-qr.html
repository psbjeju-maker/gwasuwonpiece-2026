<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>매장 보물찾기 QR</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0,#1c3a63 0,#0d2547 70%);color:#fff;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{display:flex;align-items:center;justify-content:center;gap:5vmin;padding:4vmin;width:100%;max-width:1400px}
.left{text-align:center;flex:1}
.left h1{margin:0;font-size:clamp(34px,6.4vmin,76px);line-height:1.15;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.left h1 b{color:#FFB547}
.left p{margin:2vmin 0 0;font-size:clamp(18px,3vmin,34px);line-height:1.5;color:#dbe6f5}
.tan{width:min(30vmin,260px);height:auto;margin:0 auto 2vmin;display:block;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-1.6vmin) rotate(3deg)}}
.card{background:#fff;color:#111;border-radius:4vmin;padding:3.2vmin;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);flex:0 0 auto}
.card img{display:block;width:min(52vmin,520px);height:auto;image-rendering:pixelated}
.card span{display:block;margin-top:1.6vmin;font-size:clamp(18px,3.2vmin,34px);font-weight:800;color:#B8530A}
.steps{display:flex;gap:1.4vmin;justify-content:center;margin-top:3vmin;flex-wrap:wrap}
.steps i{font-style:normal;background:rgba(255,255,255,.12);border-radius:99px;padding:1vmin 2.2vmin;font-size:clamp(15px,2.4vmin,26px);font-weight:700}
@media (max-aspect-ratio:1/1){.stage{flex-direction:column}}
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <svg class="tan" viewBox="0 0 200 200" role="img" aria-label="귤">
      <defs>
        <radialGradient id="sk" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#FFD36B"/><stop offset=".45" stop-color="#FF9A1F"/><stop offset="1" stop-color="#E4660A"/></radialGradient>
        <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7BD35B"/><stop offset="1" stop-color="#2E8B3A"/></linearGradient>
      </defs>
      <ellipse cx="100" cy="186" rx="58" ry="8" fill="rgba(0,0,0,.28)"/>
      <path d="M100 38c44 0 78 30 78 70 0 42-34 74-78 74s-78-32-78-74c0-40 34-70 78-70z" fill="url(#sk)"/>
      <ellipse cx="72" cy="78" rx="22" ry="12" fill="#fff" opacity=".35" transform="rotate(-30 72 78)"/>
      <g fill="#C95508" opacity=".35"><circle cx="60" cy="120" r="2"/><circle cx="82" cy="140" r="2"/><circle cx="120" cy="152" r="2"/><circle cx="146" cy="126" r="2"/><circle cx="138" cy="90" r="2"/><circle cx="106" cy="118" r="2"/><circle cx="92" cy="96" r="2"/></g>
      <path d="M100 40c-6-8-4-16 0-20 4 4 6 12 0 20z" fill="#6B4A1F"/>
      <path d="M102 42c10-24 40-28 58-18-6 22-34 34-58 18z" fill="url(#lf)"/>
      <path d="M104 41c14-8 30-12 46-12" stroke="#2E8B3A" stroke-width="2" fill="none" opacity=".7"/>
      <path d="M98 42c-8-12-30-14-44-4 8 18 30 24 44 4z" fill="url(#lf)"/>
    </svg>
    <h1>황금 귤을<br><b>찾아라!</b></h1>
    <p>가게 안에 숨은 보물 10개를 찾아보세요</p>
    <div class="steps"><i>① QR 찍기</i><i>② 닉네임 입력</i><i>③ 보물 찾아 열기</i></div>
  </div>
  <div class="card">
    <img id="q" alt="보물찾기 QR">
    <span>휴대폰 카메라로 찍어 주세요</span>
  </div>
</div>
<script src="qr.js"></script>
<script>
(function(){
  /* 매장 테스트 보물찾기(?ev=test) 손님 앱 주소. 본 행사 주소로 바꾸려면 ?ev=test만 지운다 */
  var base=location.href.replace(/[^/]*([?#].*)?$/,'');
  var url=base+'?ev=test';
  var q=qrcode(0,'M');q.addData(url);q.make();
  document.getElementById('q').src=q.createDataURL(12,2);
  document.title='매장 보물찾기 QR';
})();
</script>
</body>
</html>
